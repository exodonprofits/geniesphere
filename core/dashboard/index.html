<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GenieSphere Dashboard</title>
  <link rel="stylesheet" href="/shared/css/app.css" />
</head>
<body data-gs-shell="dashboard">
  <main class="gs-shell gs-stack">
    <div class="gs-spread">
      <div>
        <h1 id="greeting" style="margin:0">Welcome</h1>
        <p id="household-name" class="gs-muted" style="margin:4px 0 0"></p>
      </div>
      <label id="switcher-wrap" class="gs-row" hidden>Household
        <select id="switcher" class="gs-input"></select>
      </label>
    </div>
    <p id="status" class="gs-status" role="status"></p>

    <section class="gs-grid">
      <article class="gs-card"><h2>Grocery Genie</h2><p class="gs-muted">Shared shopping list for your household.</p><a href="/modules/grocery/index.html">Open</a></article>
      <article class="gs-card"><h2>Nutrition Genie</h2><p class="gs-muted">Meal planning and family food preferences.</p><a href="/modules/nutrition/index.html">Open</a></article>
      <article class="gs-card"><h2>Home Genie</h2><p class="gs-muted">Maintenance, inventory, warranties, reminders.</p><a href="/modules/home/index.html">Open</a></article>
    </section>

    <section class="gs-card gs-stack">
      <h2 style="margin:0">Open household tasks</h2>
      <ul id="tasks" class="gs-list"></ul>
    </section>
  </main>

  <script src="/shared/vendor/supabase.min.js"></script>
  <script src="/shared/js/app-config.js"></script>
  <script src="/shared/js/gs-client.js"></script>
  <script src="/shared/js/gs-auth.js"></script>
  <script src="/shared/components/gs-shell.js"></script>
  <script src="/core/household/household.js"></script>
  <script>
    (function () {
      var GS = window.GenieSphere;
      var status = document.getElementById('status');

      function show(message, isError) {
        status.textContent = message || '';
        status.classList.toggle('gs-error', !!isError);
      }

      function greeting() {
        var h = new Date().getHours();
        return h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
      }

      function renderSwitcher(ctx) {
        var wrap = document.getElementById('switcher-wrap');
        var select = document.getElementById('switcher');
        if (ctx.households.length < 2) return;
        select.textContent = '';
        ctx.households.forEach(function (h) {
          var option = document.createElement('option');
          option.value = h.id;
          option.textContent = h.name;
          option.selected = h.id === ctx.householdId;
          select.appendChild(option);
        });
        select.addEventListener('change', async function () {
          try {
            await GS.household.setCurrent(select.value);
            window.location.reload();
          } catch (err) { show(err.message, true); }
        });
        wrap.hidden = false;
      }

      function renderTasks(rows) {
        var list = document.getElementById('tasks');
        list.textContent = '';
        if (!rows.length) {
          var empty = document.createElement('li');
          empty.className = 'gs-muted';
          empty.textContent = 'No open tasks.';
          list.appendChild(empty);
          return;
        }
        rows.forEach(function (task) {
          var li = document.createElement('li');
          var title = document.createElement('span');
          title.className = 'gs-grow';
          title.textContent = task.title;
          li.appendChild(title);
          if (task.due_at) {
            var due = document.createElement('span');
            due.className = 'gs-muted';
            due.textContent = 'Due ' + new Date(task.due_at).toLocaleDateString();
            li.appendChild(due);
          }
          list.appendChild(li);
        });
      }

      async function loadTasks(householdId) {
        var result = await GS.getSupabase()
          .from('household_tasks')
          .select('id, title, due_at, status')
          .eq('household_id', householdId)
          .is('completed_at', null)
          .not('status', 'in', '(done,completed,cancelled)')
          .order('due_at', { ascending: true, nullsFirst: false })
          .limit(5);
        if (result.error) throw result.error;
        return result.data || [];
      }

      (async function init() {
        try {
          var session = await GS.auth.requireSession();
          if (!session) return;
          document.getElementById('greeting').textContent = greeting();

          var ctx = await GS.household.current();
          if (!ctx) {
            document.getElementById('household-name').textContent = 'You are not part of a household yet.';
            renderTasks([]);
            return;
          }
          document.getElementById('household-name').textContent = ctx.name;
          renderSwitcher(ctx);
          renderTasks(await loadTasks(ctx.householdId));
        } catch (err) {
          show(err.message || 'Could not load the dashboard.', true);
        }
      })();
    })();
  </script>
</body>
</html>
