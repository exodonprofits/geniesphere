<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tasks · GenieSphere</title>
  <link rel="icon" type="image/png" href="/shared/assets/logo/geniesphere_logo.png" />
  <link rel="stylesheet" href="/shared/css/app.css" />
</head>
<body data-gs-shell="tasks">
  <main class="gs-shell" style="max-width:820px">
    <header class="gs-page-header">
      <div>
        <p class="gs-eyebrow"><span data-gs-icon="list"></span>Core</p>
        <h1 class="gs-title">Tasks</h1>
        <p class="gs-subtitle">Shared household tasks</p>
      </div>
    </header>

    <section class="gs-panel">
      <div class="gs-panel-head">
        <div class="gs-panel-head-left">
          <span class="gs-panel-icon" data-gs-icon="list"></span>
          <div>
            <h2 class="gs-panel-title">Coming in GenieSphere 0.1</h2>
            <p class="gs-panel-sub">Your most urgent open tasks are on the dashboard today.</p>
          </div>
        </div>
        <span class="gs-pill gs-pill-lg">Not set up</span>
      </div>
      <div class="gs-panel-body">
        <p style="margin:0;font-size:15px;line-height:1.6">One task list for the whole household. Home Genie maintenance and Nutrition reminders will add tasks here.</p>
      </div>
      <div class="gs-panel-foot">
        <span>Nothing to do here yet.</span>
        <a href="/core/dashboard/index.html#open-tasks" class="gs-item-action">See open tasks →</a>
      </div>
    </section>
  </main>

  <script src="/shared/vendor/supabase.min.js"></script>
  <script src="/shared/js/app-config.js"></script>
  <script src="/shared/js/gs-client.js"></script>
  <script src="/shared/js/gs-auth.js"></script>
  <script src="/shared/components/gs-shell.js"></script>
  <script>
    window.GenieSphere.auth.requireSession().catch(function () {
      window.location.href = '/core/auth/login.html';
    });
  </script>
</body>
</html>
