<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Management | GenieSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.04);
      padding: 2rem;
      border-radius: 1rem;
    }
    label {
      display: block;
      margin: 1rem 0 0.5rem;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: none;
      margin-bottom: 1rem;
      background-color: #1e293b;
      color: white;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      border: none;
      border-radius: 0.5rem;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    table {
      width: 100%;
      margin-top: 2rem;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem;
      border: 1px solid #334155;
      text-align: left;
    }
    th {
      background-color: #1e293b;
    }
    .back-button {
      display: inline-block;
      margin-top: 2rem;
      text-decoration: none;
      background: #2BFFD9;
      color: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🪙 Token Management</h1>
  <div class="container">
    <label for="user">User Email</label>
    <input type="email" id="user" placeholder="Enter user email" />

    <label for="amount">Tokens</label>
    <input type="number" id="amount" placeholder="Amount of tokens" />

    <button onclick="grantTokens()">➕ Grant Tokens</button>

    <table id="tokenTable">
      <thead>
        <tr><th>User</th><th>Tokens</th><th>Updated</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <a href="admin_dashboard.html" class="back-button">⬅️ Back to Dashboard</a>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://pbojacnagutipfhcxltj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0'
    );

    async function grantTokens() {
      const email = document.getElementById("user").value;
      const amount = parseInt(document.getElementById("amount").value);
      if (!email || isNaN(amount)) return alert("Fill in both fields correctly");

      const { data: user } = await supabase.from("user_preferences").select("user_id, token_balance").eq("email", email).single();

      if (!user) return alert("User not found.");

      const newBalance = (user.token_balance || 0) + amount;

      await supabase.from("user_preferences").update({
        token_balance: newBalance,
        updated_at: new Date().toISOString()
      }).eq("user_id", user.user_id);

      alert("✅ Tokens granted");
      loadTokenTable();
    }

    async function loadTokenTable() {
      const { data: rows } = await supabase.from("user_preferences").select("email, token_balance, updated_at");
      const tbody = document.querySelector("#tokenTable tbody");
      tbody.innerHTML = "";
      rows.forEach(row => {
        tbody.innerHTML += `<tr><td>${row.email}</td><td>${row.token_balance || 0}</td><td>${new Date(row.updated_at).toLocaleString()}</td></tr>`;
      });
    }

    loadTokenTable();
  </script>
</body>
</html>
