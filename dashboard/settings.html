<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings | GenieSphere</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      max-width: 500px;
      margin: auto;
    }
    h2 {
      font-size: 1.25rem;
      margin-top: 2rem;
      color: #334155;
    }
    label {
      display: block;
      padding: 10px;
      background: #e2e8f0;
      margin-top: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-right: 10px;
    }
    button {
      margin-top: 2rem;
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: #6366f1;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>⚙️ Settings</h1>
  <form id="settingsForm">
    <h2>Categories</h2>
    <label><input type="checkbox" name="categories" value="Personal" />Household</label>
    <label><input type="checkbox" name="categories" value="Business" />Business</label>
    <label><input type="checkbox" name="categories" value="Leisure" />Leisure</label>
    <label><input type="checkbox" name="categories" value="Investment" />Investment</label>

    <h2>Agents</h2>
    <label><input type="checkbox" name="agents" value="Household Genie" />Household Genie</label>
    <label><input type="checkbox" name="agents" value="Salon Genie" />Salon Genie</label>
    <label><input type="checkbox" name="agents" value="Rental Genie" />Rental Genie</label>
    <label><input type="checkbox" name="agents" value="Payroll Master" />Payroll Master</label>
    <label><input type="checkbox" name="agents" value="Smart Travel Hub" />Smart Travel Hub</label>
    <label><input type="checkbox" name="agents" value="Market Intelligence" />Market Intelligence</label>

    <button type="submit">Save Changes</button>
  </form>

  <script>
    const supabase = createClient('https://YOUR_PROJECT_ID.supabase.co', 'YOUR_PUBLIC_ANON_KEY');

    async function loadPreferences() {
      const session = await supabase.auth.getSession();
      const userId = session.data?.session?.user?.id;
      if (!userId) return alert("You must be logged in.");

      const { data, error } = await supabase.from('user_preferences').select('*').eq('user_id', userId).single();
      if (error || !data) return;

      const categories = data.categories || [];
      const agents = data.agents || [];

      document.querySelectorAll('input[name="categories"]').forEach(cb => {
        if (categories.includes(cb.value)) cb.checked = true;
      });
      document.querySelectorAll('input[name="agents"]').forEach(cb => {
        if (agents.includes(cb.value)) cb.checked = true;
      });
    }

    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const session = await supabase.auth.getSession();
      const userId = session.data?.session?.user?.id;
      if (!userId) return alert("You must be logged in.");

      const selectedCategories = Array.from(document.querySelectorAll('input[name="categories"]:checked')).map(cb => cb.value);
      const selectedAgents = Array.from(document.querySelectorAll('input[name="agents"]:checked')).map(cb => cb.value);

      const { error } = await supabase.from('user_preferences').upsert({
        user_id: userId,
        categories: selectedCategories,
        agents: selectedAgents,
        updated_at: new Date().toISOString()
      });

      if (error) return alert("Error saving settings.");
      alert("✅ Preferences saved.");
      window.location.href = "/dashboard/index.html";
    });

    loadPreferences();
  </script>
</body>
</html>
