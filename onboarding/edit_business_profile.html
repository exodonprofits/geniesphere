<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Business Profile | GenieSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, select, textarea {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      background-color: #2BFFD9;
      color: #0F172A;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>✏️ Edit Your Business Profile</h1>
  <form id="editBusinessForm">
    <input type="text" id="business_name" placeholder="Business Name" required />
    <input type="text" id="location" placeholder="Business Location (optional)" />
    <select id="agent_code" required>
      <option value="">Select Your Primary Agent</option>
      <option value="salon_genie">Salon Genie</option>
      <option value="rental_genie">Rental Genie</option>
      <option value="email_genie">Email Genie</option>
    </select>
    <textarea id="notes" rows="4" placeholder="Business Description or Notes (optional)"></textarea>
    <button type="submit">💾 Save Changes</button>
  </form>

  <script>
    const supabase = window.supabase.createClient(
      'https://pbojacnagutipfhcxltj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0'

    );

    async function loadBusinessProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Not authenticated");

      const { data: profile, error } = await supabase
        .from('business_profiles')
        .select('*')
        .eq('owner_id', user.id)
        .maybeSingle();

      if (error || !profile) return alert("Unable to load business profile");

      document.getElementById('business_name').value = profile.business_name || '';
      document.getElementById('location').value = profile.location || '';
      document.getElementById('agent_code').value = profile.agent_code || '';
      document.getElementById('notes').value = profile.notes || '';
    }

    document.getElementById('editBusinessForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Not authenticated");

      const updates = {
        business_name: document.getElementById('business_name').value,
        location: document.getElementById('location').value,
        agent_code: document.getElementById('agent_code').value,
        notes: document.getElementById('notes').value
      };

      const { error } = await supabase
        .from('business_profiles')
        .update(updates)
        .eq('owner_id', user.id);

      if (error) return alert("Update failed: " + error.message);

      alert("✅ Business profile updated!");
      window.location.href = "/dashboard/owner_dashboard.html";
    });

    loadBusinessProfile();
  </script>
</body>
</html>
