<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧑‍💼 Profile Settings | GenieSphere</title>
  <script defer src="profile-settings.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .form {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input, select {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: 600;
      padding: 0.75rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #16a34a;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>🧑‍💼 Profile Settings</h1>
  <p>Update your name and preferred role in GenieSphere.</p>

  <form class="form" id="profileForm">
    <div>
      <label for="name">🙋 Your Name</label>
      <input type="text" id="name" placeholder="e.g. Jimmy Tran" />
    </div>

    <div>
      <label for="role">🎭 Role</label>
      <select id="role">
        <option value="owner">Business Owner</option>
        <option value="admin">Admin</option>
        <option value="employee">Employee</option>
        <option value="user">Client / User</option>
      </select>
    </div>

    <button type="submit">💾 Save Profile</button>
    <div id="profileStatus" class="status"></div>
  </form>

</body>
</html>
