<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔑 API Key Settings | GenieSphere</title>
  <script defer src="api-key-settings.js"></script>
  <style>
    body {
      background-color: #f9fafb;
      color: #1f2937;
      font-family: sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      max-width: 400px;
      width: 100%;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .field label {
      font-weight: 600;
      margin-bottom: 0.25rem;
      display: block;
    }

    .input {
      width: 100%;
      padding: 0.5rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    .btn {
      flex: 1;
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .btn-save {
      background-color: #16a34a;
      color: white;
    }

    .btn-save:hover {
      background-color: #15803d;
    }

    .btn-clear {
      background-color: #2563eb;
      color: white;
    }

    .btn-clear:hover {
      background-color: #1d4ed8;
    }

    .status {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: #4b5563;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">🔐 Your API Key Settings</h1>

    <form id="apiKeyForm" class="form">
      <div class="field">
        <label for="apiKey">🔑 API Key (e.g., Twelve Data)</label>
        <input type="text" id="apiKey" name="apiKey" placeholder="Paste your API key..." class="input" />
      </div>

      <div class="buttons">
        <button type="submit" class="btn btn-save">💾 Save Key</button>
        <button type="button" id="clearBtn" class="btn btn-clear">❌ Clear</button>
      </div>
    </form>

    <div id="statusMsg" class="status">Status message will appear here.</div>
  </div>

</body>
</html>
