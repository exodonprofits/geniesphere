<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Your Agents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto 2rem;
    }
    label.card {
      display: block;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
      width: 200px;
    }
    label.card:hover {
      transform: translateY(-4px);
    }
    input[type="checkbox"] {
      display: none;
    }
    input[type="checkbox"]:checked + label {
      background-color: #1d4ed8;
      border-color: #3b82f6;
    }
    .icon {
      font-size: 2rem;
    }
    .save-button {
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 12px;
      background-color: #22c55e;
      color: white;
      border: none;
      cursor: pointer;
    }
    .save-button:hover {
      background-color: #16a34a;
    }
    .category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
    .back-button {
      display: inline-block;
      background-color: #3b82f6;
      color: white;
      padding: 10px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
    }

    .back-button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <script type="module" src="/shared/js/header-dark.js"></script>
  <h1>✨ Select Your Preferred AI Agents</h1>
  <form id="agentForm">
    <div class="grid" id="agentGrid">
      <!-- Agent cards will be inserted here -->
    </div>
    <button class="save-button" type="submit">Save Selection</button>
  </form>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://pbojacnagutipfhcxltj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0'
    );

    document.addEventListener("DOMContentLoaded", () => {

      async function renderForm() {
        const urlParams = new URLSearchParams(window.location.search);
        const rawCategories = urlParams.get("from");
        const filterCategories = rawCategories
          ? rawCategories.toLowerCase().split(',').map(c => c.trim())
          : ['personal', 'business', 'investment', 'leisure'];

        console.log("Filtering categories:", filterCategories);

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const { data: prefs } = await supabase
          .from('user_preferences')
          .select('agents')
          .eq('user_id', user.id)
          .single();

        const selected = prefs?.agents || [];

        const { data: availableAgents, error } = await supabase
          .from('agents')
          .select('id, name, icon, category');

        if (error || !availableAgents) {
          console.error("Error loading agents:", error);
          return;
        }

        console.log("Loaded agents:", availableAgents);

        const grid = document.getElementById('agentGrid');
        grid.innerHTML = '';

        filterCategories.forEach(category => {
          const group = availableAgents.filter(agent =>
            (agent.category || '').toLowerCase() === category
          );

          const heading = document.createElement('h2');
          heading.textContent = category.charAt(0).toUpperCase() + category.slice(1);
          heading.style.margin = '2rem 0 1rem';
          heading.style.color = '#facc15';

          const row = document.createElement('div');
          row.className = 'category-row';

          if (group.length === 0) {
            const emptyMessage = document.createElement('p');
            emptyMessage.textContent = `No agents available for "${category}"`;
            emptyMessage.style.color = '#94a3b8';
            emptyMessage.style.fontStyle = 'italic';
            row.appendChild(emptyMessage);
          } else {
            group.forEach(agent => {
              const input = document.createElement('input');
              input.type = 'checkbox';
              input.id = agent.id;
              input.name = 'agents';
              input.value = agent.id;
              if (selected.includes(agent.id)) input.checked = true;

              const label = document.createElement('label');
              label.className = 'card';
              label.setAttribute('for', agent.id);
              label.innerHTML = `<div class="icon">${agent.icon}</div><div>${agent.name}</div>`;

              row.appendChild(input);
              row.appendChild(label);
            });
          }

          grid.appendChild(heading);
          grid.appendChild(row);
        });
      }

      renderForm();

      document.getElementById('agentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const checkboxes = document.querySelectorAll('input[name="agents"]:checked');
        const selected = Array.from(checkboxes).map(cb => cb.value);

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        // Fetch current preferences
        const { data: prefs } = await supabase
          .from('user_preferences')
          .select('agents')
          .eq('user_id', user.id)
          .single();

        const current = prefs?.agents || [];
        const removedAgents = current.filter(a => !selected.includes(a));

        // Fetch full agent metadata including table + column info
        const { data: allAgents, error: agentError } = await supabase
          .from('agents')
          .select('id, data_table, user_column');

        if (agentError || !allAgents) {
          console.error("Error loading agent metadata:", agentError);
          alert("Unable to verify agent data.");
          return;
        }

        const agentMap = Object.fromEntries(allAgents.map(a => [a.id, a]));
        const blockedRemovals = [];

        for (const agentId of removedAgents) {
          const agent = agentMap[agentId];
          const table = agent?.data_table;
          const userCol = agent?.user_column;

          if (!table || !userCol) continue; // No data defined = safe to remove

          try {
            const { data, error } = await supabase
              .from(table)
              .select('id')
              .eq(userCol, user.id)
              .eq('agent_id', agentId)
              .limit(1);

            if (error && error.code !== '42703') {
              console.error(`Error checking data for agent ${agentId}:`, error);
              alert("Error checking agent data.");
              return;
            }

            if (data && data.length > 0) {
              blockedRemovals.push(agentId);
            }
          } catch (err) {
            console.warn(`Skipping check for agent ${agentId} due to unexpected error:`, err);
          }
        }

        if (blockedRemovals.length > 0) {
          alert(`You cannot remove agents with data tied to them: ${blockedRemovals.join(', ')}`);
          return;
        }

        const { error: saveError } = await supabase.from('user_preferences').upsert({
          user_id: user.id,
          agents: selected
        }, { onConflict: 'user_id' });

        if (saveError) {
          console.error("Error saving preferences:", saveError);
          alert("Failed to save preferences. Check console for details.");
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawCategories = urlParams.get("from") || "personal";

        alert('Preferences saved! Redirecting...');
        window.location.href = `/dashboard/category.html?cat=${rawCategories}`;
      });
    });
  </script>

  <div style="margin-top: 40px;">
    <a id="backBtn" class="back-button">⬅️ Back to Select Category</a>
  </div>

  <script>
    // Preserve selected categories when going back
    const raw = new URLSearchParams(window.location.search).get("from");
    if (raw) {
      const clean = raw.split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
      if (clean.length > 0) {
        document.getElementById("backBtn").href = `select-categories.html?selected=${clean.join(',')}`;
      }
    }
  </script>
</body>
</html>
