<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | GenieSphere</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: none;
      background-color: #0f172a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 1rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.cancel {
      background: #64748b;
      color: #f8fafc;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>🔐 Change Your Password</h1>
  <form id="passwordForm">
    <input type="password" id="newPassword" placeholder="New Password" required />
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
    <div class="button-group">
      <button type="submit">Update Password</button>
      <button type="button" class="cancel" onclick="history.back()">Cancel</button>
    </div>
  </form>
  <p id="message" class="message"></p>

  <script>
    const supabase = window.supabase.createClient(
      'https://YOUR-SUPABASE-PROJECT.supabase.co',
      'YOUR-PUBLIC-ANON-KEY'
    );

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('message');

      if (newPassword !== confirmPassword) {
        msg.textContent = '❌ Passwords do not match';
        msg.style.color = '#f87171'; // red-400
        return;
      }

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        msg.textContent = '❌ ' + error.message;
        msg.style.color = '#f87171'; // red-400
      } else {
        msg.textContent = '✅ Password updated successfully!';
        msg.style.color = '#4ade80'; // green-400
      }
    });
  </script>
</body>
</html>
