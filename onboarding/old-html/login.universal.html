<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in • GenieSphere</title>

  <!-- Shared GenieSphere config + auth stack -->
  <script>
    window.GS_CONFIG_URL = "/shared/config.json";
    window.GS_CONFIG_PATH = "/shared/config.json";
  </script>
  <script src="/shared/js/app-config.js?v=20260222a"></script>
  <script src="/shared/js/sb-client.js?v=20260222a"></script>
  <script src="/shared/js/auth-header.js?v=20260222a"></script>

  <style>
    :root{
      --radius: 7px;
      --card: rgba(255,255,255,0.88);
      --card2: rgba(255,255,255,0.78);
      --stroke: rgba(148,163,184,0.45);
      --text: #0b1220;
      --muted: #475569;
      --shadow: 0 20px 60px rgba(2,6,23,0.25);

      /* Brand universe accents (default) */
      --accent1: #4c6ef5; /* brand blue */
      --accent2: #22c55e; /* eco green */
      --accent3: #a855f7; /* cosmic purple */
      --glow: rgba(76,110,245,0.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(76,110,245,0.25), transparent 55%),
        radial-gradient(1000px 700px at 20% 90%, rgba(34,197,94,0.18), transparent 60%),
        radial-gradient(900px 600px at 90% 80%, rgba(168,85,247,0.18), transparent 60%),
        #020617;
      overflow-x:hidden;
    }

    /* Universe background image (optional) */
    .bg{
      position:fixed;
      inset:0;
      z-index:-2;
      background:
        linear-gradient(180deg, rgba(2,6,23,0.55), rgba(2,6,23,0.75)),
        url('/shared/img/genie-sphere-background.png') center/cover no-repeat;
      filter: saturate(1.05);
    }

    /* Ambient particles */
    .stars{
      position:fixed;
      inset:-20vh;
      z-index:-1;
      opacity:0.55;
      background:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.40), transparent 60%),
        radial-gradient(2px 2px at 30% 70%, rgba(255,255,255,0.25), transparent 60%),
        radial-gradient(1px 1px at 55% 35%, rgba(255,255,255,0.35), transparent 60%),
        radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.22), transparent 60%),
        radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.28), transparent 60%),
        radial-gradient(2px 2px at 15% 85%, rgba(255,255,255,0.22), transparent 60%);
      transform: translateZ(0);
      animation: drift 16s linear infinite;
    }
    @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vw, -2vh, 0)}}

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px 16px;
    }

    .shell{
      width:min(980px, 100%);
      display:grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      align-items:stretch;
    }

    @media (max-width: 900px){
      .shell{grid-template-columns: 1fr;}
    }

    .panel{
      border-radius: calc(var(--radius) + 10px);
      box-shadow: var(--shadow);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Left: brand universe */
    .brand{
      position:relative;
      padding: 22px 22px 20px;
      color: rgba(255,255,255,0.92);
      background:
        radial-gradient(1000px 700px at 20% 30%, rgba(34,197,94,0.18), transparent 55%),
        radial-gradient(900px 600px at 80% 20%, rgba(76,110,245,0.24), transparent 55%),
        radial-gradient(900px 600px at 80% 90%, rgba(168,85,247,0.18), transparent 58%),
        rgba(2,6,23,0.40);
    }

    .brandTop{
      display:flex;
      align-items:center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .logo{
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      display:grid;
      place-items:center;
      overflow:hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .logo img{width: 44px; height: 44px; object-fit:contain; display:block;}

    .brandName{font-weight: 800; letter-spacing: 0.2px;}
    .brandSub{font-size: 13px; opacity:0.85; margin-top: 2px;}

    .heroH1{
      font-size: 40px;
      line-height: 1.05;
      margin: 4px 0 10px;
      letter-spacing: -0.8px;
    }
    .heroP{
      margin: 0;
      opacity: 0.88;
      max-width: 44ch;
      font-size: 14.5px;
      line-height: 1.55;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 13px;
      opacity: 0.95;
    }

    .watermark{
      position:absolute;
      right: -40px;
      bottom: -40px;
      width: 260px;
      height: 260px;
      opacity: 0.22;
      filter: blur(0.2px) saturate(1.1);
      pointer-events:none;
      transform: rotate(-8deg);
    }

    /* Right: form */
    .auth{
      padding: 22px;
      background:
        radial-gradient(700px 500px at 70% 0%, rgba(76,110,245,0.18), transparent 55%),
        radial-gradient(650px 480px at 20% 100%, rgba(34,197,94,0.12), transparent 60%),
        rgba(255,255,255,0.06);
    }

    .card{
      border-radius: calc(var(--radius) + 10px);
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow: 0 14px 35px rgba(2,6,23,0.18);
      overflow:hidden;
    }

    .cardHead{
      padding: 18px 18px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.20);
      background:
        linear-gradient(90deg, rgba(76,110,245,0.12), rgba(34,197,94,0.08), rgba(168,85,247,0.10));
    }
    .cardTitle{
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .pill{
      font-size: 12px;
      font-weight: 700;
      color: #0b1220;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(148,163,184,0.35);
      padding: 6px 10px;
      border-radius: 999px;
      white-space:nowrap;
    }
    .cardSub{
      margin: 6px 0 0;
      color: rgba(2,6,23,0.70);
      font-size: 13px;
      line-height: 1.5;
    }

    .cardBody{ padding: 16px 18px 18px; }

    label{
      display:block;
      font-size: 12.5px;
      font-weight: 800;
      color: rgba(2,6,23,0.78);
      margin: 12px 0 6px;
    }

    .input{
      width:100%;
      padding: 11px 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(148,163,184,0.50);
      background: rgba(255,255,255,0.78);
      outline: none;
      font-size: 14px;
      transition: box-shadow .15s ease, border-color .15s ease, transform .08s ease;
    }
    .input:focus{
      border-color: rgba(76,110,245,0.75);
      box-shadow: 0 0 0 3px rgba(76,110,245,0.18);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .check{
      display:flex;
      align-items:center;
      gap: 10px;
      color: rgba(2,6,23,0.70);
      font-size: 13px;
      user-select:none;
    }
    .check input{ width: 16px; height: 16px; }

    .link{
      color: rgba(2,6,23,0.78);
      font-size: 13px;
      font-weight: 800;
      text-decoration:none;
      border-bottom: 1px solid rgba(2,6,23,0.18);
    }
    .link:hover{ border-bottom-color: rgba(2,6,23,0.35); }

    .btnRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    @media (max-width: 420px){
      .btnRow{grid-template-columns: 1fr;}
    }

    .btn{
      border: none;
      border-radius: 999px;
      padding: 11px 14px;
      font-weight: 900;
      font-size: 14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      transition: transform .08s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn:active{ transform: translateY(1px); }

    .btnPrimary{
      color: white;
      background: linear-gradient(90deg, var(--accent1), rgba(76,110,245,0.78));
      box-shadow: 0 14px 28px rgba(76,110,245,0.22);
    }
    .btnPrimary:hover{ filter: brightness(1.02); }

    .btnGhost{
      color: rgba(2,6,23,0.88);
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(148,163,184,0.45);
    }

    .status{
      margin-top: 12px;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      display:none;
      border: 1px solid rgba(148,163,184,0.40);
      background: rgba(255,255,255,0.65);
      color: rgba(2,6,23,0.80);
    }
    .status.error{
      display:block;
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.10);
      color: rgba(127,29,29,0.95);
    }
    .status.ok{
      display:block;
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.10);
      color: rgba(20,83,45,0.95);
    }

    .foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid rgba(148,163,184,0.18);
      color: rgba(2,6,23,0.60);
      font-size: 12.5px;
    }

    .hide{display:none !important;}
  
/* === Universe Single-Panel Overrides (v9) === */
body.gs-auth{min-height:100vh}
.bg-universe{
  position:fixed; inset:0;
  background-image:url('/shared/img/genie-sphere-background.png');
  background-size:cover; background-position:center;
  filter:saturate(1.1) contrast(1.05);
}
.bg-overlay{
  position:fixed; inset:0;
  background:
    radial-gradient(900px 600px at 55% 35%, rgba(46, 214, 255, .22), transparent 60%),
    radial-gradient(800px 520px at 30% 70%, rgba(120, 92, 255, .20), transparent 62%),
    linear-gradient(180deg, rgba(8,12,26,.80) 0%, rgba(8,12,26,.72) 35%, rgba(8,12,26,.86) 100%);
  backdrop-filter: blur(0px);
}
.wrap{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  width:min(520px, 100%);
  border-radius:18px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 18px 60px rgba(0,0,0,.45);
  overflow:hidden;
}
.card-head{
  padding:22px 22px 10px 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.brand{display:flex; gap:12px; align-items:center; margin-bottom:10px}
.brand-logo{width:42px; height:42px; border-radius:12px; background: rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); padding:6px}
.brand-name{font-weight:700; letter-spacing:.2px; color:rgba(255,255,255,.92)}
.brand-sub{font-size:12px; color:rgba(255,255,255,.70)}
.h1{margin:6px 0 6px 0; font-size:28px; line-height:1.1; color:rgba(255,255,255,.95)}
.sub{margin:0 0 10px 0; color:rgba(255,255,255,.72); font-size:14px}
.context-row{display:flex; align-items:center; gap:10px; margin-top:10px}
.context-pill{
  display:inline-flex; align-items:center; justify-content:center;
  height:26px; padding:0 10px; border-radius:999px;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.86);
  font-size:12px;
}
.context-note{font-size:12px; color:rgba(255,255,255,.65)}
.card-body{padding:18px 22px 18px 22px}
.form{display:flex; flex-direction:column; gap:10px}
.lbl{font-size:12px; color:rgba(255,255,255,.78); font-weight:600}
input[type="email"], input[type="password"]{
  width:100%;
  padding:12px 12px;
  border-radius:12px;
  background: rgba(10,14,30,.55);
  border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.92);
  outline:none;
}
input::placeholder{color:rgba(255,255,255,.45)}
input:focus{
  border-color: rgba(118, 208, 255, .65);
  box-shadow: 0 0 0 3px rgba(118, 208, 255, .22);
}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px}
.chk{display:flex; align-items:center; gap:10px; font-size:13px; color:rgba(255,255,255,.75)}
.chk input{width:16px; height:16px}
.link{color:rgba(173, 232, 255, .9); text-decoration:none; font-size:13px}
.link:hover{text-decoration:underline}
.btn{
  width:100%;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.16);
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn.primary{
  color:#07111f;
  background: linear-gradient(90deg, rgba(78,188,255,1) 0%, rgba(126,105,255,1) 100%);
  border-color: rgba(255,255,255,.10);
}
.btn.primary:hover{filter:brightness(1.02)}
.btn.ghost{
  background: rgba(255,255,255,.10);
  color: rgba(255,255,255,.88);
}
.btn.ghost:hover{background: rgba(255,255,255,.14)}
.btn-spin{
  width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(0,0,0,.18);
  border-top-color: rgba(0,0,0,.65);
  display:none;
  animation: spin 800ms linear infinite;
}
.btn.loading .btn-spin{display:inline-block}
.btn.loading{opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  color: rgba(255,255,255,.86);
  font-size:13px;
}
.msg.err{
  background: rgba(255, 77, 109, .12);
  border-color: rgba(255, 77, 109, .40);
}
.msg.ok{
  background: rgba(70, 255, 170, .10);
  border-color: rgba(70, 255, 170, .35);
}
.card-foot{
  padding:14px 22px 18px 22px;
  display:flex; justify-content:space-between; align-items:center;
  border-top: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.62);
  font-size:12px;
}
.card-foot a{color: rgba(255,255,255,.72); text-decoration:none}
.card-foot a:hover{text-decoration:underline}
.debug{
  position:fixed; left:12px; bottom:12px;
  padding:8px 10px; border-radius:10px;
  background: rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.16);
  color: rgba(255,255,255,.80);
  font-size:12px;
}

</style>
</head>

<body class="gs-auth gs-universe">
  <div class="bg-universe" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <main class="wrap" role="main">
    <section class="card" aria-label="Sign in">
      <header class="card-head">
        <div class="brand">
          <img class="brand-logo" src="/shared/img/genie-logo.png" alt="GenieSphere" onerror="this.style.display='none'">
          <div class="brand-meta">
            <div class="brand-name" id="brandName">GenieSphere</div>
            <div class="brand-sub" id="brandSub">Your AI Agent Hub</div>
          </div>
        </div>

        <h1 class="h1" id="pageTitle">Sign in</h1>
        <p class="sub" id="pageSubtitle">Use your email and password to continue.</p>

        <div class="context-row">
          <span class="context-pill" id="contextPill" title="This adjusts based on where you came from">✨</span>
          <span class="context-note" id="contextNote">Powered by GenieSphere</span>
        </div>
      </header>

      <div class="card-body">
        <form id="loginForm" class="form" autocomplete="on" novalidate>
          <label class="lbl" for="email">Email</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" required>

          <label class="lbl" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>

          <div class="row">
            <label class="chk">
              <input id="remember" type="checkbox" checked>
              <span>Remember me</span>
            </label>
            <a class="link" id="forgotLink" href="#" role="button">Forgot password?</a>
          </div>

          <button id="btnLogin" class="btn primary" type="submit">
            <span class="btn-label">Sign in</span>
            <span class="btn-spin" aria-hidden="true"></span>
          </button>

          <button id="btnSignup" class="btn ghost" type="button">Create account</button>

          <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
        </form>
      </div>

      <footer class="card-foot">
        <span class="foot-left" id="poweredBy">Powered by GenieSphere</span>
        <a class="foot-right" id="backHome" href="/">Back to home</a>
      </footer>
    </section>
  </main>

  <!-- Minimal debug pill (hidden unless ?debug=1) -->
  <div class="debug" id="debugBar" hidden>
    <span id="debugText">debug</span>
  </div>


<script>
  // UI compatibility shims (v9 single-panel)
  (function(){
    // If old scripts expect these IDs, provide them as aliases
    const map = [
      ['heroTitle','pageTitle'],
      ['heroSubtitle','pageSubtitle'],
      ['agentTitle','pageTitle']
    ];
    map.forEach(([oldId,newId])=>{
      if(!document.getElementById(oldId)){
        const el = document.getElementById(newId);
        if(el){
          const clone = el; // reuse
          clone.id = newId; // ensure
        }
      }
    });
  })();
</script>

</body>
</html>
