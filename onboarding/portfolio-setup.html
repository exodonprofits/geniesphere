<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📈 Portfolio Setup | GenieSphere</title>
  <script defer src="portfolio-setup.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .form {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: 600;
      padding: 0.75rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #16a34a;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>📈 Portfolio Setup</h1>
  <p>Enter your default stock tickers (comma-separated) for AI analysis.</p>

  <form class="form" id="portfolioForm">
    <div>
      <label for="tickers">💼 Ticker Symbols</label>
      <input type="text" id="tickers" placeholder="e.g. AAPL, TSLA, MSFT" />
    </div>
    <button type="submit">💾 Save Portfolio</button>
    <div id="status" class="status"></div>
  </form>

</body>
</html>
