<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invite Team Member | GenieSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    button {
      padding: 12px;
      background-color: #2BFFD9;
      color: #0F172A;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📨 Invite Team Member</h1>
  <form id="inviteForm">
    <input type="email" id="email" placeholder="Email address" required />
    <select id="role" required>
      <option value="">Select Role</option>
      <option value="employee">Employee / Staff</option>
      <option value="client">Client / Tenant</option>
    </select>
    <select id="agent" required>
      <option value="">Select Agent Access</option>
      <option value="salon_genie">Salon Genie</option>
      <option value="rental_genie">Rental Genie</option>
      <option value="email_genie">Email Genie</option>
    </select>
    <button type="submit">➕ Send Invite</button>
  </form>

  <script>
    const supabase = window.supabase.createClient(
      'https://pbojacnagutipfhcxltj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    );

    document.getElementById('inviteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;
      const agent = document.getElementById('agent').value;

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Not logged in");

      // Step 1: Send Supabase invitation
      const { data: invitedUser, error: inviteError } = await supabase.auth.admin.createUser({
        email,
        email_confirm: true,
        user_metadata: { invited_by: user.id }
      });

      if (inviteError) return alert("Invite error: " + inviteError.message);

      // Step 2: Insert into user_preferences
      const invitedUserId = invitedUser.user?.id;
      const { error: prefErr } = await supabase.from("user_preferences").insert([
        {
          user_id: invitedUserId,
          role,
          agents: [agent],
          business_id: user.id
        }
      ]);

      if (prefErr) return alert("Error saving user preferences: " + prefErr.message);

      alert("✅ Invitation sent to " + email);
      document.getElementById("inviteForm").reset();
    });
  </script>
</body>
</html>
