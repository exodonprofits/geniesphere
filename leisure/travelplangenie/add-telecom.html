<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➕ Add Phone, TV & Internet</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-xl mx-auto p-4 sm:p-6">
    <h1 class="text-3xl font-bold text-center mb-6">➕ Add Phone, TV & Internet</h1>
    <div class="bg-white p-6 rounded-2xl shadow">
      <form id="telecomForm" class="space-y-4">
        <div>
          <label class="block font-semibold">📋 Service Type</label>
          <input type="text" name="service_type" placeholder="e.g. Mobile Plan, Cable, Internet" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block font-semibold">🏢 Provider</label>
          <input type="text" name="provider" placeholder="e.g. AT&T, Comcast, Verizon" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block font-semibold">💵 Monthly Amount</label>
          <input type="number" step="0.01" name="amount" placeholder="e.g. 79.99" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block font-semibold">📆 Due Date</label>
          <input type="date" name="due_date" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block font-semibold">🔗 Portal URL</label>
          <input type="url" name="portal_url" placeholder="https://example.com" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block font-semibold">📝 Notes</label>
          <textarea name="notes" placeholder="Bundle info, discounts, etc." class="w-full p-2 border rounded"></textarea>
        </div>
        <div class="flex justify-center">
          <button type="submit" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full hover:bg-green-700 transition">
            💾 Save
          </button>
        </div>
      </form>
    </div>
    <div class="text-center mt-4">
      <a href="telecom-tracker.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700 transition w-max mx-auto">
        ⬅️ Back to Phone, TV & Internet
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = createClient('https://pbojacnagutipfhcxltj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0');

    const form = document.getElementById('telecomForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const user = await supabase.auth.getUser();
      const payload = Object.fromEntries(formData.entries());
      payload.user_id = user.data.user.id;
      payload.category = 'telecom';

      const { error } = await supabase.from('household_bills').insert([payload]);
      if (error) return alert('Error saving: ' + error.message);
      window.location.href = 'telecom-tracker.html';
    });
  </script>
</body>
</html>
