<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

          🚀 Generate Travel Plan
          <div class="loading-spinner"></div>
        </button>
        <div id="form-status" class="hidden mt-4 p-3 rounded-md text-center"></div>
      </form>
      <a href="index.html" class="back-link">← Back to Home</a>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-center py-8">
    <p class="text-sm">© 2025 VoyageGenie.com – Plan Less, Explore More ✈️🌍</p>
    <div class="mt-4 flex justify-center space-x-6">
      <a href="#" class="text-blue-500 hover:underline" aria-label="Visit our Facebook page">Facebook</a>
      <a href="#" class="text-blue-500 hover:underline" aria-label="Visit our Instagram page">Instagram</a>
      <a href="contact.html" class="text-blue-500 hover:underline" aria-label="Contact Us">Contact Us</a>
    </div>
    <div class="mt-4">
      <a href="index.html#home" class="text-blue-500 hover:underline mx-2" aria-label="Go to Home">Home</a>
      <a href="features.html" class="text-blue-500 hover:underline mx-2" aria-label="Go to Features">Features</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('travelForm');
      const airportSelect = document.getElementById('airportSelect');
      const customAirportInput = document.getElementById('customAirportInput');
      const customAirportDiv = document.querySelector('.custom-airport-input');
      const citySelect = document.getElementById('citySelect');
      const customCityInput = document.getElementById('customCityInput');
      const customCityDiv = document.querySelector('.custom-city-input');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const budgetInput = document.getElementById('budget');
      const displayPlanCheckbox = document.getElementById('displayPlan');
      const submitBtn = form.querySelector('button[type="submit"]');
      const formStatus = document.getElementById('form-status');

      // Toggle Custom Airport Input
      const toggleCustomAirport = () => {
        if (airportSelect.value === 'OTHER') {
          customAirportDiv.classList.remove('hidden');
          customAirportInput.disabled = false;
          customAirportInput.required = true;
          airportSelect.required = false;
        } else {
          customAirportDiv.classList.add('hidden');
          customAirportInput.disabled = true;
          customAirportInput.required = false;
          airportSelect.required = true;
        }
      };

      // Toggle Custom City Input
      const toggleCustomCity = () => {
        if (citySelect.value === 'OTHER') {
          customCityDiv.classList.remove('hidden');
          customCityInput.disabled = false;
          customCityInput.required = true;
          citySelect.required = false;
        } else {
          customCityDiv.classList.add('hidden');
          customCityInput.disabled = true;
          customCityInput.required = false;
          citySelect.required = true;
        }
      };

      // Option Card Selection
      document.querySelectorAll('.option-card').forEach(item => {
        item.addEventListener('click', function() {
          const input = this.querySelector('input');
          if (input.type === 'radio') {
            document.querySelectorAll(`input[name="${input.name}"]`).forEach(radio => {
              radio.closest('.option-card').classList.remove('selected');
            });
            input.checked = true;
            this.classList.add('selected');
          } else if (input.type === 'checkbox') {
            input.checked = !input.checked;
            this.classList.toggle('selected', input.checked);
          }
        });

        // Keyboard Navigation
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

      // Date Validation
      endDateInput.addEventListener('change', () => {
        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);
        if (startDate && endDate && endDate <= startDate) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Check-out date must be after check-in date.';
          endDateInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Budget Validation
      budgetInput.addEventListener('input', () => {
        if (budgetInput.value < 0) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Budget cannot be negative.';
          budgetInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Processing... <div class="loading-spinner" style="display:inline-block;"></div>';

        const formData = new FormData(form);
        if (airportSelect.value === 'OTHER') {
          const customValue = customAirportInput.value.trim();
          if (customValue) formData.set('departureLocation', customValue);
        }
        if (citySelect.value === 'OTHER') {
          const customValue = customCityInput.value.trim();
          if (customValue) formData.set('destinationCity', customValue);
        }
        const displayValue = displayPlanCheckbox.checked ? 'true' : 'false';
        formData.set('display', displayValue);

        try {
          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook-test/airbnb-travel-agent', {
            method: 'POST',
            body: formData,
            redirect: 'follow'
          });

          if (response.ok || response.redirected) {
            if (displayPlanCheckbox.checked) {
              // Browser follows redirect to workflow_confirmation.html?itineraryId=<id>
            } else {
              window.location.href = 'workflow_confirmation.html';
            }
          } else {
            const errorText = await response.text();
            throw new Error(`Submission failed with status ${response.status}: ${errorText}`);
          }
        } catch (error) {
          console.error('Error during form submission:', error);
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = `Submission failed: ${error.message}. Please try again.`;
          submitBtn.disabled = false;
          submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 5000);
        }
      });

      // Event Listeners
      airportSelect.addEventListener('change', toggleCustomAirport);
      citySelect.addEventListener('change', toggleCustomCity);
      toggleCustomAirport();
      toggleCustomCity();

      // Reset on page restore
      window.addEventListener('pageshow', () => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
      });

      // Hamburger Menu Toggle
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      // Close menu when a link is clicked
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });
    });
  </script>
</body>
</html>
