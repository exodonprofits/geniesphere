                var filteredData = jsonData.filter(row => row.some(filledCell));

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('travelForm');
      const destinationSelect = document.getElementById('destinationSelect');
      const customDestinationInput = document.getElementById('customDestinationInput');
      const customDestinationDiv = document.querySelector('.custom-destination-input');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const budgetInput = document.getElementById('budget');
      const submitBtn = form.querySelector('.submit-btn');
      const resetBtn = form.querySelector('.reset-btn');
      const formStatus = document.getElementById('form-status');
      const mainContent = document.getElementById('main-content');

      // Toggle Custom Destination Input
      const toggleCustomDestination = () => {
        if (destinationSelect.value === 'OTHER') {
          customDestinationDiv.classList.remove('hidden');
          customDestinationInput.disabled = false;
          customDestinationInput.required = true;
          destinationSelect.required = false;
        } else {
          customDestinationDiv.classList.add('hidden');
          customDestinationInput.disabled = true;
          customDestinationInput.required = false;
          destinationSelect.required = true;
        }
      };

      // Option Card Selection
      document.querySelectorAll('.option-card').forEach(item => {
        item.addEventListener('click', function(e) {
          e.preventDefault(); // Prevent any default form behavior
          const input = this.querySelector('input');
          if (!input) return; // Ensure input exists

          if (input.type === 'radio') {
            // Deselect all other radio buttons in the same group
            document.querySelectorAll(`input[name="${input.name}"]`).forEach(radio => {
              radio.closest('.option-card').classList.remove('selected');
              radio.checked = false;
            });
            input.checked = true;
            this.classList.add('selected');
          } else if (input.type === 'checkbox') {
            input.checked = !input.checked;
            this.classList.toggle('selected', input.checked);
          }

          // Log the current state for debugging
          console.log(`${input.name}: ${input.value} - Checked: ${input.checked}`);
        });

        // Keyboard Navigation
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

      // Date Validation
      endDateInput.addEventListener('change', () => {
        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);
        if (startDate && endDate && endDate <= startDate) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'End date must be after start date.';
          endDateInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Budget Validation
      budgetInput.addEventListener('input', () => {
        if (budgetInput.value < 0) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Budget cannot be negative.';
          budgetInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Load previous form data if available
      const savedFormData = localStorage.getItem('formData');
      if (savedFormData) {
        const formData = JSON.parse(savedFormData);
        
        // Populate departureLocation
        if (formData.departureLocation) {
          document.getElementById('departureLocation').value = formData.departureLocation;
        }

        // Populate adventureDestination
        if (formData.adventureDestination) {
          if (formData.adventureDestination === 'OTHER') {
            destinationSelect.value = 'OTHER';
            toggleCustomDestination();
            customDestinationInput.value = formData.customDestination || '';
          } else {
            destinationSelect.value = formData.adventureDestination;
          }
        }

        // Populate activityType (checkboxes)
        if (formData.activityType) {
          const activityTypes = Array.isArray(formData.activityType) ? formData.activityType : [formData.activityType];
          document.querySelectorAll('input[name="activityType"]').forEach(input => {
            if (activityTypes.includes(input.value)) {
              input.checked = true;
              input.closest('.option-card').classList.add('selected');
            }
          });
        }

        // Populate intensity (radio)
        if (formData.intensity) {
          const intensityInput = document.querySelector(`input[name="intensity"][value="${formData.intensity}"]`);
          if (intensityInput) {
            intensityInput.checked = true;
            intensityInput.closest('.option-card').classList.add('selected');
          }
        }

        // Populate startDate and endDate
        startDateInput.value = formData.startDate || '';
        endDateInput.value = formData.endDate || '';

        // Populate tripType (radio)
        if (formData.tripType) {
          const tripTypeInput = document.querySelector(`input[name="tripType"][value="${formData.tripType}"]`);
          if (tripTypeInput) {
            tripTypeInput.checked = true;
            tripTypeInput.closest('.option-card').classList.add('selected');
          }
        }

        // Populate environment (checkboxes)
        if (formData.environment) {
          const environments = Array.isArray(formData.environment) ? formData.environment : [formData.environment];
          document.querySelectorAll('input[name="environment"]').forEach(input => {
            if (environments.includes(input.value)) {
              input.checked = true;
              input.closest('.option-card').classList.add('selected');
            }
          });
        }

        // Populate groupSize (radio)
        if (formData.groupSize) {
          const groupSizeInput = document.querySelector(`input[name="groupSize"][value="${formData.groupSize}"]`);
          if (groupSizeInput) {
            groupSizeInput.checked = true;
            groupSizeInput.closest('.option-card').classList.add('selected');
          }
        }

        // Populate ageRange (checkboxes)
        if (formData.ageRange) {
          const ageRanges = Array.isArray(formData.ageRange) ? formData.ageRange : [formData.ageRange];
          document.querySelectorAll('input[name="ageRange"]').forEach(input => {
            if (ageRanges.includes(input.value)) {
              input.checked = true;
              input.closest('.option-card').classList.add('selected');
            }
          });
        }

        // Populate budget
        budgetInput.value = formData.budget || '';

        // Populate email
        document.getElementById('email').value = formData.email || '';
      }

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Processing... <div class="loading-spinner" style="display:inline-block;"></div>';

        const formData = new FormData(form);
        if (destinationSelect.value === 'OTHER') {
          const customDest = customDestinationInput.value.trim();
          if (customDest) formData.set('adventureDestination', customDest);
        }

        // Log the FormData to verify values
        const formDataObj = {};
        formData.forEach((value, key) => {
          if (formDataObj[key]) {
            if (!Array.isArray(formDataObj[key])) {
              formDataObj[key] = [formDataObj[key]];
            }
            formDataObj[key].push(value);
          } else {
            formDataObj[key] = value;
          }
        });
        console.log('FormData before submission:', JSON.stringify(formDataObj, null, 2));
        localStorage.setItem('formData', JSON.stringify(formDataObj));
        console.log('Stored formData in localStorage:', JSON.stringify(formDataObj, null, 2));

        try {
          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/adventure-travel-agent', {
            method: 'POST',
            body: formData
          });
          if (response.ok) {
            const htmlContent = await response.text();
            console.log('Received HTML content from server:', htmlContent.substring(0, 500));
            // Validate that the response looks like HTML
            if (htmlContent && htmlContent.includes('<div') && htmlContent.includes('</div>')) {
              localStorage.removeItem('itineraryHtml');
              localStorage.setItem('itineraryHtml', htmlContent);
              console.log('Stored itineraryHtml in localStorage:', localStorage.getItem('itineraryHtml').substring(0, 500));
              // Ensure localStorage write is complete before redirect
              setTimeout(() => {
                window.location.href = 'workflow_confirmation.html';
              }, 100);
            } else {
              throw new Error('Invalid response format: Expected HTML content.');
            }
          } else {
            throw new Error('Submission failed with status: ' + response.status);
          }
        } catch (error) {
          console.error('Form submission error:', error);
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Submission failed: ' + error.message + '. Please try again.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Reset Form
      resetBtn.addEventListener('click', () => {
        // Reset the form inputs
        form.reset();
        
        // Clear selected option cards
        document.querySelectorAll('.option-card').forEach(card => {
          card.classList.remove('selected');
        });
        
        // Reset custom destination input visibility
        toggleCustomDestination();
        
        // Clear localStorage form data
        localStorage.removeItem('formData');
        
        // Notify user
        formStatus.className = 'bg-green-100 text-green-600';
        formStatus.classList.remove('hidden');
        formStatus.textContent = 'Form has been reset.';
        setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
      });

      // Event Listeners
      destinationSelect.addEventListener('change', toggleCustomDestination);
      toggleCustomDestination();

      // Reset on page restore
      window.addEventListener('pageshow', () => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
      });

      // Hamburger Menu Toggle
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      // Close menu when a link is clicked
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });
    });
  </script>
