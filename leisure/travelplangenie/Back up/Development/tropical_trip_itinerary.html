  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const updatePage = (data) => {
        document.getElementById('trip-title').textContent = data.tripTitle || 'Your Tropical Trip Plan';
        let itineraryContent = '';
        // Add trip details at the top
        itineraryContent += `<p><strong>Travel Dates:</strong> ${data.dates || 'Not specified'}</p>`;
        itineraryContent += `<p><strong>Departure Location:</strong> ${data.departure || 'Not specified'}</p>`;
        itineraryContent += `<p><strong>Destination:</strong> ${data.tripTitle.split(': ')[1] || data.tripTitle}</p>`;
        itineraryContent += `<p><strong>Group Size:</strong> ${data.groupSize || 'Not specified'}</p>`;
        itineraryContent += `<p><strong>Budget:</strong> ${data.budget || 'Not specified'}</p>`;
        itineraryContent += '_____<br>';
        // Add the main itinerary content
        itineraryContent += (data.itinerary || 'No itinerary found.')
          .replace(/###/g, '<h3>')
          .replace(/####/g, '<h4>')
          .replace(/\n/g, '<br>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        if (data.costSummary) {
          itineraryContent += '<h3>Summary Cost</h3>';
          itineraryContent += '<p>Below is the estimated cost breakdown to help you prepare your overall budget.</p>';
          itineraryContent += '<table style="width:100%; border-collapse: collapse; margin: 1rem 0;">';
          itineraryContent += '<tr style="background-color: #f4f8fb;"><th style="border: 1px solid #d1d5db; padding: 0.5rem; text-align: left;">Category</th><th style="border: 1px solid #d1d5db; padding: 0.5rem; text-align: left;">Cost</th></tr>';
          for (const [category, cost] of Object.entries(data.costSummary)) {
            itineraryContent += `<tr><td style="border: 1px solid #d1d5db; padding: 0.5rem;">${category}</td><td style="border: 1px solid #d1d5db; padding: 0.5rem;">${cost}</td></tr>`;
          }
          itineraryContent += '<tr style="font-weight: bold;"><td style="border: 1px solid #d1d5db; padding: 0.5rem;">Total</td><td style="border: 1px solid #d1d5db; padding: 0.5rem;">$' + 
            Object.values(data.costSummary).reduce((sum, cost) => sum + parseFloat(cost.replace(/[^0-9.]/g, '')), 0).toFixed(2) + '</td></tr>';
          itineraryContent += '</table>';
        } else {
          itineraryContent += '<p>No cost summary available. Please modify your itinerary to include budget details.</p>';
        }
        document.getElementById('itinerary').innerHTML = itineraryContent;
      };

      // Dynamically load itinerary data from sessionStorage based on itineraryId
      const urlParams = new URLSearchParams(window.location.search);
      const itineraryId = urlParams.get('itineraryId');

      if (itineraryId) {
        try {
          const itineraryDataStr = sessionStorage.getItem(`itinerary_${itineraryId}`);
          if (itineraryDataStr) {
            const data = JSON.parse(itineraryDataStr);
            updatePage(data);
            window.itineraryData = data;
            window.itineraryId = itineraryId;
          } else {
            throw new Error('Itinerary data not found in sessionStorage');
          }
        } catch (error) {
          console.error('Error retrieving itinerary:', error);
          document.getElementById('itinerary').innerHTML = `Failed to load itinerary: ${error.message}. Please submit a new trip plan via the <a href="tropical_trip_plan_form.html">form</a>.`;
        }
      } else {
        document.getElementById('itinerary').innerHTML = 'No itinerary ID provided. Please submit a new trip plan via the <a href="tropical_trip_plan_form.html">form</a>.';
      }

      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      hamburger.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          navLinks.classList.toggle('active');
        }
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });

      const actionIcons = document.querySelectorAll('.action-buttons i');
      actionIcons.forEach(icon => {
        icon.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            icon.click();
          }
        });
      });
    });

    function printItinerary() {
      window.print();
    }

    async function emailItinerary() {
      if (!window.itineraryData || !window.itineraryId) {
        alert('Itinerary data not available. Please reload the page and try again.');
        return;
      }

      const email = window.itineraryData.email;
      const itineraryId = window.itineraryId;
      const data = window.itineraryData;

      try {
        const response = await fetch(`https://exodonprofits.app.n8n.cloud/webhook/tropical-travel-agent?itineraryId=${itineraryId}&email=${encodeURIComponent(email)}&destination=${encodeURIComponent(data.tripTitle.split(': ')[1] || data.tripTitle)}&departure=${encodeURIComponent(data.departure)}&dates=${encodeURIComponent(data.dates)}&groupSize=${encodeURIComponent(data.groupSize)}&budget=${encodeURIComponent(data.budget)}&tripType=${encodeURIComponent(data.tripType)}&ageRange=${encodeURIComponent(data.ageRange)}&dayActivity=${encodeURIComponent(data.dayActivity)}&nightActivity=${encodeURIComponent(data.nightActivity)}&itinerary=${encodeURIComponent(data.itinerary)}`, {
          method: 'GET'
        });

        if (response.ok) {
          alert('Itinerary link sent to your email successfully!');
        } else {
          const errorText = await response.text();
          throw new Error(`Failed to send email with status ${response.status}: ${errorText}`);
        }
      } catch (error) {
        console.error('Error sending email:', error);
        alert(`Failed to send email: ${error.message}. Please try again.`);
      }
    }

    function modifyItinerary() {
      window.location.href = 'tropical_trip_plan_form.html';
    }
