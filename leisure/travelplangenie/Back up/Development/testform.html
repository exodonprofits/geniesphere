<!DOCTYPE html>
<html>
<body>
  <form id="testForm" method="POST">
    <input type="text" name="destination" value="Jamaica">
    <input type="text" name="departure" value="ORD">
    <input type="text" name="dates" value="2025-07-01 – 2025-07-06">
    <input type="text" name="groupSize" value="2">
    <input type="text" name="budget" value="$4000">
    <input type="text" name="email" value="user@example.com">
    <button type="submit">Submit</button>
  </form>
  <script>
    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      console.log('Sending form data:', Object.fromEntries(formData));
      try {
        const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/tropical-travel-agent', {
          method: 'POST',
          body: formData
        });
        const text = await response.text();
        console.log('Response:', text);
      } catch (error) {
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
