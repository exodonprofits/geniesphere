  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const updatePage = (data) => {
        document.getElementById('trip-title').textContent = data.tripTitle || 'Your Tropical Trip Plan';
        const itineraryContent = (data.itinerary || 'No itinerary found.')
          .replace(/###/g, '<h3>')
          .replace(/####/g, '<h4>')
          .replace(/\n/g, '<br>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        document.getElementById('itinerary').innerHTML = itineraryContent;
      };

      const urlParams = new URLSearchParams(window.location.search);
      const itineraryId = urlParams.get('itineraryId');

      if (itineraryId) {
        try {
          const itineraryDataStr = sessionStorage.getItem(`itinerary_${itineraryId}`);
          if (itineraryDataStr) {
            const data = JSON.parse(itineraryDataStr);
            updatePage(data);
            window.itineraryData = data;
            window.itineraryId = itineraryId;
          } else {
            throw new Error('Itinerary data not found in sessionStorage');
          }
        } catch (error) {
          console.error('Error retrieving itinerary:', error);
          document.getElementById('itinerary').textContent = `Failed to load itinerary: ${error.message}. Please try again.`;
        }
      } else {
        updatePage({
          tripTitle: 'Your Tropical Trip Plan',
          itinerary: 'No itinerary found.'
        });
      }

      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });

      // Add keyboard support for icons
      const actionIcons = document.querySelectorAll('.action-buttons i');
      actionIcons.forEach(icon => {
        icon.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            icon.click();
          }
        });
      });
    });

    function printItinerary() {
      window.print();
    }

    async function emailItinerary() {
      if (!window.itineraryData || !window.itineraryId) {
        alert('Itinerary data not available. Please reload the page and try again.');
        return;
      }

      const email = window.itineraryData.email;
      const itineraryId = window.itineraryId;
      const data = window.itineraryData;

      try {
        const response = await fetch(`https://exodonprofits.app.n8n.cloud/webhook/send-itinerary-email?itineraryId=${itineraryId}&email=${encodeURIComponent(email)}&destination=${encodeURIComponent(data.tripTitle.split(': ')[1])}&departure=${encodeURIComponent(data.departure)}&dates=${encodeURIComponent(data.dates)}&groupSize=${encodeURIComponent(data.groupSize)}&budget=${encodeURIComponent(data.budget)}&tripType=${encodeURIComponent(data.tripType)}&ageRange=${encodeURIComponent(data.ageRange)}&dayActivity=${encodeURIComponent(data.dayActivity)}&nightActivity=${encodeURIComponent(data.nightActivity)}&itinerary=${encodeURIComponent(data.itinerary)}`, {
          method: 'GET'
        });

        if (response.ok) {
          alert('Itinerary link sent to your email successfully!');
        } else {
          const errorText = await response.text();
          throw new Error(`Failed to send email with status ${response.status}: ${errorText}`);
        }
      } catch (error) {
        console.error('Error sending email:', error);
        alert(`Failed to send email: ${error.message}. Please try again.`);
      }
    }

    function modifyItinerary() {
      window.location.href = 'tropical_trip_plan_form.html';
    }
  </script>
