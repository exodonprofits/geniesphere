<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('travelForm');
      const airportSelect = document.getElementById('airportSelect');
      const customAirportInput = document.getElementById('customAirportInput');
      const customAirportDiv = document.querySelector('.custom-airport-input');
      const destinationSelect = document.getElementById('destinationSelect');
      const customDestInput = document.getElementById('customDestinationInput');
      const customDestDiv = document.querySelector('.custom-destination-input');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const budgetInput = document.getElementById('budget');
      const submitBtn = form.querySelector('button[type="submit"]');
      const formStatus = document.getElementById('form-status');

      // Toggle Custom Airport Input
      const toggleCustomAirport = () => {
        if (airportSelect.value === 'OTHER') {
          customAirportDiv.classList.remove('hidden');
          customAirportInput.disabled = false;
          customAirportInput.required = true;
          airportSelect.required = false;
        } else {
          customAirportDiv.classList.add('hidden');
          customAirportInput.disabled = true;
          customAirportInput.required = false;
          airportSelect.required = true;
        }
      };

      // Toggle Custom Destination Input
      const toggleCustomDestination = () => {
        if (destinationSelect.value === 'OTHER') {
          customDestDiv.classList.remove('hidden');
          customDestInput.disabled = false;
          customDestInput.required = true;
          destinationSelect.required = false;
        } else {
          customDestDiv.classList.add('hidden');
          customDestInput.disabled = true;
          customDestInput.required = false;
          destinationSelect.required = true;
        }
      };

      // Option Card Selection
      document.querySelectorAll('.option-card').forEach(item => {
        item.addEventListener('click', function() {
          const input = this.querySelector('input');
          if (input.type === 'radio') {
            document.querySelectorAll(`input[name="${input.name}"]`).forEach(radio => {
              radio.closest('.option-card').classList.remove('selected');
            });
            input.checked = true;
            this.classList.add('selected');
          } else if (input.type === 'checkbox') {
            input.checked = !input.checked;
            this.classList.toggle('selected', input.checked);
          }
        });

        // Keyboard Navigation
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

      // Date Validation
      endDateInput.addEventListener('change', () => {
        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);
        if (startDate && endDate && endDate <= startDate) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'End date must be after start date.';
          endDateInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Budget Validation
      budgetInput.addEventListener('input', () => {
        if (budgetInput.value < 0) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Budget cannot be negative.';
          budgetInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Processing... <div class="loading-spinner" style="display:inline-block;"></div>';

        const formData = new FormData(form);
        const displayCheckbox = document.getElementById('displayOnScreen');
        const displayChoice = displayCheckbox && displayCheckbox.checked ? 'true' : 'false';
        formData.set('displayOnScreen', displayChoice);
        
        if (airportSelect.value === 'OTHER') {
          const customValue = customAirportInput.value.trim();
          if (customValue) formData.set('departureLocation', customValue);
        }
        if (destinationSelect.value === 'OTHER') {
          const customDest = customDestInput.value.trim();
          if (customDest) formData.set('destination', customDest);
        }

        try {
          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/travel-agent', {
            method: 'POST',
            body: formData
          });
          if (response.ok) {
            const destination = formData.get('destination') || 'default';
        if (formData.get('displayOnScreen') === 'true') {
          window.location.href = 'workflow_confirmation.html?destination=' + encodeURIComponent(destination);
        } else {
          window.location.href = 'workflow_confirmation.html';
        }
          } else {
            throw new Error('Submission failed.');
          }
        } catch (error) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Submission failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Event Listeners
      airportSelect.addEventListener('change', toggleCustomAirport);
      destinationSelect.addEventListener('change', toggleCustomDestination);
      toggleCustomAirport();
      toggleCustomDestination();

      // Reset on page restore
      window.addEventListener('pageshow', () => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
      });
    });
  </script>
