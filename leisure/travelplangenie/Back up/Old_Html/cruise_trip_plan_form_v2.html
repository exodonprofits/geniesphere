<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

      <a href="index.html#home" class="text-blue-500 hover:underline mx-2" aria-label="Go to Home">Home</a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('travelForm');
      const portSelect = document.getElementById('portSelect');
      const customPortInput = document.getElementById('customPortInput');
      const customPortDiv = document.querySelector('.custom-port-input');
      const regionSelect = document.getElementById('regionSelect');
      const customRegionInput = document.getElementById('customRegionInput');
      const customRegionDiv = document.querySelector('.custom-region-input');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const budgetInput = document.getElementById('budget');
      const submitBtn = form.querySelector('.submit-btn');
      const formStatus = document.getElementById('form-status');
      let timerInterval = null;
      let secondsElapsed = 0;

      // Toggle Custom Port Input
      const toggleCustomPort = () => {
        if (portSelect.value === 'OTHER') {
          customPortDiv.classList.remove('hidden');
          customPortInput.disabled = false;
          customPortInput.required = true;
          portSelect.required = false;
        } else {
          customPortDiv.classList.add('hidden');
          customPortInput.disabled = true;
          customPortInput.required = false;
          portSelect.required = true;
        }
      };

      // Toggle Custom Region Input
      const toggleCustomRegion = () => {
        if (regionSelect.value === 'OTHER') {
          customRegionDiv.classList.remove('hidden');
          customRegionInput.disabled = false;
          customRegionInput.required = true;
          regionSelect.required = false;
        } else {
          customRegionDiv.classList.add('hidden');
          customRegionInput.disabled = true;
          customRegionInput.required = false;
          regionSelect.required = true;
        }
      };

      // Automatically set end date to start date when start date changes
      startDateInput.addEventListener('change', () => {
        if (startDateInput.value) {
          endDateInput.value = startDateInput.value;
          endDateInput.min = startDateInput.value;
        }
      });

      // Option Card Selection
      document.querySelectorAll('.option-card').forEach(item => {
        item.addEventListener('click', function() {
          const input = this.querySelector('input');
          if (input.type === 'radio') {
            document.querySelectorAll(`input[name="${input.name}"]`).forEach(radio => {
              radio.closest('.option-card').classList.remove('selected');
            });
            input.checked = true;
            this.classList.add('selected');
          } else if (input.type === 'checkbox') {
            input.checked = !input.checked;
            this.classList.toggle('selected', input.checked);
          }
        });

        // Keyboard Navigation
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

      // Date Validation
      endDateInput.addEventListener('change', () => {
        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);
        if (startDate && endDate && endDate < startDate) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'End date must be on or after start date.';
          endDateInput.value = startDateInput.value;
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Budget Validation
      budgetInput.addEventListener('input', () => {
        if (budgetInput.value < 0) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Budget cannot be negative.';
          budgetInput.value = '';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        }
      });

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="button-text">Processing...</span><div class="progress-wrapper"><div class="progress-bar-container" style="display:inline-block;"><div class="progress-bar"></div></div><span class="second-counter" style="display:inline;">0s</span></div>';

        // Start the timer
        secondsElapsed = 0;
        timerInterval = setInterval(() => {
          secondsElapsed++;
          const counterElement = submitBtn.querySelector('.second-counter');
          if (counterElement) {
            counterElement.textContent = `${secondsElapsed}s`;
          }
        }, 1000);

        const formData = new FormData(form);
        if (portSelect.value === 'OTHER') {
          const customValue = customPortInput.value.trim();
          if (customValue) formData.set('departurePort', customValue);
        }
        if (regionSelect.value === 'OTHER') {
          const customRegion = customRegionInput.value.trim();
          if (customRegion) formData.set('cruiseRegion', customRegion);
        }

        try {
          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/cruise-travel-agent', {
            method: 'POST',
            body: formData
          });
          if (response.ok) {
            window.location.href = 'workflow_confirmation.html';
          } else {
            throw new Error('Submission failed.');
          }
        } catch (error) {
          formStatus.className = 'bg-red-100 text-red-600';
          formStatus.classList.remove('hidden');
          formStatus.textContent = 'Submission failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span class="button-text">🚀 Generate Travel Plan</span><div class="progress-wrapper"><div class="progress-bar-container" style="display:none;"><div class="progress-bar"></div></div><span class="second-counter" style="display:none;">0s</span></div>';
          setTimeout(() => { formStatus.classList.add('hidden'); }, 3000);
        } finally {
          clearInterval(timerInterval);
          timerInterval = null;
          secondsElapsed = 0;
        }
      });

      // Event Listeners
      portSelect.addEventListener('change', toggleCustomPort);
      regionSelect.addEventListener('change', toggleCustomRegion);
      toggleCustomPort();
      toggleCustomRegion();

      // Reset on page restore
      window.addEventListener('pageshow', () => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="button-text">🚀 Generate Travel Plan</span><div class="progress-wrapper"><div class="progress-bar-container" style="display:none;"><div class="progress-bar"></div></div><span class="second-counter" style="display:none;">0s</span></div>';
        clearInterval(timerInterval);
        timerInterval = null;
        secondsElapsed = 0;
      });

      // Hamburger Menu Toggle
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      // Close menu when a link is clicked
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });
    });
  </script>
