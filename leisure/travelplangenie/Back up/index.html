<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];

          // Convert sheet to JSON to filter blank rows
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          // Filter out blank rows (rows where all cells are empty, null, or undefined)
          var filteredData = jsonData.filter(row => row.some(filledCell));

          // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          // Fallback
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }

          // Convert filtered JSON back to CSV
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>
  <script>
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Fetch Google Reviews
    async function fetchGoogleReviews() {
      try {
        const response = await fetch('https://maps.googleapis.com/maps/api/place/details/json?place_id=YOUR_PLACE_ID&fields=reviews&key=YOUR_API_KEY');
        const data = await response.json();
        
        if (data.result && data.result.reviews && data.result.reviews.length > 0) {
          const reviews = data.result.reviews.slice(0, 3);
          const testimonialsGrid = document.querySelector('.testimonials-grid');
          testimonialsGrid.innerHTML = '';

          reviews.forEach(review => {
            if (review.rating >= 4 && review.text) {
              const testimonialCard = document.createElement('div');
              testimonialCard.className = 'testimonial-card';
              const reviewText = review.text.length > 150 ? review.text.substring(0, 147) + '...' : review.text;
              testimonialCard.innerHTML = `
                <p>"${reviewText}"</p>
                <cite>â€“ ${review.author_name}</cite>
              `;
              testimonialsGrid.appendChild(testimonialCard);
            }
          });

          const currentReviewCount = testimonialsGrid.children.length;
          const fallbackTestimonials = [
            { text: "Voyage Genie made planning my honeymoon so easy! Everything was perfect.", author: "Sarah M." },
            { text: "I loved the personalized recommendations. It felt like a custom trip just for me.", author: "James T." },
            { text: "The AI found deals I never would have discovered on my own. Amazing service!", author: "Priya K." }
          ];

          for (let i = currentReviewCount; i < 3; i++) {
            const testimonialCard = document.createElement('div');
            testimonialCard.className = 'testimonial-card';
            testimonialCard.innerHTML = `
              <p>"${fallbackTestimonials[i].text}"</p>
              <cite>â€“ ${fallbackTestimonials[i].author}</cite>
            `;
            testimonialsGrid.appendChild(testimonialCard);
          }
        } else {
          console.warn('No reviews found or API returned an error. Using fallback testimonials.');
        }
      } catch (error) {
        console.error('Error fetching Google Reviews:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchGoogleReviews);

    // Hamburger Menu Toggle
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('active');
    });

    // Close menu when a link is clicked (for better UX on mobile)
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('active');
      });
    });

    // Accessibility: Allow keyboard navigation for hamburger menu
    hamburger.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        hamburger.click();
      }
    });

    // Textbox Interactivity: Ask Genie for Suggestions
    const heroTextbox = document.querySelector('.hero-textbox');
    const heroTextboxSubmit = document.querySelector('.hero-textbox-submit');

    function handleGenieQuery() {
      const query = heroTextbox.value.trim().toLowerCase();

      // Keyword-based logic to determine trip type
      const tropicalKeywords = ['beach', 'resort', 'tropical', 'relax', 'paradise'];
      const cruiseKeywords = ['cruise', 'ship', 'ocean', 'sea', 'boat'];
      const airbnbKeywords = ['airbnb', 'home', 'stay', 'house', 'cozy'];
      const adventureKeywords = ['adventure', 'hiking', 'mountain', 'explore', 'outdoor'];

      let redirectUrl = 'tropical_trip_plan_form.html'; // Default fallback

      if (tropicalKeywords.some(keyword => query.includes(keyword))) {
        redirectUrl = 'tropical_trip_plan_form.html';
      } else if (cruiseKeywords.some(keyword => query.includes(keyword))) {
        redirectUrl = 'cruise_trip_plan_form.html';
      } else if (airbnbKeywords.some(keyword => query.includes(keyword))) {
        redirectUrl = 'airbnb_trip_plan_form.html';
      } else if (adventureKeywords.some(keyword => query.includes(keyword))) {
        redirectUrl = 'adventure_trip_plan_form.html';
      }

      // Redirect to the appropriate form
      window.location.href = redirectUrl;

      // Provide feedback for accessibility
      heroTextbox.setAttribute('aria-label', `Redirecting to ${redirectUrl.split('_')[0]} trip planning form`);
    }

    heroTextbox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleGenieQuery();
      }
    });

    heroTextboxSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      handleGenieQuery();
    });

    // Accessibility: Allow keyboard navigation for submit button
    heroTextboxSubmit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleGenieQuery();
      }
    });

    // Newsletter Signup Interactivity
    const newsletterInput = document.querySelector('.newsletter-input');
    const newsletterSubmit = document.querySelector('.newsletter-submit');

    newsletterSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      const email = newsletterInput.value.trim();
      if (email) {
        console.log(`Subscribed with email: ${email}`); // Placeholder for actual submission logic
        newsletterInput.value = '';
        newsletterInput.setAttribute('aria-label', 'Thank you for subscribing to travel updates');
        alert('Thank you for subscribing!'); // Temporary feedback
      } else {
        newsletterInput.setAttribute('aria-label', 'Please enter a valid email for travel updates');
        alert('Please enter a valid email address.');
      }
    });

    // Accessibility: Allow keyboard navigation for newsletter submit button
    newsletterSubmit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        newsletterSubmit.click();
      }
    });
  </script>
