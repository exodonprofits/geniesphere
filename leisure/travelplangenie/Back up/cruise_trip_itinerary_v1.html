<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Log initial storage state
      console.log('Initial localStorage contents:');
      console.log('sessionId:', localStorage.getItem('sessionId'));
      console.log('formData:', localStorage.getItem('formData'));
      console.log('itineraryHtml:', localStorage.getItem('itineraryHtml'));

      // Get sessionId from URL or localStorage (for logging purposes)
      const urlParams = new URLSearchParams(window.location.search);
      let sessionId = urlParams.get('sessionId') || localStorage.getItem('sessionId');
      console.log('sessionId from URL or localStorage:', sessionId);

      // Retrieve itineraryHtml and formData from localStorage
      let itineraryHtml = localStorage.getItem('itineraryHtml');
      let formDataJson = localStorage.getItem('formData');
      console.log('Retrieved formData:', formDataJson);

      // Initialize variables for search criteria
      let departurePort = 'Not specified';
      let destination = 'Your Destination';
      let travelDates = 'N/A to N/A';
      let cruiseDuration = 'Not specified';
      let budget = 'N/A';
      let groupSize = 'N/A';
      let email = 'N/A';
      let tripType = 'N/A';
      let onboardPreferences = 'Not specified';
      let cabinType = 'Not specified';
      let ageRange = 'Not specified';

      // Function to update search criteria from formData
      const updateSearchCriteria = (formData) => {
        if (formData) {
          departurePort = formData.departurePort || 'Not specified';
          destination = formData.cruiseRegion || 'Your Destination';
          travelDates = `${formData.startDate || 'N/A'} to ${formData.endDate || 'N/A'}`;
          cruiseDuration = formData.cruiseDuration || 'Not specified';
          budget = formData.budget || 'N/A';
          groupSize = formData.groupSize || 'N/A';
          email = formData.email || 'N/A';
          tripType = formData.tripType || 'N/A';
          onboardPreferences = Array.isArray(formData.onboardPreferences) ? formData.onboardPreferences.join(', ') : formData.onboardPreferences || 'Not specified';
          cabinType = formData.cabinType || 'Not specified';
          ageRange = Array.isArray(formData.ageRange) ? formData.ageRange.join(', ') : formData.ageRange || 'Not specified';
          console.log('Updated search criteria - Departure Port:', departurePort);
        }
      };

      // Initial update of search criteria
      if (formDataJson) {
        try {
          const formData = JSON.parse(formDataJson);
          updateSearchCriteria(formData);
        } catch (error) {
          console.error('Error parsing formData:', error);
        }
      }

      // Display the initial itinerary
      if (itineraryHtml) {
        console.log('Itinerary HTML length:', itineraryHtml.length);
        console.log('Itinerary HTML preview:', itineraryHtml.substring(0, 500));
        document.getElementById('itinerary').innerHTML = itineraryHtml;
      } else {
        console.log('No itineraryHtml found in localStorage.');
        document.getElementById('itinerary').innerHTML = '<p>No itinerary found. Please try again.</p>';
      }

      document.getElementById('printItineraryBtn').addEventListener('click', () => {
        window.print();
      });

      document.getElementById('emailItineraryBtn').addEventListener('click', async () => {
        if (!itineraryHtml) {
          alert('Itinerary not found. Please try generating the itinerary again.');
          return;
        }

        try {
          const subject = `Your Cruise Itinerary for ${destination} - Voyage Genie`;
          const payload = {
            resolvedEmail: email,
            resolvedSubject: subject,
            resolvedMessage: itineraryHtml
          };
          console.log('Sending email with payload:', payload);

          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/send-email', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            alert('Itinerary has been sent to your email!');
          } else {
            const errorData = await response.json();
            console.error('Error sending email:', errorData);
            alert('Failed to send email. Please try again.');
          }
        } catch (error) {
          console.error('Error during email submission:', error);
          alert('Failed to send email. Please try again.');
        }
      });

      document.getElementById('newSuggestionBtn').addEventListener('click', async () => {
        if (!formDataJson) {
          alert('Form data not found. Please return to the form to generate a new itinerary.');
          return;
        }

        const button = document.getElementById('newSuggestionBtn');
        button.disabled = true;
        button.innerHTML = 'Generating... <div class="loading-spinner" style="display:inline-block;"></div>';

        try {
          console.log('Sending request for new suggestion with form data:', formDataJson);
          const response = await fetch('https://exodonprofits.app.n8n.cloud/webhook/cruise-travel-agent-new-suggestion', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: formDataJson
          });

          if (response.ok) {
            const data = await response.json();
            console.log('New suggestion response:', data);

            // Update localStorage with the new itineraryHtml and formData
            localStorage.setItem('itineraryHtml', data.itineraryHtml);
            localStorage.setItem('sessionId', data.sessionId);
            localStorage.setItem('formData', JSON.stringify(data.formData));

            // Update the itineraryHtml and formDataJson variables
            itineraryHtml = data.itineraryHtml;
            formDataJson = JSON.stringify(data.formData);

            // Re-parse the updated formData to refresh search criteria
            try {
              const formData = JSON.parse(formDataJson);
              updateSearchCriteria(formData);
            } catch (error) {
              console.error('Error parsing updated formData:', error);
            }

            // Update the itinerary display
            document.getElementById('itinerary').innerHTML = itineraryHtml;

            alert('A new itinerary suggestion has been generated!');
          } else {
            const errorData = await response.json();
            console.error('Error generating new suggestion:', errorData);
            alert('Failed to generate a new suggestion. Please try again.');
          }
        } catch (error) {
          console.error('Error during new suggestion request:', error);
          alert('Failed to generate a new suggestion. Please try again.');
        } finally {
          button.disabled = false;
          button.innerHTML = 'ğŸ”„ <span class="tooltip">Request New Suggestion</span>';
        }
      });

      document.getElementById('modifyLink').addEventListener('click', (e) => {
        // Clear storage before redirecting to the form
        localStorage.removeItem('sessionId');
        localStorage.removeItem('formData');
        localStorage.removeItem('itineraryHtml');
      });

      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
        });
      });
    });
  </script>
</body>
</html>
