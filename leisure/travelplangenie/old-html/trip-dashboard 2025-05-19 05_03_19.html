
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Trips – Voyage Genie</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      color: #1f2937;
    }
    .trip-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      margin-bottom: 1rem;
    }
    .trip-card h3 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .trip-card .dates {
      font-size: 0.875rem;
      color: #6b7280;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      margin-right: 0.5rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background-color: #2563eb;
    }
    .btn-danger {
      background-color: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }
    .btn-secondary {
      background-color: #6b7280;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #4b5563;
    }
  </style>
</head>
<body class="p-6">
  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold mb-2">✈️ My Trips</h1>
    <p class="text-gray-600">View, manage, or start a new travel plan</p>
  </header>

  <main class="max-w-3xl mx-auto">
    <div id="tripList"></div>
    <div class="text-center mt-8">
      <a href="index.html">
        <button class="btn btn-primary">+ Start New Trip</button>
      </a>
    </div>
  </main>

  <script>
    const trips = JSON.parse(localStorage.getItem('savedTrips') || '[]');

    function renderTrips() {
      const list = document.getElementById('tripList');
      if (trips.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500">No saved trips yet.</p>';
        return;
      }

      list.innerHTML = trips.map((trip, index) => `
        <div class="trip-card">
          <h3>${trip.destination || 'Unnamed Trip'}</h3>
          <p class="dates">${trip.startDate || 'Unknown'} to ${trip.endDate || 'Unknown'}</p>
          <div class="mt-2">
            <button class="btn btn-primary" onclick="viewTrip(${index})">View</button>
            <button class="btn btn-secondary" onclick="duplicateTrip(${index})">Duplicate</button>
            <button class="btn btn-danger" onclick="deleteTrip(${index})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function viewTrip(index) {
      const trip = trips[index];
      localStorage.setItem('formData', JSON.stringify(trip));
      window.location.href = 'confirmation.html';
    }

    function duplicateTrip(index) {
      trips.push({ ...trips[index], name: trips[index].name + ' (Copy)' });
      localStorage.setItem('savedTrips', JSON.stringify(trips));
      renderTrips();
    }

    function deleteTrip(index) {
      if (confirm("Are you sure you want to delete this trip?")) {
        trips.splice(index, 1);
        localStorage.setItem('savedTrips', JSON.stringify(trips));
        renderTrips();
      }
    }

    renderTrips();
  </script>
</body>
</html>
