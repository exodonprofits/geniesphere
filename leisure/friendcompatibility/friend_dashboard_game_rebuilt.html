
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friend Compatibility Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #2BFFD9;
      --secondary: #7C3AED;
      --background: #0F172A;
      --text: #F8FAFC;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    .form-container {
      background: rgba(200, 200, 200, 0.03);
      border-radius: 1.5rem;
      padding: 2rem;
      border: 1px solid rgba(200, 200, 200, 0.1);
      max-width: 800px;
      margin: auto;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .question-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .options {
      margin-left: 20px;
      line-height: 2;
    }

    input[type="checkbox"],
    input[type="radio"] {
      margin-right: 8px;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 8px;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: var(--background);
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
<!-- Background Music -->
<audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_f2f858f121.mp3?filename=happy-day-5797.mp3" autoplay loop></audio>

<!-- Loading Spinner -->
<div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background-color:#0F172A; display:flex; align-items:center; justify-content:center; z-index:9999;">
  <div style="border: 6px solid #f3f3f3; border-top: 6px solid var(--primary); border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;"></div>
</div>
<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>


<audio id="soundGood" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3cfa55ba57.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="soundMedium" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_68b983235f.mp3?filename=notification-132056.mp3"></audio>
<audio id="soundBad" src="https://cdn.pixabay.com/download/audio/2022/03/22/audio_95f01b450c.mp3?filename=failure-drum-sound-effect-2-7184.mp3"></audio>

  <div class="form-container">
    <h2>🤝 Friend Compatibility Checker</h2>
    
<div id="progressContainer" style="margin-bottom: 2rem; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;">
  <div id="progressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.4s ease;"></div>
</div>
<form id="friendForm"><div id="questionWrap">
      <div class="question-group">
        <label>🎯 1. Do you both share common interests?</label>
        <div class="options">
          <input type="radio" name="commonInterests" value="yes" required>Yes<br>
          <input type="radio" name="commonInterests" value="no">No
        </div>
      </div>

      <div class="question-group">
        <label>📞 2. How often do you communicate?</label>
        <div class="options">
          <input type="radio" name="communication" value="daily" required>Daily<br>
          <input type="radio" name="communication" value="weekly">Weekly<br>
          <input type="radio" name="communication" value="rarely">Rarely
        </div>
      </div>

      <div class="question-group">
        <label>❤️ 3. Do they provide emotional support when needed?</label>
        <div class="options">
          <input type="radio" name="emotionalSupport" value="yes" required>Yes<br>
          <input type="radio" name="emotionalSupport" value="no">No
        </div>
      </div>

      <div class="question-group">
        <label>🔒 4. Can you trust this person with personal information?</label>
        <div class="options">
          <input type="radio" name="trust" value="yes" required>Yes<br>
          <input type="radio" name="trust" value="no">No
        </div>
      </div>

      <div class="question-group">
        <label>⚖️ 5. How do they react during disagreements?</label>
        <textarea name="conflictReaction" placeholder="Describe briefly..."></textarea>
      </div>

      <div class="question-group">
        <label>⭐ 6. What qualities do they have? (Check all that apply)</label>
        <div class="options">
          <input type="checkbox" name="qualities" value="honest">Honest<br>
          <input type="checkbox" name="qualities" value="loyal">Loyal<br>
          <input type="checkbox" name="qualities" value="funny">Funny<br>
          <input type="checkbox" name="qualities" value="helpful">Helpful<br>
          <input type="checkbox" name="qualities" value="goodListener">Good Listener<br>
          <input type="checkbox" name="qualities" value="nonJudgmental">Non-Judgmental
        </div>
      </div>

      <div class="question-group">
        <label>🛑 7. Do they respect your boundaries and opinions?</label>
        <div class="options">
          <input type="radio" name="respect" value="yes" required>Yes<br>
          <input type="radio" name="respect" value="no">No
        </div>
      </div>

      <div class="question-group">
        <label>⏰ 8. Have they ever let you down when you needed them?</label>
        <div class="options">
          <input type="radio" name="reliability" value="never" required>Never<br>
          <input type="radio" name="reliability" value="sometimes">Sometimes<br>
          <input type="radio" name="reliability" value="often">Often
        </div>
      </div>

      <div class="question-group">
        <label>🎉 9. Do they celebrate your wins without jealousy?</label>
        <div class="options">
          <input type="radio" name="jealousy" value="yes" required>Yes<br>
          <input type="radio" name="jealousy" value="no">No
        </div>
      </div>

      <div class="question-group">
        <label>✨ 10. Describe a moment that made you feel they were a good friend:</label>
        <textarea name="goodMoment" placeholder="Share your experience..."></textarea>
      </div>

      </div><div id="navigation" style="text-align:center; margin-top:2rem;">    <button type="button" id="prevBtn" style="margin-right:1rem;" class="card-button">⬅️ Previous</button>    <button type="button" id="nextBtn" style="margin-right:1rem;" class="card-button">➡️ Next</button>    <button type="submit" id="submitBtn" class="card-button">✅ Submit</button>    </div>
    
    </form>
    <div id="result" style="margin-top: 2rem; font-size: 1.2rem; font-weight: bold; text-align: center;"></div>
<div style="text-align: center; margin-top: 1.5rem;">
  <button id="shareButton" style="background: linear-gradient(45deg, var(--primary), var(--secondary)); color: var(--background); padding: 0.6rem 1.2rem; border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; font-size: 1rem;">🔗 Share Result</button>
  <div id="shareMsg" style="margin-top: 0.5rem; font-size: 0.9rem; color: #94A3B8;"></div>
</div>

    <script>
      document.getElementById("friendForm").addEventListener("submit", function(event) {
        event.preventDefault();
        let score = 0;

        const positiveAnswers = [
          document.querySelector('input[name="commonInterests"]:checked')?.value === "yes",
          ["daily", "weekly"].includes(document.querySelector('input[name="communication"]:checked')?.value),
          document.querySelector('input[name="emotionalSupport"]:checked')?.value === "yes",
          document.querySelector('input[name="trust"]:checked')?.value === "yes",
          document.querySelector('input[name="respect"]:checked')?.value === "yes",
          document.querySelector('input[name="jealousy"]:checked')?.value === "yes",
          ["never", "sometimes"].includes(document.querySelector('input[name="reliability"]:checked')?.value),
        ];

        positiveAnswers.forEach(answer => { if (answer) score++; });

        const resultDiv = document.getElementById("result");
        if (score >= 6) {
          resultDiv.textContent = "✅ This person is likely a good friend!";
          resultDiv.style.color = "#2BFFD9";
        } else {
          resultDiv.textContent = "⚠️ Compatibility needs work. Consider your boundaries.";
          resultDiv.style.color = "#FF6B6B";
        }
      });
    </script>
    
  </div>

<script>
  const totalQuestions = 10;
  const answered = new Set();
  const progressBar = document.getElementById("progressBar");

  document.querySelectorAll('#friendForm input, #friendForm textarea').forEach(el => {
    el.addEventListener('input', (e) => {
      const name = e.target.name;
      if (e.target.type === "radio" || e.target.type === "checkbox") {
        if (e.target.checked) answered.add(name);
      } else if (e.target.value.trim()) {
        answered.add(name);
      }
      let progress = (answered.size / totalQuestions) * 100;
      progressBar.style.width = progress + "%";
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  const totalQuestions = 10;
  const answered = new Set();
  const progressBar = document.getElementById("progressBar");
  const resultDiv = document.getElementById("result");

  function showConfetti() {
    confetti({
      particleCount: 150,
      spread: 100,
      origin: { y: 0.6 }
    });
  }

  function updateProgress() {
    let percent = (answered.size / totalQuestions) * 100;
    progressBar.style.width = percent + "%";

    if (percent <= 30) progressBar.innerText = "🥱";
    else if (percent <= 60) progressBar.innerText = "🧐";
    else if (percent <= 90) progressBar.innerText = "🤝";
    else progressBar.innerText = "🚀";
  }

  document.querySelectorAll('#friendForm input, #friendForm textarea').forEach(el => {
    el.addEventListener('input', (e) => {
      const name = e.target.name;
      if ((e.target.type === "radio" || e.target.type === "checkbox") && e.target.checked) {
        answered.add(name);
      } else if (e.target.value.trim()) {
        answered.add(name);
      }
      updateProgress();
    });
  });

  document.getElementById("friendForm").addEventListener("submit", function(event) {
    event.preventDefault();
    let score = 0;

    const positiveAnswers = [
      document.querySelector('input[name="commonInterests"]:checked')?.value === "yes",
      ["daily", "weekly"].includes(document.querySelector('input[name="communication"]:checked')?.value),
      document.querySelector('input[name="emotionalSupport"]:checked')?.value === "yes",
      document.querySelector('input[name="trust"]:checked')?.value === "yes",
      document.querySelector('input[name="respect"]:checked')?.value === "yes",
      document.querySelector('input[name="jealousy"]:checked')?.value === "yes",
      ["never", "sometimes"].includes(document.querySelector('input[name="reliability"]:checked')?.value),
    ];

    positiveAnswers.forEach(answer => { if (answer) score++; });

    if (score >= 6) {
      resultDiv.textContent = "🎉 Besties for life! You two are totally in sync.";
      resultDiv.style.color = "#2BFFD9";
      showConfetti();
    } else if (score >= 4) {
      resultDiv.textContent = "🤔 Potential pals... but some gaps to bridge.";
      resultDiv.style.color = "#FFD166";
    } else {
      resultDiv.textContent = "🧊 Maybe just acquaintances? Time will tell.";
      resultDiv.style.color = "#FF6B6B";
    }
  });

  document.getElementById("shareButton").addEventListener("click", function () {
    const text = document.getElementById("result").innerText;

      document.getElementById("shareMsg").textContent = "Copied! Share it with your friends.";
    }).catch(() => {
      document.getElementById("shareMsg").textContent = "Oops! Could not copy to clipboard.";
    });
  });

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const questions = document.querySelectorAll('.question-group');
let currentQuestion = 0;
const totalQuestions = questions.length;
const progressBar = document.getElementById("progressBar");
const resultDiv = document.getElementById("result");

const soundGood = document.getElementById("soundGood");
const soundMedium = document.getElementById("soundMedium");
const soundBad = document.getElementById("soundBad");

function showConfetti() {
  confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
}

function showQuestion(index) {
  questions.forEach((q, i) => q.style.display = (i === index ? 'block' : 'none'));
  updateProgress();
  document.getElementById("prevBtn").style.display = index === 0 ? 'none' : 'inline-block';
  document.getElementById("nextBtn").style.display = index === totalQuestions - 1 ? 'none' : 'inline-block';
  document.getElementById("submitBtn").style.display = index === totalQuestions - 1 ? 'inline-block' : 'none';
}

function updateProgress() {
  let percent = ((currentQuestion + 1) / totalQuestions) * 100;
  progressBar.style.width = percent + "%";
  if (percent <= 30) progressBar.innerText = "🥱";
  else if (percent <= 60) progressBar.innerText = "🧐";
  else if (percent <= 90) progressBar.innerText = "🤝";
  else progressBar.innerText = "🚀";
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentQuestion < totalQuestions - 1) currentQuestion++;
  showQuestion(currentQuestion);
});

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentQuestion > 0) currentQuestion--;
  showQuestion(currentQuestion);
});

document.getElementById("friendForm").addEventListener("submit", function(event) {
  event.preventDefault();
  let score = 0;

  const answers = {
    commonInterests: document.querySelector('input[name="commonInterests"]:checked')?.value,
    communication: document.querySelector('input[name="communication"]:checked')?.value,
    emotionalSupport: document.querySelector('input[name="emotionalSupport"]:checked')?.value,
    trust: document.querySelector('input[name="trust"]:checked')?.value,
    respect: document.querySelector('input[name="respect"]:checked')?.value,
    jealousy: document.querySelector('input[name="jealousy"]:checked')?.value,
    reliability: document.querySelector('input[name="reliability"]:checked')?.value,
  };

  if (answers.commonInterests === "yes") score += 1; else if (answers.commonInterests === "no") score -= 1;
  if (["daily", "weekly"].includes(answers.communication)) score += 1; else if (answers.communication === "rarely") score -= 1;
  if (answers.emotionalSupport === "yes") score += 1; else if (answers.emotionalSupport === "no") score -= 1;
  if (answers.trust === "yes") score += 1; else if (answers.trust === "no") score -= 1;
  if (answers.respect === "yes") score += 1; else if (answers.respect === "no") score -= 1;
  if (answers.jealousy === "yes") score += 1; else if (answers.jealousy === "no") score -= 1;
  if (["never", "sometimes"].includes(answers.reliability)) score += 1; else if (answers.reliability === "often") score -= 1;

  if (score >= 6) {
    resultDiv.textContent = "🎉 Besties for life! You two are totally in sync.";
    resultDiv.style.color = "#2BFFD9";
    showConfetti();
    soundGood.play();
  } else if (score >= 3) {
    resultDiv.textContent = "🤔 Potential pals... but some gaps to bridge.";
    resultDiv.style.color = "#FFD166";
    soundMedium.play();
  } else {
    resultDiv.textContent = "🧊 Maybe just acquaintances? Time will tell.";
    resultDiv.style.color = "#FF6B6B";
    soundBad.play();
  }
  document.getElementById("navigation").style.display = "none";
});

document.getElementById("shareButton").addEventListener("click", function () {
  const text = document.getElementById("result").innerText;
  const message = `I just took the Friend Compatibility Game: "${text}" Try it here!`;
  navigator.clipboard.writeText(message).then(() => {
    document.getElementById("shareMsg").textContent = "Copied! Share it with your friends.";
  }).catch(() => {
    document.getElementById("shareMsg").textContent = "Oops! Could not copy to clipboard.";
  });
});

showQuestion(currentQuestion);

window.addEventListener('load', function() {
  const loader = document.getElementById('loader');
  if (loader) loader.style.display = 'none';
});
</script>
