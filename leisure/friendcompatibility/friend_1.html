<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friend Compatibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h2 {
      color: #4a90e2;
    }
    .question-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .options {
      margin-left: 20px;
    }
    input[type="checkbox"],
    input[type="radio"] {
      margin-right: 8px;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-top: 8px;
    }
    button {
      padding: 10px 20px;
      background-color: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #357ab8;
    }
  </style>
</head>
<body>
  <h2>Friend Compatibility Checker</h2>
  <form id="friendForm">

    <div class="question-group">
      <label>1. Do you both share common interests?</label>
      <div class="options">
        <input type="radio" name="commonInterests" value="yes" required>Yes<br>
        <input type="radio" name="commonInterests" value="no">No
      </div>
    </div>

    <div class="question-group">
      <label>2. How often do you communicate?</label>
      <div class="options">
        <input type="radio" name="communication" value="daily" required>Daily<br>
        <input type="radio" name="communication" value="weekly">Weekly<br>
        <input type="radio" name="communication" value="rarely">Rarely
      </div>
    </div>

    <div class="question-group">
      <label>3. Do they provide emotional support when needed?</label>
      <div class="options">
        <input type="radio" name="emotionalSupport" value="yes" required>Yes<br>
        <input type="radio" name="emotionalSupport" value="no">No
      </div>
    </div>

    <div class="question-group">
      <label>4. Can you trust this person with personal information?</label>
      <div class="options">
        <input type="radio" name="trust" value="yes" required>Yes<br>
        <input type="radio" name="trust" value="no">No
      </div>
    </div>

    <div class="question-group">
      <label>5. How do they react during disagreements?</label>
      <textarea name="conflictReaction" placeholder="Describe briefly..."></textarea>
    </div>

    <div class="question-group">
      <label>6. What qualities do they have? (Check all that apply)</label>
      <div class="options">
        <input type="checkbox" name="qualities" value="honest">Honest<br>
        <input type="checkbox" name="qualities" value="loyal">Loyal<br>
        <input type="checkbox" name="qualities" value="funny">Funny<br>
        <input type="checkbox" name="qualities" value="helpful">Helpful<br>
        <input type="checkbox" name="qualities" value="goodListener">Good Listener<br>
        <input type="checkbox" name="qualities" value="nonJudgmental">Non-Judgmental
      </div>
    </div>

    <div class="question-group">
      <label>7. Do they respect your boundaries and opinions?</label>
      <div class="options">
        <input type="radio" name="respect" value="yes" required>Yes<br>
        <input type="radio" name="respect" value="no">No
      </div>
    </div>

    <div class="question-group">
      <label>8. Have they ever let you down when you needed them?</label>
      <div class="options">
        <input type="radio" name="reliability" value="never" required>Never<br>
        <input type="radio" name="reliability" value="sometimes">Sometimes<br>
        <input type="radio" name="reliability" value="often">Often
      </div>
    </div>

    <div class="question-group">
      <label>9. Do they celebrate your wins without jealousy?</label>
      <div class="options">
        <input type="radio" name="jealousy" value="yes" required>Yes<br>
        <input type="radio" name="jealousy" value="no">No
      </div>
    </div>

    <div class="question-group">
      <label>10. Describe a moment that made you feel they were a good friend:</label>
      <textarea name="goodMoment" placeholder="Share your experience..."></textarea>
    </div>

    <button type="submit">Check Compatibility</button>
  </form>
</body>
</html>
