<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Insurance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <h1 class="text-3xl font-bold text-center mb-6">📋 Insurance Tracker</h1>

    <div id="insuranceList" class="space-y-4"></div>

    <div class="text-center mt-8">
      <a href="add-insurance.html" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full shadow hover:bg-green-700 transition mx-auto w-max">
        <span class="text-xl">➕</span> Add Insurance
      </a>
    </div>

    <div class="text-center mt-4">
      <a href="household-genie.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full shadow hover:bg-blue-700 transition mx-auto w-max">
        <span class="text-white text-lg">⬅️</span> Back to Dashboard
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = createClient('https://your-project.supabase.co', 'public-anon-key');

    async function fetchInsurance() {
      const user = await supabase.auth.getUser();
      if (!user || !user.data?.user) return;
      const { data, error } = await supabase.from('household_bills').select('*').eq('user_id', user.data.user.id).eq('category', 'insurance').order('due_date');
      if (error) return console.error(error);

      const container = document.getElementById('insuranceList');
      container.innerHTML = '';

      data.forEach(policy => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-xl shadow flex flex-col sm:flex-row sm:justify-between sm:items-center';
        div.innerHTML = `
          <div>
            <h2 class="text-lg font-semibold">${policy.service_type}</h2>
            <p class="text-sm text-gray-600">💵 $${policy.amount?.toFixed(2) || 'N/A'} | 🏢 ${policy.provider}</p>
            <p class="text-sm text-gray-500">📆 Due: ${policy.due_date || 'N/A'}</p>
          </div>
          <div class="mt-2 sm:mt-0">
            <a href="${policy.portal_url}" target="_blank" class="text-blue-500 hover:underline">🔗 Pay</a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    fetchInsurance();
  </script>
</body>
</html>
