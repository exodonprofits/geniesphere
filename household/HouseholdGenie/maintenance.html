<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 Home Maintenance</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-4">🔧 Home Maintenance</h1>
    <div id="maintenanceList" class="space-y-4"></div>
    <div class="text-center mt-6 space-y-4">
      <a href="add-maintenance.html" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full hover:bg-green-700 transition w-max mx-auto">
        ➕ Add Maintenance Task
      </a>
      <a href="household-genie.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700 transition w-max mx-auto">
        🏠 Back to Household Genie
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = createClient('https://pbojacnagutipfhcxltj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0');

    async function fetchMaintenance() {
      const user = await supabase.auth.getUser();
      const { data, error } = await supabase.from('maintenance_tasks').select('*').eq('user_id', user.data.user.id).order('due_date');
      if (error) return console.error(error);

      const container = document.getElementById('maintenanceList');
      data.forEach(task => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-xl shadow';
        div.innerHTML = `
          <h2 class="text-lg font-bold">🔧 ${task.title}</h2>
          <p>📆 ${task.due_date}</p>
          <p>📝 ${task.notes || ''}</p>
        `;
        container.appendChild(div);
      });
    }

    fetchMaintenance();
  </script>
</body>
</html>
