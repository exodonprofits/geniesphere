<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Credit Card</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.4/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-xl mx-auto p-4 sm:p-6">
    <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-center">➕ Add Credit Card</h1>

    <form id="cardForm" class="space-y-6 bg-white p-4 sm:p-6 rounded-xl shadow">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">💳 Card Name</label>
          <input type="text" name="card_name" placeholder="e.g. Chase Freedom" class="p-2 border rounded w-full" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🔢 Last 4 Digits</label>
          <input type="text" name="last_four" placeholder="e.g. 1234" maxlength="4" class="p-2 border rounded w-full" required />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">💰 Credit Limit</label>
            <input type="number" name="credit_limit" placeholder="e.g. 5000" class="p-2 border rounded w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">💸 Available Credit</label>
            <input type="number" name="available_credit" placeholder="e.g. 2100" class="p-2 border rounded w-full" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">📆 Due Date</label>
          <input type="date" name="due_date" class="p-2 border rounded w-full" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🎁 Reward Type</label>
          <input type="text" name="reward_type" placeholder="e.g. 1.5% Cash Back" class="p-2 border rounded w-full" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">🏆 Points Balance</label>
            <input type="number" name="points_balance" placeholder="e.g. 12340" class="p-2 border rounded w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">💳 Annual Fee</label>
            <input type="number" name="annual_fee" placeholder="e.g. 0" class="p-2 border rounded w-full" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">📈 APR (%)</label>
            <input type="number" step="0.01" name="apr" placeholder="e.g. 18.99" class="p-2 border rounded w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">🔁 Renewal Date</label>
            <input type="date" name="renewal_date" class="p-2 border rounded w-full" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🔗 Login URL (optional)</label>
          <input type="url" name="portal_url" placeholder="https://yourcardsite.com" class="p-2 border rounded w-full" />
        </div>
      </div>

      <div class="mt-6">
        <label class="block mb-2 font-medium">📷 Upload or Capture Credit Card Image (front only):</label>
        <input type="file" accept="image/*" capture="environment" onchange="runOCR(this)" class="p-2 border rounded w-full" />
        <p class="text-sm text-gray-500 mt-1">You can take a picture directly using your camera.</p>
      </div>

      <div class="text-center mt-8">
  <button type="submit" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full shadow hover:bg-green-700 transition mx-auto">
    <span class="text-purple-300 text-xl">💾</span> Save
  </button>
</div>
    </form>

    <div id="message" class="text-center mt-4 text-green-600"></div>
  </div>

  <div class="text-center mt-6">
    <a href="credit-card-tracker.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full shadow hover:bg-blue-700 transition mx-auto w-max">
      <span class="text-white text-lg">⬅️</span> Back to Credit Cards
    </a>
  </div>

  <script>
    const supabase = createClient('https://your-project.supabase.co', 'public-anon-key');

    document.getElementById('cardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = await supabase.auth.getUser();
      if (!user || !user.data?.user) {
        alert('Please log in to continue.');
        return;
      }

      const formData = new FormData(e.target);
      const cardData = {};
      formData.forEach((value, key) => {
        cardData[key] = value;
      });

      cardData.user_id = user.data.user.id;

      const { error } = await supabase.from('credit_cards').insert([cardData]);

      if (error) {
        document.getElementById('message').textContent = '❌ Error saving card.';
        console.error(error);
      } else {
        document.getElementById('message').textContent = '✅ Credit card saved successfully!';
        e.target.reset();
      }
    });

    async function runOCR(input) {
      const file = input.files[0];
      if (!file) return;

      const { data: { text } } = await Tesseract.recognize(file, 'eng');
      console.log('OCR Text:', text);

      const digits = text.match(/\d{4}\s?\d{4}\s?\d{4}\s?(\d{4})/);
      const expiry = text.match(/(\d{2})\/(\d{2})/);
      const name = text.match(/(CHASE|VISA|FREEDOM|PLATINUM|DISCOVER|AMEX|CITI)/i);

      if (digits) document.querySelector('[name="last_four"]').value = digits[1];
      if (expiry) document.querySelector('[name="renewal_date"]').value = `20${expiry[2]}-${expiry[1]}-01`;
      if (name) document.querySelector('[name="card_name"]').value = name[0];
    }
  </script>

</body>
</html>
