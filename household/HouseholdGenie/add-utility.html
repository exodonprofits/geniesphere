<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Utility Bill</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-xl mx-auto p-4 sm:p-6">
    <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-center">➕ Add Utility Bill</h1>

    <form id="utilityForm" class="space-y-6 bg-white p-4 sm:p-6 rounded-xl shadow">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">🔌 Utility Type</label>
          <input type="text" name="utility_type" placeholder="e.g. Electricity, Water, Gas" class="p-2 border rounded w-full" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">💵 Monthly Amount</label>
          <input type="number" name="amount" placeholder="e.g. 120.50" step="0.01" class="p-2 border rounded w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">📆 Due Date</label>
          <input type="date" name="due_date" class="p-2 border rounded w-full" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🏢 Provider</label>
          <input type="text" name="provider" placeholder="e.g. PG&E, Comcast" class="p-2 border rounded w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🔗 Portal URL</label>
          <input type="url" name="portal_url" placeholder="https://yourutility.com" class="p-2 border rounded w-full" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">📝 Notes</label>
          <textarea name="notes" placeholder="e.g. Paid by autopay" class="p-2 border rounded w-full"></textarea>
        </div>
      </div>

      <div class="text-center mt-8">
        <button type="submit" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full shadow hover:bg-green-700 transition mx-auto">
          <span class="text-purple-300 text-xl">💾</span> Save
        </button>
      </div>
    </form>

    <div id="message" class="text-center mt-4 text-green-600"></div>
  </div>

  <div class="text-center mt-6">
    <a href="utility-tracker.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full shadow hover:bg-blue-700 transition mx-auto w-max">
      <span class="text-white text-lg">⬅️</span> Back to Utilities
    </a>
  </div>

</body>
</html>
