<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Payment Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <h1 class="text-3xl font-bold text-center mb-6">🚗 My Car Payments</h1>

    <div id="carList" class="space-y-4"></div>

    <div class="text-center mt-8">
      <a href="add-car-payment.html" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-full shadow hover:bg-green-700 transition mx-auto w-max">
        <span class="text-xl">➕</span> Add Car Payment
      </a>
    </div>

    <div class="text-center mt-4">
      <a href="household-genie.html" class="flex items-center gap-2 bg-blue-600 text-white px-6 py-2 rounded-full shadow hover:bg-blue-700 transition mx-auto w-max">
        <span class="text-white text-lg">⬅️</span> Back to Household Genie
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = createClient('https://pbojacnagutipfhcxltj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib2phY25hZ3V0aXBmaGN4bHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMDkwODAsImV4cCI6MjA2MzU4NTA4MH0.ZLCcAzTYljoZycpBGwMtthP5VyAJ4schuIvt4HibGc0');

    async function fetchCarPayments() {
      const user = await supabase.auth.getUser();
      if (!user || !user.data?.user) return;
      const { data, error } = await supabase.from('car_payments').select('*').eq('user_id', user.data.user.id).order('due_date');

      if (error) return console.error(error);

      const listContainer = document.getElementById('carList');
      listContainer.innerHTML = '';

      data.forEach(car => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-xl shadow flex flex-col sm:flex-row sm:justify-between sm:items-center';
        div.innerHTML = `
          <div>
            <h2 class="text-lg font-semibold">${car.vehicle_name}</h2>
            <p class="text-sm text-gray-600">💰 $${car.payment_amount?.toFixed(2) || 'N/A'} | 🏦 ${car.lender}</p>
            <p class="text-sm text-gray-500">📆 Due: ${car.due_date || 'N/A'}</p>
          </div>
          <div class="mt-2 sm:mt-0">
            <a href="${car.portal_url}" target="_blank" class="text-blue-500 hover:underline">🔗 Pay</a>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    fetchCarPayments();
  </script>
</body>
</html>
