<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>🐾 Pet Genie</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: left;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
    }
    h2 {
      font-size: 20px;
      margin: 40px 0 10px;
      border-bottom: 2px solid #ccc;
      padding-bottom: 6px;
      width: 100%;
      text-align: left;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-start;
    }
    .icon-card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      width: 100px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .icon-card:hover {
      transform: translateY(-5px);
    }
    .icon-card img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }
    .icon-card p {
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>🐾 Pet Genie Dashboard</h1>

  <div class="dashboard-section">
    <h2>📅 Pet Profile & Records</h2>
    <div class="dashboard">
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/dog.png"/><p>My Pets</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/pet-commands-train.png"/><p>Training Log</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/medical-doctor.png"/><p>Vet Visits</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/vaccine.png"/><p>Vaccinations</p></a></div>
    </div>

    <h2>🍼 Feeding & Care</h2>
    <div class="dashboard">
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/dog-bowl.png"/><p>Feeding Schedule</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/dog-walking.png"/><p>Walk Log</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/grooming.png"/><p>Grooming</p></a></div>
    </div>

    <h2>🚨 Alerts & Automations</h2>
    <div class="dashboard">
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/reminder.png"/><p>Care Reminders</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/email.png"/><p>Alerts</p></a></div>
      <div class="icon-card"><a href="#"><img src="https://img.icons8.com/color/48/alarm.png"/><p>Emergency Info</p></a></div>
    </div>
  </div>
</body>
</html>
