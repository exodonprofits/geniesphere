
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Meal Plan</title>
  <link href="../gs.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
.hidden-recipe {
  display: none;
  margin-top: 1rem;
  background: #f0f4f8;
  padding: 1rem;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>

</head>
<body>
  <div class="form-section">
    <h2 style="text-align:center; color:#2563EB;">📅 Weekly Meal Plan</h2>
    <div id="mealPlanContainer">Loading your personalized plan...</div>
    <div style="text-align:center; margin-top: 2rem;">
      <a href="meal-planner.html" class="back-button">⬅️ Back to Meal Planner</a>
    </div>
  </div>

  <script>
    function showRecipe(id) {
      id = id.startsWith('recipe-') ? id : 'recipe-' + id;
      const el = document.getElementById(id);
      if (el) {
        el.style.display = el.style.display === "none" || el.style.display === "" ? "block" : "none";
      }
    }
    window.showRecipe = showRecipe;
</script>
</body>
</html>
