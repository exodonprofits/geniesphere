<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Meal Plan Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</head>
<body>
  <form id="mealForm">
    <!-- Step 1: Personal Information -->
    <div class="form-step active">
      <h2>Step 1: Personal Information</h2>
      <div class="input-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="input-group">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
      </div>
      <div class="input-group">
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="nonbinary">Non-binary</option>
          <option value="prefer_not_say">Prefer not to say</option>
        </select>
      </div>
    </div>

    <!-- Step 2: Health & Dietary Preferences -->
    <div class="form-step">
      <h2>Step 2: Health & Dietary Preferences</h2>
      <label>Medical Conditions:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="medical" value="diabetes"> Diabetes</label>
        <label><input type="checkbox" name="medical" value="hypertension"> Hypertension</label>
        <label><input type="checkbox" name="medical" value="celiac"> Celiac Disease</label>
        <label><input type="checkbox" name="medical" value="none"> None</label>
        <label><input type="checkbox" name="medical" value="other"> Other</label>
      </div>

      <label>Allergies:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="allergies" value="nuts"> Nuts</label>
        <label><input type="checkbox" name="allergies" value="dairy"> Dairy</label>
        <label><input type="checkbox" name="allergies" value="gluten"> Gluten</label>
        <label><input type="checkbox" name="allergies" value="shellfish"> Shellfish</label>
        <label><input type="checkbox" name="allergies" value="none"> None</label>
        <label><input type="checkbox" name="allergies" value="other"> Other</label>
      </div>

      <label>Dietary Restrictions:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="diet" value="vegetarian"> Vegetarian</label>
        <label><input type="checkbox" name="diet" value="vegan"> Vegan</label>
        <label><input type="checkbox" name="diet" value="keto"> Keto</label>
        <label><input type="checkbox" name="diet" value="halal"> Halal</label>
        <label><input type="checkbox" name="diet" value="none"> None</label>
        <label><input type="checkbox" name="diet" value="other"> Other</label>
      </div>

      <div class="input-group">
        <label for="goals">Nutritional Goals:</label>
        <select id="goals" name="goals" required>
          <option value="">Select</option>
          <option value="weight_loss">Weight Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="maintenance">Maintenance</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <!-- Step 3: Meal Preferences -->
    <div class="form-step">
      <h2>Step 3: Meal Preferences</h2>
      <div class="input-group">
        <label for="meals_per_day">Meals per Day:</label>
        <select id="meals_per_day" name="meals_per_day" required>
          <option value="">Select</option>
          <option value="3_meals">3 Meals</option>
          <option value="3_meals_2_snacks">3 Meals + 2 Snacks</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <label>Cuisine Preferences:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="cuisine" value="vietnamese"> Vietnamese</label>
        <label><input type="checkbox" name="cuisine" value="mediterranean"> Mediterranean</label>
        <label><input type="checkbox" name="cuisine" value="asian"> Asian</label>
        <label><input type="checkbox" name="cuisine" value="american"> American</label>
        <label><input type="checkbox" name="cuisine" value="other"> Other</label>
      </div>

      <div class="input-group">
        <label for="disliked_foods">Disliked Foods:</label>
        <input type="text" id="disliked_foods" name="disliked_foods" required>
      </div>

      <label>Preferred Meal Types:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="meal_type" value="hot_lunches"> Hot Lunches</label>
        <label><input type="checkbox" name="meal_type" value="cold_dishes"> Cold Dishes</label>
        <label><input type="checkbox" name="meal_type" value="soups"> Soups</label>
        <label><input type="checkbox" name="meal_type" value="salads"> Salads</label>
        <label><input type="checkbox" name="meal_type" value="other"> Other</label>
      </div>
    </div>

    <!-- Step 4: Cooking & Lifestyle Habits -->
    <div class="form-step">
      <h2>Step 4: Cooking & Lifestyle Habits</h2>
      <div class="input-group">
        <label for="cooking_skill">Cooking Skill Level:</label>
        <select id="cooking_skill" name="cooking_skill" required>
          <option value="">Select</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <label>Available Kitchen Equipment:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="equipment" value="oven"> Oven</label>
        <label><input type="checkbox" name="equipment" value="microwave"> Microwave</label>
        <label><input type="checkbox" name="equipment" value="blender"> Blender</label>
        <label><input type="checkbox" name="equipment" value="slow_cooker"> Slow Cooker</label>
        <label><input type="checkbox" name="equipment" value="other"> Other</label>
      </div>
    </div>

    <!-- Step 5: Shopping & Budget -->
    <div class="form-step">
      <h2>Step 5: Shopping & Budget</h2>
      <div class="input-group">
        <label for="grocery_budget">Weekly Grocery Budget:</label>
        <input type="number" id="grocery_budget" name="grocery_budget" required>
      </div>

      <label>Pantry Staples Available:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="pantry" value="rice"> Rice</label>
        <label><input type="checkbox" name="pantry" value="pasta"> Pasta</label>
        <label><input type="checkbox" name="pantry" value="canned_goods"> Canned Goods</label>
        <label><input type="checkbox" name="pantry" value="spices"> Spices</label>
        <label><input type="checkbox" name="pantry" value="other"> Other</label>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="form-navigation">
      <button type="button" id="prevBtn" style="display:none">Back</button>
      <button type="button" id="nextBtn">Next</button>
    </div>

  </form>
</body>
</html>
