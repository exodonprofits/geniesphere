<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭 Career Path Planner</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 2rem;
    }
    .hidden { display: none; }
    .step-indicator {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      gap: 10px;
    }
    .step-indicator div {
      width: 12px;
      height: 12px;
      background-color: #ccc;
      border-radius: 50%;
    }
    .step-indicator .active {
      background-color: #2c3e50;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    button {
      margin-top: 1rem;
    }
    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧭 Career Path Planner</h1>
    <div class="step-indicator">
      <div class="active"></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <form id="careerForm" onsubmit="submitForm(event)">
      <!-- Step 1 -->
      <div id="step1" class="step">
        <h2>Step 1: 👤 About You</h2>
        <label>Full Name<br><input type="text" name="fullName" /></label><br><br>
        <label>Email Address<br><input type="email" name="email" /></label><br><br>
        <label>Grade Level<br>
          <select name="gradeLevel">
            <option>6th Grade</option>
            <option>7th Grade</option>
            <option>8th Grade</option>
            <option>9th Grade</option>
            <option>10th Grade</option>
            <option>11th Grade</option>
            <option>12th Grade</option>
            <option>College Freshman</option>
          </select>
        </label><br><br>
        <label>Dream Career or Job<br><input type="text" name="dreamCareer" placeholder="e.g. Game Designer, Doctor, Entrepreneur" /></label><br>
        <button type="button" onclick="nextStep(2)">Next ➡️</button>
      </div>

      <!-- Step 2 -->
      <div id="step2" class="step hidden">
        <h2>Step 2: 💼 Career Preferences</h2>
        <label>🌟 Motivators<br>
          <input type="checkbox" name="motivators" value="Salary"> Salary<br>
          <input type="checkbox" name="motivators" value="Balance"> Work-life Balance<br>
          <input type="checkbox" name="motivators" value="Security"> Security<br>
          <input type="checkbox" name="motivators" value="Growth"> Growth<br>
          <input type="checkbox" name="motivators" value="Impact"> Helping others
        </label><br><br>
        <label>🏢 Preferred Environment<br>
          <select name="environment">
            <option>Office</option>
            <option>Classroom</option>
            <option>Outdoors</option>
            <option>Lab</option>
            <option>Remote</option>
          </select>
        </label><br><br>
        <label>💪 Strengths<br>
          <input type="checkbox" name="strengths" value="Communication"> Communication<br>
          <input type="checkbox" name="strengths" value="Problem-solving"> Problem-solving<br>
          <input type="checkbox" name="strengths" value="Leadership"> Leadership<br>
          <input type="checkbox" name="strengths" value="Organization"> Organization<br>
          <input type="checkbox" name="strengths" value="Creativity"> Creativity
        </label><br>
        <button type="button" onclick="prevStep(1)">⬅️ Back</button>
        <button type="button" onclick="nextStep(3)">Next ➡️</button>
      </div>

      <!-- Step 3 -->
      <div id="step3" class="step hidden">
        <h2>Step 3: 🎓 Subjects You Enjoy</h2>
        <label>
          <input type="checkbox" name="subjects" value="Science"> Science<br>
          <input type="checkbox" name="subjects" value="Math"> Math<br>
          <input type="checkbox" name="subjects" value="English"> English<br>
          <input type="checkbox" name="subjects" value="Art"> Art<br>
          <input type="checkbox" name="subjects" value="Technology"> Technology<br>
          <input type="checkbox" name="subjects" value="History"> History<br>
          <input type="checkbox" name="subjects" value="Health"> Health<br>
          <input type="checkbox" name="subjects" value="Business"> Business
        </label><br>
        <button type="button" onclick="prevStep(2)">⬅️ Back</button>
        <button type="button" onclick="nextStep(4)">Next ➡️</button>
      </div>

      <!-- Step 4 -->
      <div id="step4" class="step hidden">
        <h2>🎉 Suggestions</h2>
        <p>This will be replaced by AI-generated suggestions.</p>
        <button type="button" onclick="prevStep(3)">⬅️ Back</button>
        <button type="submit">🎯 Finish</button>
      </div>
      <div id="aiResult" class="hidden" style="margin-top: 2rem; padding: 1rem; background: #f0f8ff; border: 1px solid #ccc; border-radius: 8px;"></div>
    </form>
  </div>

  <script>
    function nextStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
      document.getElementById('step' + step).classList.remove('hidden');
      updateStepIndicator(step);
    }

    function prevStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
      document.getElementById('step' + step).classList.remove('hidden');
      updateStepIndicator(step);
    }

    function updateStepIndicator(currentStep) {
      const steps = document.querySelectorAll('.step-indicator div');
      steps.forEach((el, i) => el.classList.toggle('active', i === currentStep - 1));
    }

    async function submitForm(e) {
      e.preventDefault();
      const form = document.getElementById('careerForm');
      const formData = new FormData(form);
      const json = {};

      for (let [key, value] of formData.entries()) {
        if (json[key]) {
          if (Array.isArray(json[key])) {
            json[key].push(value);
          } else {
            json[key] = [json[key], value];
          }
        } else {
          json[key] = value;
        }
      }

      const resultBox = document.getElementById("aiResult");
      resultBox.innerHTML = "⏳ Asking AI for career suggestions...";
      resultBox.classList.remove("hidden");

      try {
        const chatResponse = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer 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"
          },
          body: JSON.stringify({
            model: "gpt-4",
            messages: [
              {
                role: "system",
                content: "You are a helpful career advisor."
              },
              {
                role: "user",
                content: `Based on this info, suggest 3 career paths:

${JSON.stringify(json, null, 2)}\n`
              }
            ]
          })
        });

        const chatData = await chatResponse.json();
        const reply = chatData.choices[0].message.content;
        resultBox.innerHTML = `<h3>🔍 Suggested Career Paths:</h3><p>${reply}</p>`;
      } catch (error) {
        console.error("Error calling OpenAI:", error);
        resultBox.innerHTML = "⚠️ Unable to fetch career suggestions right now.";
      }
    }
  </script>
</body>
</html>
