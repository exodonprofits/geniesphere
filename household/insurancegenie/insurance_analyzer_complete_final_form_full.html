
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { background: #0F172A; color: #F8FAFC; font-family: 'Inter', sans-serif; padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    .form-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border-radius: 1.5rem; padding: 2rem; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 2rem; position: relative; }
    h2 { background: linear-gradient(45deg,#2BFFD9,#7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; margin-top: 0.25rem; background: rgba(255,255,255,0.05); color: #F8FAFC; }
    .remove-button { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: #f87171; font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <h2>🚗 Car Insurance</h2>
  <div class="form-card">
    <label>Year, Make, and Model</label><input type='text' name='car_make_model[]'/>
    <label>VIN (optional)</label><input type='text' name='car_vin[]'/>
    <label>Ownership Type</label>
    <select name='car_ownership[]'>
      <option value='Own'>Own</option>
      <option value='Finance'>Finance</option>
      <option value='Lease'>Lease</option>
    </select>
    <label>Use Type</label>
    <label><input type='checkbox' name='car_use[]' value='Personal'/> Personal</label>
    <label><input type='checkbox' name='car_use[]' value='Business'/> Business</label>
    <label><input type='checkbox' name='car_use[]' value='Commute'/> Commute</label>
    <label><input type='checkbox' name='car_use[]' value='Rideshare'/> Rideshare</label>
    <label>Estimated Annual Mileage</label><input type='number' name='car_mileage[]'/>
    <label>Parking Location</label><input type='text' name='car_parking[]'/>
    <label>Zip Code Where Car Is Kept</label><input type='text' name='car_zip[]'/>
    <label>Liability Limits</label>
    <select name='car_liability[]'>
      <option value='25/50/25'>25/50/25</option>
      <option value='50/100/50'>50/100/50</option>
      <option value='100/300/100'>100/300/100</option>
      <option value='250/500/250'>250/500/250</option>
    </select>
    <label>Comprehensive Deductible</label>
    <select name='car_comp[]'>
      <option value='0'>0</option>
      <option value='250'>250</option>
      <option value='500'>500</option>
      <option value='1000'>1000</option>
    </select>
    <label>Collision Deductible</label>
    <select name='car_collision[]'>
      <option value='0'>0</option>
      <option value='250'>250</option>
      <option value='500'>500</option>
      <option value='1000'>1000</option>
    </select>
    <label>Driver Name</label><input type='text' name='driver_name[]'/>
    <label>DOB</label><input type='date' name='driver_dob[]'/>
    <label>License Number</label><input type='text' name='driver_license[]'/>
    <label>Driving History</label><textarea name='driver_history[]' rows='3'></textarea>
  </div>

  <h2>🏠 Home Insurance</h2>
  <div class="form-card">
    <label>Property Address</label><input type='text' name='home_address[]'/>
    <label>Type</label><input type='text' name='home_type[]'/>
    <label>Square Footage</label><input type='number' name='home_sqft[]'/>
    <label>Year Built</label><input type='number' name='home_year[]'/>
    <label>Roof Age</label><input type='number' name='home_roof[]'/>
    <label>Security Devices</label><input type='text' name='home_security[]'/>
    <label>Claim History</label><textarea name='home_claims[]'></textarea>
    <label>Mortgage Status</label><input type='text' name='home_mortgage[]'/>
    <label>Occupancy</label><input type='text' name='home_occupancy[]'/>
  </div>

  <h2>🏘️ Rental Property</h2>
  <div class="form-card">
    <label>Rental Address</label><input type='text' name='rental_address[]'/>
    <label>Number of Units</label><input type='number' name='rental_units[]'/>
    <label>Monthly Rental Income</label><input type='number' name='rental_income[]'/>
    <label>Is Tenant Occupied?</label><input type='text' name='rental_occupied[]'/>
    <label>Liability Coverage</label><input type='number' name='rental_liability[]'/>
    <label>Property Manager</label><input type='text' name='rental_manager[]'/>
  </div>

  <h2>🏢 Business Insurance</h2>
  <div class="form-card">
    <label>Business Name</label><input type='text' name='biz_name[]'/>
    <label>Industry</label><input type='text' name='biz_industry[]'/>
    <label>Employees</label><input type='number' name='biz_employees[]'/>
    <label>Annual Revenue</label><input type='number' name='biz_revenue[]'/>
    <label>Business Location</label><input type='text' name='biz_location[]'/>
    <label>Assets</label><input type='text' name='biz_assets[]'/>
    <label>Liability Limits</label><input type='text' name='biz_liability[]'/>
    <label>Prior Claims</label><textarea name='biz_claims[]'></textarea>
  </div>

  <h2>☂️ Umbrella Insurance</h2>
  <div class="form-card">
    <label>Total Asset Value</label><input type='number' name='umbrella_assets[]'/>
    <label>Properties Owned</label><input type='number' name='umbrella_props[]'/>
    <label>Vehicles Owned</label><input type='number' name='umbrella_vehicles[]'/>
    <label>Current Liability Coverage</label><input type='text' name='umbrella_liability[]'/>
    <label>Additional Risks</label><textarea name='umbrella_risks[]'></textarea>
  </div>
</div>
</body>
</html>
