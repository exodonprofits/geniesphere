<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Manage Employees — Salon Genie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script type="module">
import { requireAuth } from "/shared/js/core/auth.js";
window.__requireAuth = requireAuth;
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   SALON GENIE — MANAGE EMPLOYEES
   Master-detail layout · matches customers.html exactly
═══════════════════════════════════════════════════════════════ */
:root {
  --bg:#FDFAF6; --s1:#FFFFFF; --s2:#F5F0E8; --s3:#EDE6D8;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.11);
  --ink:#1C1814; --mid:#6A6058; --muted:#A89A8E;
  --blush:#C4856A; --blush-dim:rgba(196,133,106,0.12);
  --amber:#C4993A; --amber-dim:rgba(196,153,58,0.12);
  --teal:#3D7A72;  --teal-dim:rgba(61,122,114,0.12);
  --rose:#C45A4A;  --rose-dim:rgba(196,90,74,0.1);
  --violet:#7A4EA8; --violet-dim:rgba(122,78,168,0.10);
  --radius:12px; --shadow:0 2px 14px rgba(28,24,20,0.07); --header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;font-weight:400}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ── TOPBAR ── */
header{position:sticky;top:0;z-index:100;height:var(--header-h);background:var(--s2);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(28,24,20,0.06)}
.ap-header{max-width:1440px;margin:0 auto;display:flex;align-items:center;height:100%;padding:0 28px;gap:16px}
.ap-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ap-logo-gem{width:30px;height:30px;background:linear-gradient(135deg,var(--blush),var(--amber));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ap-brandname{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);letter-spacing:.3px}
.ap-brandname span{color:var(--blush)}
.ap-brandtag{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:.5px}
.ap-nav{display:flex;margin-left:8px}
.nav-item{padding:0 16px;height:var(--header-h);display:flex;align-items:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.nav-item.active{color:var(--blush);border-bottom-color:var(--blush);font-weight:600}
.nav-item:hover:not(.active){color:var(--mid)}
.ap-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.ap-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.3px;cursor:pointer;border:none;transition:all .2s;font-family:'DM Sans',sans-serif}
.ap-btn-ghost{background:rgba(255,255,255,0.6);border:1px solid var(--border2);color:var(--mid)}
.ap-btn-ghost:hover{border-color:var(--blush);color:var(--blush)}
.ap-btn-primary{background:var(--blush);color:white;box-shadow:0 2px 12px rgba(196,133,106,0.3)}
.ap-btn-primary:hover{background:#B5745A;transform:translateY(-1px)}
.ap-user-btn{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:7px 13px;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.ap-user-btn:hover{border-color:var(--blush)}
.ap-user-avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--blush),var(--amber));display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:700;flex-shrink:0}

/* ── PAGE SHELL ── */
.page-shell{display:flex;height:calc(100vh - var(--header-h));overflow:hidden;max-width:1440px;margin:0 auto}

/* ── SIDEBAR ── */
.emp-sidebar{width:300px;min-width:300px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-head-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.count-badge{font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;padding:2px 8px;border-radius:20px;background:var(--blush-dim);color:var(--blush)}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);margin-bottom:10px}
.searchbar input{border:none;outline:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);width:100%}
.searchbar input::placeholder{color:var(--muted)}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.f-pill{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border2);background:var(--s1);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.f-pill.active{background:var(--blush);color:white;border-color:var(--blush)}
.f-pill:hover:not(.active){border-color:var(--blush);color:var(--blush)}
.emp-list{flex:1;overflow-y:auto}
.emp-item{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative}
.emp-item:hover{background:var(--s2)}
.emp-item.active{background:var(--blush-dim)}
.emp-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blush);border-radius:0 2px 2px 0}
.ei-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.ei-meta{flex:1;min-width:0}
.ei-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ei-sub{font-size:11px;color:var(--muted);margin-top:1px}
.ei-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.b-active  {background:var(--teal-dim);color:var(--teal)}
.b-inactive{background:var(--rose-dim);color:var(--rose)}
.b-tech    {background:var(--blush-dim);color:var(--blush)}
.b-manager {background:var(--violet-dim);color:var(--violet)}
.b-reception{background:var(--amber-dim);color:var(--amber)}

/* ── MAIN PANEL ── */
.emp-main{flex:1;overflow-y:auto;padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:80px 0}
.empty-state p{font-size:13px}

/* ── PROFILE HEADER ── */
.profile-shell{background:var(--s1);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.profile-top{padding:20px 24px;display:flex;gap:18px;align-items:flex-start}
.profile-avatar{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;flex-shrink:0}
.profile-name{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);margin-bottom:6px}
.profile-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.profile-contacts{display:flex;gap:18px;flex-wrap:wrap}
.profile-contact{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mid)}
.profile-actions{display:flex;gap:7px;flex-shrink:0;align-self:flex-start}

/* ── KPI STRIP ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcard{background:var(--s1);border-radius:var(--radius);border:1px solid var(--border);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:sgFadeUp .3s ease both}
.kcard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.kcard.blush::after{background:var(--blush)}
.kcard.amber::after{background:var(--amber)}
.kcard.teal::after{background:var(--teal)}
.kcard.violet::after{background:var(--violet)}
.khead{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kmain{font-family:'DM Serif Display',serif;font-size:28px;color:var(--ink);line-height:1}
.ksub{font-size:11px;color:var(--muted);margin-top:4px}

/* ── TABS ── */
.tabs-shell{background:var(--s1);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.tabs-bar{display:flex;border-bottom:1px solid var(--border);background:var(--s2);padding:0 4px;overflow-x:auto}
.tab-btn{padding:12px 16px;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--muted);position:relative;transition:color .15s;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--mid)}
.tab-btn.active{color:var(--blush);font-weight:600}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--blush)}
.tab-panel{display:none;padding:20px 24px}
.tab-panel.active{display:block}

/* ── FORM INSIDE TABS ── */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-group.span2{grid-column:span 2}
.field-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.field-hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.field-input{padding:9px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s;width:100%}
.field-input:focus{border-color:var(--blush);background:var(--s1)}
.field-input::placeholder{color:var(--muted)}
select.field-input{cursor:pointer}
textarea.field-input{resize:vertical;min-height:80px}

/* ── PAYROLL CALLOUT CARDS ── */
.payroll-callout{padding:16px 18px;border-radius:10px;background:var(--s2);border-left:3px solid var(--blush);margin-bottom:16px}
.payroll-callout-title{font-weight:700;font-size:14px;margin-bottom:6px}
.payroll-type-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.payroll-type-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--s1);color:var(--mid);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.payroll-type-btn.active{background:var(--blush);color:white;border-color:var(--blush)}

/* ── SCHEDULE TABLE ── */
.schedule-table{width:100%;border-collapse:collapse;font-size:12px}
.schedule-table th{text-align:left;padding:8px 10px;background:var(--s2);color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border)}
.schedule-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.schedule-table input[type="time"]{padding:5px 8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);outline:none}
.schedule-table input[type="time"]:focus{border-color:var(--blush)}

/* ── SERVICES AREA ── */
.svc-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.svc-toolbar-right{display:flex;align-items:center;gap:8px}
/* ── Services tab ── */
#servicesList{max-height:440px;overflow-y:auto;padding:0 0 8px}
.svc-cat-header{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:14px 4px 6px;margin-top:4px}
.svc-cat-header:first-child{padding-top:4px}
.svc-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;background:var(--s1);border:1px solid var(--border);margin-bottom:6px;transition:border-color .15s}
.svc-row:hover{border-color:var(--blush-dim)}
.svc-row-left{display:flex;flex-direction:column;gap:2px}
.svc-row-name{font-size:13px;font-weight:500;color:var(--ink)}
.svc-row-cat{font-size:11px;color:var(--muted)}
/* iOS-style toggle */
.svc-toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.svc-toggle input{opacity:0;width:0;height:0;position:absolute}
.svc-toggle-track{position:absolute;inset:0;border-radius:13px;background:var(--s3);transition:background .2s;cursor:pointer}
.svc-toggle input:checked + .svc-toggle-track{background:var(--blush)}
.svc-toggle-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .2s;pointer-events:none}
.svc-toggle input:checked ~ .svc-toggle-thumb{transform:translateX(18px)}
/* Toolbar */
.svc-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.svc-count-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--blush);color:white;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;min-width:36px}
.svc-toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.svc-toolbar-toggle-group{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid)}
.svc-master-toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.svc-master-toggle input{opacity:0;width:0;height:0;position:absolute}
.svc-master-track{position:absolute;inset:0;border-radius:11px;background:var(--s3);transition:background .2s;cursor:pointer}
.svc-master-toggle input:checked + .svc-master-track{background:var(--blush)}
.svc-master-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;pointer-events:none}
.svc-master-toggle input:checked ~ .svc-master-thumb{transform:translateX(18px)}

/* ── NOTES TAB ── */
.notes-area{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note-card{background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px 14px}
.note-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.note-author{font-size:11px;font-weight:700;color:var(--blush)}
.note-date{font-size:10px;color:var(--muted)}
.note-text{font-size:12px;color:var(--mid);line-height:1.55}
.add-note-btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;border:1.5px dashed var(--border2);background:none;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;width:100%}
.add-note-btn:hover{border-color:var(--blush);color:var(--blush);background:var(--blush-dim)}

/* ── BUTTONS ── */
.qp-btn{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border2);background:var(--bg);color:var(--mid);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.qp-btn:hover{border-color:var(--blush);color:var(--blush);background:var(--blush-dim)}
.qp-btn.primary{background:var(--blush);color:white;border-color:var(--blush)}
.qp-btn.primary:hover{background:#B5745A}
.qp-btn.teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(61,122,114,.25)}
.qp-btn.teal:hover{background:var(--teal);color:white}
.qp-btn.rose{background:var(--rose-dim);color:var(--rose);border-color:rgba(196,90,74,.25)}
.qp-btn.rose:hover{background:var(--rose);color:white}

/* ── STICKY SAVE BAR ── */
.save-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(253,250,246,0.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 24px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:50;box-shadow:0 -4px 20px rgba(28,24,20,0.08)}
.save-bar.visible{display:flex}
.save-bar-name{font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink)}
.save-bar-actions{display:flex;gap:8px}

/* ── ADD EMPLOYEE MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(28,24,20,0.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--s1);border-radius:16px;padding:28px;width:520px;max-width:95vw;box-shadow:0 20px 60px rgba(28,24,20,0.18);animation:sgFadeUp .18s ease both;max-height:90vh;overflow-y:auto}
.modal h2{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:20px;color:var(--ink)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-group label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blush);background:var(--s1)}
.form-group textarea{resize:vertical;min-height:72px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

/* ── PORTAL SECTION CARDS ── */
.portal-section{background:var(--bg);border:1px solid var(--border2);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.portal-section-title{font-weight:700;font-size:14px;margin-bottom:4px;color:var(--ink)}
.portal-section-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

/* ── TOAST ── */
.toast-wrap{position:fixed;top:72px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px}
.sg-toast{background:var(--ink);color:#F7F3EE;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:var(--shadow);animation:sgFadeUp .2s ease}
.sg-toast.success{border-left:3px solid var(--teal)}
.sg-toast.error{border-left:3px solid var(--rose)}

/* ── SKELETON ── */
.skeleton{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes sgFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── TOGGLE SWITCH ── */
.toggle-wrap{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle-switch{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--s3);border-radius:20px;transition:background .2s}
.toggle-switch input:checked + .toggle-track{background:var(--teal)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;background:white;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle-switch input:checked ~ .toggle-thumb{transform:translateX(16px)}

/* ── USER DROPDOWN ── */
.user-menu-wrap{position:relative}
.ap-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--s1);border:1px solid var(--border2);border-radius:12px;box-shadow:0 8px 32px rgba(28,24,20,0.14);min-width:200px;z-index:300;overflow:hidden;display:none;animation:sgFadeUp .15s ease both}
.ap-dropdown.open{display:block}
.ap-dropdown-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--s2)}
.ap-dropdown-name{font-weight:600;font-size:13px;color:var(--ink)}
.ap-dropdown-email{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.ap-dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--mid);cursor:pointer;transition:background .12s;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;text-align:left;text-decoration:none}
.ap-dropdown-item:hover{background:var(--s2);color:var(--ink)}
.ap-dropdown-item.danger{color:var(--rose)}
.ap-dropdown-item.danger:hover{background:var(--rose-dim)}

      <div class="searchbar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Search employees…" oninput="renderList()"/>

      <div class="filter-row">

<!-- ══ ADD EMPLOYEE MODAL ══ -->

        </select>

    <div class="modal-actions">

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
const COLORS = ['#C4856A','#3D7A72','#7A4EA8','#C4993A','#C45A4A','#5A8AC4'];
let activeFilter = 'all';
let activeId     = null;
let employees    = [];
let businessId   = null;
let sbClient     = null;
let _hasUnsaved  = false;

/* ══ HELPERS ══ */
function showToast(msg, type='success') {
  let wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'sg-toast ' + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

const COLORS_FN = id => COLORS[(typeof id==='number' ? id : (parseInt(id,16)||Math.abs(id?.split('').reduce((a,c)=>a+c.charCodeAt(0),0)||0))) % COLORS.length];
const ini = e => {
  const n = e.display_name || e.full_name || '?';
  const parts = n.trim().split(' ');
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
};
const fmtDate = d => { try { return d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; } catch(_) { return d||'—'; } };
function esc(s) { return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

function roleBadge(emp) {
  const role = (emp.role||'').toLowerCase();
  const status = (emp.status||'active').toLowerCase();
  if (status === 'inactive') return ['b-inactive','Inactive'];
  if (role.includes('manager') || role.includes('owner')) return ['b-manager', emp.role];
  if (role.includes('reception')) return ['b-reception','Reception'];
  if (role.includes('tech') || role.includes('nail')) return ['b-tech','Tech'];
  return ['b-active', status === 'active' ? 'Active' : emp.role || 'Staff'];
}

/* ══ FILTER ══ */
function matchesFilter(emp) {
  const role   = (emp.role||'').toLowerCase();
  const status = (emp.status||'active').toLowerCase();
  if (activeFilter === 'active')    return status === 'active';
  if (activeFilter === 'inactive')  return status === 'inactive';
  if (activeFilter === 'tech')      return role.includes('tech') || role.includes('nail');
  if (activeFilter === 'reception') return role.includes('reception');
  return true;
}

function setFilter(btn, f) {
  document.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = f;
  renderList();
}

/* ══ LOAD ══ */
async function loadEmployees() {
  const listEl = document.getElementById('empList');
  listEl.innerHTML = Array(6).fill(0).map(()=>`
    <div class="emp-item" style="pointer-events:none">
      <div class="skeleton" style="width:38px;height:38px;border-radius:10px;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="skeleton" style="height:13px;width:70%;margin-bottom:5px"></div>
        <div class="skeleton" style="height:11px;width:50%"></div>
      </div>
    </div>`).join('');

  if (!sbClient || !businessId) { useDemoData(); return; }

  try {
    const { data, error } = await sbClient.schema('salon').from('employees')
      .select('*').eq('business_id', businessId)
      .order('full_name', { ascending: true });
    if (error) throw error;
    employees = data || [];
    if (!employees.length) {
      listEl.innerHTML = '<p style="padding:24px 16px;color:var(--muted);font-size:12px;text-align:center">No employees yet.<br>Click + Add Employee to get started.</p>';
    } else {
      renderList();
      showEmployee(employees[0].id);
    }
    updateKPIs();
  } catch(err) {
    console.warn('Employees load failed:', err);
    showToast('Could not load employees — showing demo data', 'error');
    useDemoData();
  }
}

function useDemoData() {
  employees = [
    { id:'demo-1', full_name:'Lily Nguyen', display_name:'Lily', job_title:'Nail Technician', role:'Nail Tech', status:'active', email:'lily@salon.com', phone:'(630) 555-0101', start_date:'2021-03-15', wage_type:'1099', rate_1099:60, commission_split_check_pct:100, notes:'Top performer. Specializes in gel X and nail art.' },
    { id:'demo-2', full_name:'Kim Tran',    display_name:'Kim',  job_title:'Nail Technician', role:'Nail Tech', status:'active', email:'kim@salon.com',  phone:'(630) 555-0102', start_date:'2020-06-01', wage_type:'W2',  w2_percent:55, notes:'Reliable. Prefers dip powder services.' },
    { id:'demo-3', full_name:'Sarah Lee',   display_name:'Sarah',job_title:'Receptionist',    role:'Receptionist',status:'active',email:'sarah@salon.com',phone:'(630) 555-0103', start_date:'2022-01-10', wage_type:'Hourly', hourly_rate:18, notes:'Great with clients. Manages the front desk.' },
    { id:'demo-4', full_name:'Mai Vo',      display_name:'Mai',  job_title:'Nail Technician', role:'Nail Tech', status:'inactive',email:'mai@salon.com',  phone:'(630) 555-0104', start_date:'2019-08-20', wage_type:'1099', rate_1099:60, notes:'On leave.' },
  ];
  renderList();
  showEmployee('demo-1');
  document.getElementById('countBadge').textContent = employees.length + ' (demo)';
  updateKPIs();
}

/* ══ SIDEBAR LIST ══ */
function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = employees.filter(e => {
    const mf = matchesFilter(e);
    const mq = !q || (e.full_name+' '+(e.display_name||'')+' '+(e.email||'')+' '+(e.job_title||'')).toLowerCase().includes(q);
    return mf && mq;
  });
  document.getElementById('countBadge').textContent = list.length;
  const el = document.getElementById('empList');
  if (!list.length) {
    el.innerHTML = '<p style="padding:20px;color:var(--muted);font-size:12px;text-align:center">No employees match</p>';
    return;
  }
  el.innerHTML = list.map(e => {
    const [bCls, bLabel] = roleBadge(e);
    const name = e.display_name || e.full_name || 'Unknown';
    return `<div class="emp-item${activeId===e.id?' active':''}" onclick="showEmployee('${esc(e.id)}')">
      <div class="ei-avatar" style="background:${COLORS_FN(e.id)}">${ini(e)}</div>
      <div class="ei-meta">
        <div class="ei-name">${esc(name)}</div>
        <div class="ei-sub">${esc(e.job_title||e.role||'Staff')}</div>
      </div>
      <span class="ei-badge ${bCls}">${esc(bLabel)}</span>
    </div>`;
  }).join('');
}

/* ══ KPIs ══ */
function updateKPIs() {
  const active   = employees.filter(e => (e.status||'active') === 'active').length;
  const techs    = employees.filter(e => (e.role||'').toLowerCase().includes('tech') || (e.role||'').toLowerCase().includes('nail')).length;
  const reception= employees.filter(e => (e.role||'').toLowerCase().includes('reception')).length;
  const inactive = employees.filter(e => (e.status||'active') === 'inactive').length;
  const kEl = id => document.getElementById(id);
  if(kEl('kTotal'))   kEl('kTotal').textContent   = employees.length;
  if(kEl('kActive'))  kEl('kActive').textContent  = active;
  if(kEl('kTechs'))   kEl('kTechs').textContent   = techs;
  if(kEl('kReception'))kEl('kReception').textContent = reception;
}

/* ══ PROFILE ══ */
function showEmployee(id) {
  if (_hasUnsaved && activeId && activeId !== id) {
    if (!confirm('You have unsaved changes. Discard and switch employee?')) return;
    _hasUnsaved = false;
  }
  activeId = id;
  renderList();
  const emp = employees.find(e => e.id == id);
  if (!emp) return;
  document.getElementById('emptyState').style.display = 'none';
  const area = document.getElementById('profileArea');
  area.style.display = 'flex';
  renderProfile(emp);
}

function renderProfile(emp) {
  const area = document.getElementById('profileArea');
  const [bCls, bLabel] = roleBadge(emp);
  const name = emp.display_name || emp.full_name || 'Unknown';
  const payType = (emp.wage_type || emp.employment_type || '1099');

  area.innerHTML = `
    <!-- PROFILE HEADER -->
    <div class="profile-shell">
      <div class="profile-top">
        <div class="profile-avatar" style="background:${COLORS_FN(emp.id)}">${ini(emp)}</div>
        <div style="flex:1;min-width:0">
          <div class="profile-name">${esc(name)}</div>
          <div class="profile-tags">
            <span class="ei-badge ${bCls}" style="font-size:11px;padding:3px 10px">${esc(bLabel)}</span>
            ${emp.job_title ? `<span class="ei-badge" style="background:var(--s2);color:var(--muted);font-size:11px;padding:3px 10px">${esc(emp.job_title)}</span>` : ''}
            ${emp.start_date ? `<span class="ei-badge" style="background:var(--s2);color:var(--muted);font-size:11px;padding:3px 10px">Since ${fmtDate(emp.start_date)}</span>` : ''}
          </div>
          <div class="profile-contacts">
            ${emp.email  ? `<span class="profile-contact">✉️ ${esc(emp.email)}</span>` : ''}
            ${emp.phone  ? `<span class="profile-contact">📞 ${esc(emp.phone)}</span>` : ''}
          </div>
        </div>
        <div class="profile-actions">
          <button class="qp-btn primary" onclick="saveEmployee('${esc(emp.id)}')">💾 Save</button>
          <button class="qp-btn rose" onclick="deleteEmployee('${esc(emp.id)}')">🗑 Delete</button>
        </div>
      </div>
    </div>

    <!-- KPI STRIP -->
    <div class="kpis" id="empKpis">
      <div class="kcard blush" id="kTotal"><div class="khead">Total Staff</div><div class="kmain">—</div><div class="ksub">across all roles</div></div>
      <div class="kcard teal"  id="kActive"><div class="khead">Active</div><div class="kmain">—</div><div class="ksub">currently employed</div></div>
      <div class="kcard amber" id="kTechs"><div class="khead">Nail Techs</div><div class="kmain">—</div><div class="ksub">service providers</div></div>
      <div class="kcard violet" id="kReception"><div class="khead">Reception</div><div class="kmain">—</div><div class="ksub">front desk staff</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs-shell">
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab(this,'tInfo')">👤 Info</button>
        <button class="tab-btn" onclick="switchTab(this,'tJob')">🧰 Job</button>
        <button class="tab-btn" onclick="switchTab(this,'tServices')">💅 Services</button>
        <button class="tab-btn" onclick="switchTab(this,'tPayroll')">💰 Payroll</button>
        <button class="tab-btn" onclick="switchTab(this,'tPortal')">🔐 Portal</button>
        <button class="tab-btn" onclick="switchTab(this,'tNotes')">📝 Notes</button>
      </div>

      <!-- ── INFO TAB ── -->
      <div class="tab-panel active" id="tInfo">
        <div class="field-grid">
          <div class="field-group"><label class="field-label">Full Name</label><input class="field-input ep-field" id="ep_full_name" value="${esc(emp.full_name||'')}" placeholder="e.g. Anh Le"/></div>
          <div class="field-group"><label class="field-label">Display / Nick Name</label><input class="field-input ep-field" id="ep_display_name" value="${esc(emp.display_name||'')}" placeholder="e.g. Annie – 2L"/></div>
          <div class="field-group">
            <label class="field-label">Job Title</label>
            <select class="field-input ep-field" id="ep_job_title">
              <option value="">Select…</option>
              ${['Nail Technician','Esthetician','Receptionist','Manager','Assistant Manager','Cleaning / Support'].map(o=>`<option${emp.job_title===o?' selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Access Role</label>
            <select class="field-input ep-field" id="ep_role">
              <option value="">Select…</option>
              ${[['nail_tech','💅 Nail Tech'],['receptionist','🛎️ Receptionist'],['cleaning','🧼 Cleaning'],['manager','🧑‍✈️ Manager'],['owner','👑 Owner']].map(([v,l])=>`<option value="${v}"${emp.role===v?' selected':''}>${l}</option>`).join('')}
            </select>
          </div>
          <div class="field-group"><label class="field-label">Start Date</label><input class="field-input ep-field" id="ep_start_date" type="date" value="${emp.start_date||''}"/></div>
          <div class="field-group"><label class="field-label">Employee Code / ID</label><input class="field-input ep-field" id="ep_employee_id" value="${esc(emp.employee_id||'')}" placeholder="e.g. ANN-02"/></div>
          <div class="field-group"><label class="field-label">Email</label><input class="field-input ep-field" id="ep_email" type="email" value="${esc(emp.email||'')}" placeholder="name@example.com" oninput="syncPortalEmail()"/></div>
          <div class="field-group"><label class="field-label">Phone</label><input class="field-input ep-field" id="ep_phone" type="tel" value="${esc(emp.phone||'')}" placeholder="(630) 555-1234"/></div>
          <div class="field-group"><label class="field-label">Photo URL</label><input class="field-input ep-field" id="ep_photo_url" type="url" value="${esc(emp.photo_url||'')}" placeholder="https://…"/></div>
          <div class="field-group"><label class="field-label">Birthday</label><input class="field-input ep-field" id="ep_birthday" type="date" value="${emp.birthday||''}"/></div>
          <div class="field-group span2"><label class="field-label">Address</label><input class="field-input ep-field" id="ep_address" value="${esc(emp.address||'')}" placeholder="Street, City, State, Zip"/></div>
          <div class="field-group"><label class="field-label">Emergency Contact</label><input class="field-input ep-field" id="ep_emergency_contact" value="${esc(emp.emergency_contact||'')}" placeholder="Name & phone"/></div>
          <div class="field-group">
            <label class="field-label">Status</label>
            <select class="field-input ep-field" id="ep_status">
              <option value="active"${(emp.status||'active')==='active'?' selected':''}>✅ Active</option>
              <option value="inactive"${emp.status==='inactive'?' selected':''}>❌ Inactive</option>
            </select>
          </div>
        </div>

        <!-- Schedule -->
        <div style="margin-top:20px">
          <div style="font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink);margin-bottom:6px">📅 Weekly Schedule</div>
          <p class="field-hint" style="margin-bottom:12px">Set default weekly availability. This feeds into the shift planner.</p>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="qp-btn" onclick="fillSchedule('mon-fri','09:00','17:00')">Mon–Fri 9–5</button>
            <button class="qp-btn" onclick="fillSchedule('all','10:00','18:00')">All Days 10–6</button>
            <button class="qp-btn" onclick="fillSchedule('clear')">Clear all</button>
          </div>
          <table class="schedule-table">
            <thead><tr><th>Day</th><th>Enabled</th><th>Start</th><th>End</th></tr></thead>
            <tbody id="scheduleTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- ── JOB TAB ── -->
      <div class="tab-panel" id="tJob">
        <div class="field-grid">
          <div class="field-group">
            <label class="field-label">Work Role (salon function)</label>
            <select class="field-input ep-field" id="ep_primary_role">
              <option value="">Select…</option>
              ${['Technician','Receptionist','Manager','Cleaning'].map(o=>`<option${emp.primary_role===o?' selected':''}>${o}</option>`).join('')}
            </select>
            <p class="field-hint">Controls staffing, service assignment, and how this employee appears in workflows.</p>
          </div>
          <div class="field-group">
            <label class="field-label">Is Service Provider?</label>
            <select class="field-input ep-field" id="ep_is_service_provider">
              <option value="true"${emp.is_service_provider!==false?' selected':''}>Yes — appears in booking & queue</option>
              <option value="false"${emp.is_service_provider===false?' selected':''}>No — support staff only</option>
            </select>
          </div>
          <div class="field-group span2">
            <label class="field-label">Skill Notes</label>
            <textarea class="field-input ep-field" id="ep_skill_notes" rows="4" placeholder="e.g. Gel X, Builder Gel, No wax…">${esc(emp.skill_notes||'')}</textarea>
          </div>
        </div>
      </div>

      <!-- ── SERVICES TAB ── -->
      <div class="tab-panel" id="tServices">
        <div class="svc-toolbar">
          <div style="display:flex;align-items:center;gap:8px">
            <label class="field-label" style="margin:0">Allowed Services</label>
            <span class="svc-count-badge" id="servicesSelectedCount">0</span>
            <span style="font-size:11px;color:var(--muted)">selected</span>
          </div>
          <div class="svc-toolbar-right">
            <div class="svc-toolbar-toggle-group">
              <span>Turn Off All</span>
              <label class="svc-master-toggle">
                <input type="checkbox" id="svcMasterToggle" onchange="onMasterToggle(this)"/>
                <div class="svc-master-track"></div>
                <div class="svc-master-thumb"></div>
              </label>
              <span>Turn On All</span>
            </div>
            <button class="qp-btn" onclick="toggleAllServices(false)">Clear</button>
          </div>

/* ══ SCHEDULE TABLE ══ */
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_KEYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

function renderScheduleTable(emp) {
  const el = document.getElementById('scheduleTbody');
  if (!el) return;
  let schedule = {};
  try {
    const raw = emp.preferred_hours || emp.default_availability || emp.availability || '{}';
    schedule = typeof raw === 'string' ? JSON.parse(raw) : raw;
  } catch(_) {}

  el.innerHTML = DAYS.map((day, i) => {
    const key = DAY_KEYS[i];
    const slot = schedule[day] || schedule[key] || {};
    const enabled = slot.enabled !== false && (slot.start || slot.enabled);
    return `<tr>
      <td style="font-size:12px;font-weight:600;color:var(--ink)">${day}</td>
      <td><input type="checkbox" id="sched_on_${i}" ${enabled?'checked':''} onchange="onSchedToggle(${i})"/></td>
      <td><input type="time" id="sched_start_${i}" value="${slot.start||'09:00'}" class="ep-field"/></td>
      <td><input type="time" id="sched_end_${i}"   value="${slot.end||'17:00'}"   class="ep-field"/></td>
    </tr>`;
  }).join('');
}

function onSchedToggle(i) {
  const on = document.getElementById(`sched_on_${i}`)?.checked;
  ['start','end'].forEach(t => {
    const el = document.getElementById(`sched_${t}_${i}`);
    if (el) el.disabled = !on;
  });
}

function readScheduleFromForm() {
  const s = {};
  DAYS.forEach((day, i) => {
    const on    = document.getElementById(`sched_on_${i}`)?.checked || false;
    const start = document.getElementById(`sched_start_${i}`)?.value || '';
    const end   = document.getElementById(`sched_end_${i}`)?.value || '';
    s[day] = { enabled: on, start: on ? start : '', end: on ? end : '' };
  });
  return s;
}

function fillSchedule(preset, start, end) {
  const weekdays = [0,1,2,3,4]; const weekend = [5,6];
  DAYS.forEach((_, i) => {
    let enable = false;
    if (preset === 'clear') { enable = false; }
    else if (preset === 'all') { enable = true; }
    else if (preset === 'mon-fri') { enable = weekdays.includes(i); }
    const onEl = document.getElementById(`sched_on_${i}`);
    const sEl  = document.getElementById(`sched_start_${i}`);
    const eEl  = document.getElementById(`sched_end_${i}`);
    if (onEl) onEl.checked = enable;
    if (sEl && start && enable) sEl.value = start;
    if (eEl && end   && enable) eEl.value = end;
    onSchedToggle(i);
  });
  markUnsaved();
}
window.fillSchedule = fillSchedule;

/* ══ PAYROLL TYPE ══ */
function numOrNull(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const v = String(el.value ?? '').trim();
  if (v === '') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function normalizeWageType(v) {
  if (!v) return '1099';
  const u = String(v).toLowerCase();
  if (u.includes('hybrid')) return 'Hybrid';
  if (u.includes('w2') || u.includes('commission')) return 'W2';
  if (u.includes('hour') || u.includes('salary')) return 'Hourly';
  return '1099';
}

function selectPayrollType(type, silent) {
  const norm = normalizeWageType(type);
  document.querySelectorAll('.payroll-type-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === norm);
  });
  ['1099','w2','hybrid','hourly'].forEach(k => {
    const el = document.getElementById(`payroll-block-${k}`);
    if (el) el.style.display = (k === norm.toLowerCase()) ? 'block' : 'none';
  });
  const wtEl = document.getElementById('ep_wage_type');
  const etEl = document.getElementById('ep_employment_type');
  if (wtEl) wtEl.value = norm;
  if (etEl) etEl.value = norm;
  if (!silent) markUnsaved();
}
window.selectPayrollType = selectPayrollType;

function renderServicesList() {
  const listEl = document.getElementById('servicesList');
  if (!listEl) return;
  const q = (document.getElementById('servicesSearch')?.value || '').toLowerCase();
  const filtered = _allServices.filter(s => !q || s.name.toLowerCase().includes(q) || (s.category||'').toLowerCase().includes(q));

  if (!filtered.length) {
    listEl.innerHTML = '<p style="color:var(--muted);font-size:12px;padding:10px">No services found.</p>';
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(s => {
    const cat = s.category || 'General';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  // Category order matching book.html
  const CAT_ORDER = ['Nail Enhancement','Manicure','Pedicure','Waxing','Others','General'];
  const sortedCats = [
    ...CAT_ORDER.filter(c => groups[c]),
    ...Object.keys(groups).filter(c => !CAT_ORDER.includes(c)).sort(),
  ];

  let html = '';
  sortedCats.forEach(cat => {
    html += `<div class="svc-cat-header">${esc(cat)}</div>`;
    groups[cat].forEach(svc => {
      const key = svc.name.toLowerCase();
      const on  = _selectedServices.has(key);
      const uid = 'svc-' + key.replace(/[^a-z0-9]/g, '-');
      const safeName = svc.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += `
        <div class="svc-row">
          <div class="svc-row-left">
            <span class="svc-row-name">${esc(svc.name)}</span>
            <span class="svc-row-cat">${esc(svc.category)}</span>
          </div>
          <label class="svc-toggle">
            <input type="checkbox" id="${uid}" ${on ? 'checked' : ''} onchange="onServiceToggle(this,'${safeName}')"/>
            <div class="svc-toggle-track"></div>
            <div class="svc-toggle-thumb"></div>
          </label>
        </div>`;
    });
  });

  listEl.innerHTML = html;
  updateServicesCount();
  updateMasterToggle();
}

function onServiceToggle(el, svc) {
  const key = svc.toLowerCase();
  if (el.checked) _selectedServices.add(key);
  else _selectedServices.delete(key);
  syncServicesTextarea();
  updateServicesCount();
  updateMasterToggle();
  markUnsaved();
}

function updateMasterToggle() {
  const mt = document.getElementById('svcMasterToggle');
  if (!mt) return;
  const total = _allServices.length;
  const selected = _selectedServices.size;
  mt.checked = total > 0 && selected === total;
  mt.indeterminate = selected > 0 && selected < total;
}

function onMasterToggle(el) {
  toggleAllServices(el.checked);
}
window.onMasterToggle = onMasterToggle;
window.onServiceToggle = onServiceToggle;

function syncServicesTextarea() {
  const ta = document.getElementById('ep_allowed_services');
  if (ta) ta.value = [..._selectedServices].join(', ');
}

function updateServicesCount() {
  const el = document.getElementById('servicesSelectedCount');
  if (el) el.textContent = _selectedServices.size;
}

function filterServicesList() { renderServicesList(); }
window.filterServicesList = filterServicesList;

function toggleAllServices(on) {
  if (on) _allServices.forEach(s => _selectedServices.add((s.name||s).toLowerCase()));
  else _selectedServices.clear();
  renderServicesList();
  syncServicesTextarea();
  updateMasterToggle();
  markUnsaved();
}
window.toggleAllServices = toggleAllServices;

/* ══ PORTAL TAB HELPERS ══ */
function syncPortalEmail() {
  const src = document.getElementById('ep_email')?.value || '';
  const dst = document.getElementById('ep_portal_email_display');
  if (dst) dst.value = src;
}
window.syncPortalEmail = syncPortalEmail;

function togglePwdVis() {
  const f = document.getElementById('ep_login_temp_password');

}

function generateTempPassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#$';
  let pwd = '';
  for (let i = 0; i < 12; i++) pwd += chars[Math.floor(Math.random()*chars.length)];
  const f = document.getElementById('ep_login_temp_password');
  const d = document.getElementById('generatedPwdDisplay');
  if (f) { f.value = pwd; f.type = 'text'; }
  if (d) { d.textContent = pwd; d.style.display = 'inline'; }
}

/* ══ UNSAVED TRACKING ══ */
function markUnsaved() { _hasUnsaved = true; }
function clearUnsaved() { _hasUnsaved = false; }

function wireUnsavedTracking() {
  document.querySelectorAll('.ep-field').forEach(el => {
    el.addEventListener('change', markUnsaved);

/* ══ TABS ══ */
function switchTab(btn, id) {
  btn.closest('.tabs-bar').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.closest('.tabs-shell').querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

/* ══ NOTES ══ */
async function addNote(empId) {
  const text = prompt('Add a note for this employee:');
  if (!text?.trim()) return;
  showToast('Note saved!');
  const emp = employees.find(e => e.id == empId);
  if (emp) { emp.notes = (emp.notes ? emp.notes + '\n' : '') + text.trim(); }
  markUnsaved();
}
window.addNote = addNote;

/* ══ SAVE ══ */
async function saveEmployee(id) {
  const emp = employees.find(e => e.id == id);
  if (!emp) return;

  const btn = document.getElementById('saveBarBtn');
  if (btn) { btn.textContent = '⟳ Saving…'; btn.disabled = true; }

  const g = i => document.getElementById(i)?.value ?? null;
  const schedule = readScheduleFromForm();
  const wt = normalizeWageType(g('ep_wage_type'));

  const payrollFields = (() => {
    if (wt === 'Hybrid') return {
      rate_1099: numOrNull('ep_hybrid_rate_1099'), commission_split_check_pct: numOrNull('ep_hybrid_commission_split_check_pct'),
      w2_check_pct: numOrNull('ep_hybrid_w2_check_pct'), w2_percent: numOrNull('ep_hybrid_w2_rate_pct'),
      w2_hourly_rate: numOrNull('ep_hybrid_w2_default_services'), hybrid_w2_rate: numOrNull('ep_hybrid_w2_rate_pct'),
      hybrid_w2_portion: numOrNull('ep_hybrid_w2_default_services'),
    };
    if (wt === 'W2') return {
      rate_1099: null, commission_split_check_pct: null,
      w2_check_pct: numOrNull('ep_w2_check_pct'), w2_percent: numOrNull('ep_w2_percent'),
      w2_hourly_rate: null, hybrid_w2_rate: null, hybrid_w2_portion: null,
    };
    if (wt === 'Hourly') return {
      rate_1099: null, commission_split_check_pct: null, w2_check_pct: null,
      w2_percent: null, w2_hourly_rate: null, hybrid_w2_rate: null, hybrid_w2_portion: null,
      hourly_rate: numOrNull('ep_hourly_rate'), weekly_salary: numOrNull('ep_weekly_salary'),
      pay_frequency: g('ep_pay_frequency'), default_weekly_hours: numOrNull('ep_default_weekly_hours'),
    };
    // 1099
    return {
      rate_1099: numOrNull('ep_rate_1099'), commission_split_check_pct: numOrNull('ep_commission_split_check_pct'),
      w2_check_pct: null, w2_percent: null, w2_hourly_rate: null,
      hybrid_w2_rate: null, hybrid_w2_portion: null,
    };
  })();

  const payload = {
    business_id: emp.business_id || businessId,
    full_name:   g('ep_full_name')   || emp.full_name,
    display_name:g('ep_display_name')|| null,
    role:        g('ep_role')        || emp.role,
    job_title:   g('ep_job_title')   || null,
    employee_id: g('ep_employee_id') || null,
    status:      g('ep_status')      || 'active',
    email:       g('ep_email')       || null,
    phone:       g('ep_phone')       || null,
    photo_url:   g('ep_photo_url')   || null,
    birthday:    g('ep_birthday')    || null,
    address:     g('ep_address')     || null,
    emergency_contact: g('ep_emergency_contact') || null,
    start_date:  g('ep_start_date')  || null,
    notes:       g('ep_notes')       || null,
    primary_role:g('ep_primary_role')|| null,
    skill_notes: g('ep_skill_notes') || null,
    allowed_services: [..._selectedServices].join(', ') || g('ep_allowed_services') || null,
    wage_type:   wt === 'Hourly' ? 'hourly' : wt,
    employment_type: wt === 'Hourly' ? 'hourly' : wt,
    preferred_hours: JSON.stringify(schedule),
    bonus_threshold:     numOrNull('ep_bonus_threshold')      || null,
    bonus_amount:        numOrNull('ep_bonus_amount')          || null,
    min_1099_cover:      numOrNull('ep_min_1099_cover')        || null,
    min_1099_cover_rate: numOrNull('ep_min_1099_cover_rate')   || null,
    cleaning_default:    numOrNull('ep_cleaning_default')      || null,
    login_username:      g('ep_login_username')        || null,
    login_pin:           numOrNull('ep_login_pin')             || null,
    ...payrollFields,
  };

  // Update local state
  Object.assign(emp, payload);

  if (sbClient && businessId) {
    try {
      const isDemo = String(id).startsWith('demo-');
      let error;
      if (isDemo) {
        ({ error } = await sbClient.schema('salon').from('employees').insert(payload));
      } else {
        ({ error } = await sbClient.schema('salon').from('employees').update(payload).eq('id', id));
      }
      if (error) throw error;

      // Create login if requested
      const createLogin = document.getElementById('ep_create_login')?.checked;
      const email = payload.email;
      if (createLogin && email) {
        const tempPwd = document.getElementById('ep_login_temp_password')?.value?.trim();
        if (!tempPwd || tempPwd.length < 8) {
          showToast('⚠️ Enter a temp password (min 8 chars) on the Portal tab', 'error');
        } else {
          try {
            const { data: { session } } = await sbClient.auth.getSession();
            const res = await fetch('https://pbojacnagutipfhcxltj.supabase.co/functions/v1/create-auth-user', {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token||''}` },
              body: JSON.stringify({ email, role: payload.role, full_name: payload.full_name, password: tempPwd, business_id: businessId })
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Edge Function error');
            showToast('Login account created for ' + email, 'success');
            document.getElementById('ep_login_temp_password').value = '';
            document.getElementById('ep_create_login').checked = false;
          } catch(e) {
            showToast('Profile saved but login creation failed: ' + e.message, 'error');
          }
        }
      }
    } catch(err) {
      showToast('Save failed: ' + (err.message || err), 'error');
      if (btn) { btn.textContent = '💾 Save Profile'; btn.disabled = false; }
      return;
    }
  }

  clearUnsaved();
  showToast('Profile saved ✓', 'success');
  if (btn) { btn.textContent = '✅ Saved!'; btn.disabled = false; setTimeout(() => { if(btn) btn.textContent='💾 Save Profile'; }, 2000); }
  renderList();
}
window.saveEmployee = saveEmployee;

/* ══ DELETE ══ */
async function deleteEmployee(id) {
  if (!confirm('Delete this employee? This cannot be undone.')) return;
  if (sbClient && businessId && !String(id).startsWith('demo-')) {
    const { error } = await sbClient.schema('salon').from('employees').delete().eq('id', id);
    if (error) { showToast('Delete failed: ' + error.message, 'error'); return; }
  }
  employees = employees.filter(e => e.id !== id);
  clearUnsaved();
  showToast('Employee deleted', 'success');
  renderList();
  updateKPIs();
  document.getElementById('emptyState').style.display = '';
  document.getElementById('profileArea').style.display = 'none';
  activeId = null;
  if (employees.length) showEmployee(employees[0].id);
}
window.deleteEmployee = deleteEmployee;

/* ══ ADD EMPLOYEE MODAL ══ */
function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }
window.openAddModal  = openAddModal;

async function saveNewEmployee() {
  const name = document.getElementById('nFullName').value.trim();
  if (!name) { showToast('Please enter a full name', 'error'); return; }
  const role = document.getElementById('nRole').value;
  if (!role) { showToast('Please select an access role', 'error'); return; }

  const payload = {
    business_id:  businessId,
    full_name:    name,
    display_name: document.getElementById('nDisplayName').value.trim() || null,
    job_title:    document.getElementById('nJobTitle').value || null,
    role,
    email:        document.getElementById('nEmail').value.trim() || null,
    phone:        document.getElementById('nPhone').value.trim() || null,
    start_date:   document.getElementById('nStartDate').value || null,
    status:       document.getElementById('nStatus').value || 'active',
    wage_type:    '1099',
    created_at:   new Date().toISOString(),
  };

  if (sbClient && businessId) {
    try {
      const { data, error } = await sbClient.schema('salon').from('employees')
        .insert(payload).select().single();
      if (error) throw error;
      employees.unshift(data);
      showToast('Employee created ✓', 'success');
      closeAddModal();
      renderList();
      updateKPIs();
      showEmployee(data.id);
    } catch(err) {
      showToast('Create failed: ' + (err.message||err), 'error');
      return;
    }
  } else {
    const emp = { ...payload, id: 'demo-' + Date.now() };
    employees.unshift(emp);
    showToast('Created (demo mode)', 'success');
    closeAddModal();
    renderList();
    updateKPIs();
    showEmployee(emp.id);
  }
  ['nFullName','nDisplayName','nEmail','nPhone','nStartDate'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('nJobTitle').value = '';
  document.getElementById('nRole').value = '';
  document.getElementById('nStatus').value = 'active';
}
window.saveNewEmployee = saveNewEmployee;

/* ══ USER MENU ══ */
function toggleUserMenu(e) {
  e.stopPropagation();
  document.getElementById('userDropdown')?.classList.toggle('open');
}
window.toggleUserMenu = toggleUserMenu;

async function handleSignOut() {
  if (sbClient) await sbClient.auth.signOut();
  localStorage.clear();
  window.location.href = '/index.html';
}
window.handleSignOut = handleSignOut;

/* ══ INIT ══ */
(async function init() {
  // Wait for requireAuth bridge
  let waited = 0;
  while (!window.__requireAuth && waited < 4000) {
    await new Promise(r => setTimeout(r, 100));
    waited += 100;
  }

  if (window.__requireAuth) {
    try {
      const { client, user } = await window.__requireAuth({ agent: 'salon' });
      sbClient = client;

      const meta = user.user_metadata || {};
      const fullName = meta.full_name || meta.name || user.email?.split('@')[0] || 'Owner';
      const initials = fullName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) || '?';

      const wrap = document.getElementById('userBtnWrap');
      if (wrap) {
        wrap.className = 'user-menu-wrap';
        wrap.innerHTML = `
          <button class="ap-user-btn" id="userMenuBtn" onclick="toggleUserMenu(event)">
            <div class="ap-user-avatar">${initials}</div>
            <span>${fullName.split(' ')[0]}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="ap-dropdown" id="userDropdown">
            <div class="ap-dropdown-header">
              <div class="ap-dropdown-name">${fullName}</div>
              <div class="ap-dropdown-email">${user.email || ''}</div>
            </div>
            <a class="ap-dropdown-item" href="salon-dashboard.html">🏠 Dashboard</a>
            <a class="ap-dropdown-item" href="manage-employees.html">👥 Employees</a>
            <a class="ap-dropdown-item" href="role-permissions.html">🔐 Role Permissions</a>
            <a class="ap-dropdown-item" href="settings.html">⚙️ Settings</a>
            <div class="ap-dropdown-divider"></div>
            <button class="ap-dropdown-item danger" onclick="handleSignOut()">🚪 Sign Out</button>
          </div>`;

        document.addEventListener('click', e => {
          if (!wrap.contains(e.target)) document.getElementById('userDropdown')?.classList.remove('open');
        });
      }

      // Resolve businessId + role gate (owner/manager only)
      try {
        const { data: pref } = await sbClient.from('user_preferences')
          .select('selected_business_id,active_business_id,role')
          .eq('user_id', user.id).maybeSingle();
        businessId = pref?.selected_business_id || pref?.active_business_id || null;

        const role = String(pref?.role || '').toLowerCase().trim();
        if (role && !['owner','manager','admin'].includes(role)) {
          document.getElementById('emptyState').innerHTML =
            '<p style="color:var(--rose);font-size:14px;font-weight:600">\u26d4 Access denied.</p>' +
            '<p style="color:var(--muted);font-size:12px;margin-top:6px">This page is for owners and managers only.</p>';
          setTimeout(() => location.replace('staff-dashboard.html'), 2500);
          return;
        }
      } catch(_) {}
      if (!businessId) {
        try { businessId = localStorage.getItem('gs.active_business_id') || localStorage.getItem('sg.active_business_id'); } catch(_) {}
      }
    } catch(e) {
      console.warn('Auth failed:', e);
    }
  }

  await loadEmployees();
})();
</script>
