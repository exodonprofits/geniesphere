<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Savings Checker – GenieSphere</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5fdf9;
      color: #003b2b;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      text-align: center;
    }
    .header img {
      width: 120px;
    }
    form {
      margin-top: 2rem;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #2a836e;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background-color: #206956;
    }
    .policy-block {
      border-top: 1px dashed #ccc;
      margin-top: 2rem;
      padding-top: 1rem;
      position: relative;
    }
    .remove-button {
      position: absolute;
      top: 0;
      right: 0;
      background: #e74c3c;
      color: white;
      border: none;
      padding: 0.25rem 0.75rem;
      border-radius: 0 0 0 5px;
      cursor: pointer;
    }
    .remove-button:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="geniesphere.png" alt="GenieSphere Logo" />
      <h1>Insurance Savings Checker</h1>
      <p>Submit your policy to find out if you're overpaying 🚀</p>
    </div>
    <form id="insuranceForm" action="https://exodonprofits.app.n8n.cloud/webhook/insurance-policy-submit" method="POST">
      <div id="policyContainer">
        <!-- Policy fields will be inserted here -->
      </div>
      <button type="button" onclick="addPolicy()">➕ Add Another Policy</button>
      <button type="submit">✅ Submit All Policies</button>
    </form>
  </div>

  <template id="policyTemplate">
    <div class="policy-block">
      <button type="button" class="remove-button" onclick="removePolicy(this)">Remove</button>

      <label>Your Name (optional)</label>
      <input type="text" name="name[]" />

      <label>Email (optional)</label>
      <input type="email" name="email[]" />

      <label>Policy Type</label>
      <select name="policy_type[]">
        <option value="Auto">Auto</option>
        <option value="Home">Home</option>
        <option value="Business Liability">Business Liability</option>
        <option value="Workers Comp">Workers Comp</option>
        <option value="Umbrella">Umbrella</option>
        <option value="Other">Other</option>
      </select>

      <label>Ownership</label>
      <select name="ownership[]">
        <option value="Personal">Personal</option>
        <option value="Business">Business</option>
      </select>

      <label>Business Name (if any)</label>
      <input type="text" name="business_name[]" />

      <label>Insurance Provider</label>
      <input type="text" name="provider[]" />

      <label>Monthly Premium</label>
      <input type="number" step="0.01" name="monthly_premium[]" />

      <label>Yearly Premium</label>
      <input type="number" step="0.01" name="yearly_premium[]" />

      <label>Coverage Amount</label>
      <input type="number" step="0.01" name="coverage_amount[]" />

      <label>Deductible</label>
      <input type="number" step="0.01" name="deductible[]" />

      <label>Effective Date</label>
      <input type="date" name="effective_date[]" />

      <label>Expiration Date</label>
      <input type="date" name="expiration_date[]" />

      <label>Bundled?</label>
      <select name="bundled[]">
        <option value="Y">Yes</option>
        <option value="N">No</option>
      </select>

      <label>Any Notes</label>
      <textarea name="notes[]" rows="4"></textarea>
    </div>
  </template>

  <script>
    function addPolicy() {
      const template = document.getElementById('policyTemplate').content.cloneNode(true);
      document.getElementById('policyContainer').appendChild(template);
    }

    function removePolicy(button) {
      button.closest('.policy-block').remove();
    }

    window.onload = addPolicy;
  </script>
</body>
</html>
