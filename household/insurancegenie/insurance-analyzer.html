
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Car Insurance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0F172A; color: #F8FAFC; font-family: 'Inter', sans-serif; padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    .form-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border-radius: 1.5rem; padding: 2rem; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 2rem; }
    h2 { background: linear-gradient(45deg,#2BFFD9,#7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; margin-top: 0.25rem; background: rgba(255,255,255,0.05); color: #F8FAFC; }
    .nav-bar { display: flex; justify-content: space-between; margin-top: 2rem; }
    .nav-button { background: linear-gradient(45deg,#2BFFD9,#7C3AED); border: none; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: 600; color: #0F172A; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
  <div id="carWrapper"></div>
    
<h1 style='margin-bottom: 2rem;'>🚗 Car Insurance</h1>
<div id="carWrapper"></div>
<div class="nav-bar" style="margin-top: 2rem;">
  <button type="button" class="nav-button" onclick="addCarBlock()"><i class="fas fa-plus-circle"></i> Add Car</button>
  <a href="insurance_step_home.html" class="nav-button">Next ➡</a>
</div>


<template id="carTemplate">
  <div class='form-card'>
    <button type='button' class='remove-button'><i class='fas fa-trash'></i></button>
    <label>Year, Make, and Model</label><input type='text' name='car_make_model[]'/>
    <label>VIN (optional)</label><input type='text' name='car_vin[]'/>
    <label>Ownership Type</label>
    <select name='car_ownership[]'>
      <option value='Own'>Own</option>
      <option value='Finance'>Finance</option>
      <option value='Lease'>Lease</option>
    </select>
    <label>Use Type</label>
    <label><input type='checkbox' name='car_use[]' value='Personal'/> Personal</label>
    <label><input type='checkbox' name='car_use[]' value='Business'/> Business</label>
    <label><input type='checkbox' name='car_use[]' value='Commute'/> Commute</label>
    <label><input type='checkbox' name='car_use[]' value='Rideshare'/> Rideshare</label>
    <label>Estimated Annual Mileage</label><input type='number' name='car_mileage[]'/>
    <label>Parking Location</label><input type='text' name='car_parking[]'/>
    <label>Zip Code Where Car Is Kept</label><input type='text' name='car_zip[]'/>
    <label>Liability Limits</label>
    <select name='car_liability[]'>
      <option value='25/50/25'>25/50/25</option>
      <option value='50/100/50'>50/100/50</option>
      <option value='100/300/100'>100/300/100</option>
      <option value='250/500/250'>250/500/250</option>
    </select>
    <label>Comprehensive Deductible</label>
    <select name='car_comp[]'>
      <option value='0'>0</option>
      <option value='250'>250</option>
      <option value='500'>500</option>
      <option value='1000'>1000</option>
    </select>
    <label>Collision Deductible</label>
    <select name='car_collision[]'>
      <option value='0'>0</option>
      <option value='250'>250</option>
      <option value='500'>500</option>
      <option value='1000'>1000</option>
    </select>
    <label>Driver Name</label><input type='text' name='driver_name[]'/>
    <label>Date of Birth</label><input type='date' name='driver_dob[]'/>
    <label>License Number</label><input type='text' name='driver_license[]'/>
    <label>Driving History</label><textarea name='driver_history[]' rows='3'></textarea>
  </div>
</template>


<script>
  function addCarBlock() {
    const card = document.createElement('div');
    card.className = 'form-card';
    card.innerHTML = document.getElementById('carTemplate').innerHTML;
    const btn = card.querySelector('.remove-button');
    
    document.getElementById('carWrapper').appendChild(card);
    enableRemoveButtons();
  }
  window.onload = () => addCarBlock();
  function enableRemoveButtons() {
    document.querySelectorAll('.remove-button').forEach(btn => {
      btn.onclick = () => btn.closest('.form-card').remove();
    });
  }
</script>
</body>

</html>
