<html>
 <head>
  <title>
   Insurance Genie &ndash; Dashboard

  <meta charset="utf-8"/>
  <style>
   body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
  background-color: #f4f4f4;
  padding: 2rem;
}
.icon-card {
  background: white;
  border-radius: 24px;
  padding: 16px;
  width: 100px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.icon-card:hover {
  transform: translateY(-5px);
}
.icon-card img {
  width: 60px;
  height: 60px;
  margin-bottom: 10px;
}
.icon-card p {
  font-size: 13px;
  margin: 0;
}
.dashboard-section {
  margin-top: 2rem;
}
.dashboard {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
  </style>
 </head>
 <body>
  <h1 style="text-align: center; font-size: 2rem; margin-bottom: 2rem;">

    </div>
