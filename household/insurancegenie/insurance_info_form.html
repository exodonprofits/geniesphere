<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Savings Checker – GenieSphere</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5fdf9;
      color: #003b2b;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      text-align: center;
    }
    .header img {
      width: 120px;
    }
    form {
      margin-top: 2rem;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #2a836e;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #206956;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/images/geniesphere.png" alt="GenieSphere Logo" />
      <h1>Insurance Savings Checker</h1>
      <p>Submit your policy to find out if you're overpaying 🚀</p>
    </div>
    <form action="https://your-n8n-webhook-url" method="POST">
      <label for="name">Your Name (optional)</label>
      <input type="text" id="name" name="name" />

      <label for="email">Email (optional)</label>
      <input type="email" id="email" name="email" />

      <label for="type">Policy Type</label>
      <select id="type" name="policy_type">
        <option value="Auto">Auto</option>
        <option value="Home">Home</option>
        <option value="Business Liability">Business Liability</option>
        <option value="Workers Comp">Workers Comp</option>
        <option value="Umbrella">Umbrella</option>
        <option value="Other">Other</option>
      </select>

      <label for="ownership">Ownership</label>
      <select id="ownership" name="ownership">
        <option value="Personal">Personal</option>
        <option value="Business">Business</option>
      </select>

      <label for="business">Business Name (if any)</label>
      <input type="text" id="business" name="business_name" />

      <label for="provider">Insurance Provider</label>
      <input type="text" id="provider" name="provider" />

      <label for="monthly">Monthly Premium</label>
      <input type="number" id="monthly" name="monthly_premium" step="0.01" />

      <label for="yearly">Yearly Premium</label>
      <input type="number" id="yearly" name="yearly_premium" step="0.01" />

      <label for="coverage">Coverage Amount</label>
      <input type="number" id="coverage" name="coverage_amount" step="0.01" />

      <label for="deductible">Deductible</label>
      <input type="number" id="deductible" name="deductible" step="0.01" />

      <label for="effective">Effective Date</label>
      <input type="date" id="effective" name="effective_date" />

      <label for="expiration">Expiration Date</label>
      <input type="date" id="expiration" name="expiration_date" />

      <label for="bundled">Bundled?</label>
      <select id="bundled" name="bundled">
        <option value="Y">Yes</option>
        <option value="N">No</option>
      </select>

      <label for="notes">Any Notes</label>
      <textarea id="notes" name="notes" rows="4"></textarea>

      <button type="submit">Check My Savings</button>
    </form>
  </div>
</body>
</html>
