
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wellness Scheduler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: left;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
    }
    h2 {
      font-size: 20px;
      margin: 40px 0 10px;
      border-bottom: 2px solid #ccc;
      padding-bottom: 6px;
      width: 100%;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-start;
    }
    .icon-card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      width: 100px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .icon-card:hover {
      transform: translateY(-5px);
    }
    .icon-card img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }
    .icon-card p {
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>🧘‍♀️ Wellness Scheduler</h1>
  <div class="dashboard-section">
    <h2>🗓️ Self-Care & Wellness</h2>
    <div class="dashboard">
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/yoga.png" alt="Morning Routine"/>
          <p>Morning Routine</p>
        </a>
      </div>
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/workout.png" alt="Workout"/>
          <p>Workout</p>
        </a>
      </div>
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/spa-flower.png" alt="Mindfulness"/>
          <p>Mindfulness</p>
        </a>
      </div>
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/sleeping.png" alt="Sleep Tracker"/>
          <p>Sleep Tracker</p>
        </a>
      </div>
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/meal.png" alt="Healthy Meals"/>
          <p>Healthy Meals</p>
        </a>
      </div>
      <div class="icon-card">
        <a href="#">
          <img src="https://img.icons8.com/color/96/note.png" alt="Journaling"/>
          <p>Journaling</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
