<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>GenieSphere – Personal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --page:#f3f4f6; --card:#ffffff; --text:#0f172a; --muted:#475569; --line:#e5e7eb;
      --blue:#1d4ed8; --green:#16a34a; --amber:#f59e0b; --shadow:0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--page); color:var(--text); font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Oxygen, Ubuntu}

    /* Header */
    .gs-header{position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line)}
    .nav{max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px}
    .brand{display:flex; align-items:center; gap:10px; font-weight:700}
    .logo{width:36px; height:36px; display:grid; place-items:center; border-radius:999px; background:var(--blue); color:#fff; box-shadow:var(--shadow)}
    .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border:none; border-radius:999px; font-weight:600; cursor:pointer; text-decoration:none; transition:.15s transform, .15s box-shadow, .15s background}
    .btn:hover{transform:translateY(-1px)}
    .btn.blue{background:var(--blue); color:#fff; box-shadow:var(--shadow)}
    .btn.ghost{background:#fff; color:var(--muted); border:1px solid var(--line)}

    /* Shell */
    .wrap{max-width:1100px; margin:24px auto 40px; padding:0 16px}
    h1{margin:0 0 10px; font-size:1.6rem}
    p.lead{margin:0 0 18px; color:var(--muted)}
    .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px}

    /* Search / Filter */
    .searchbar{display:flex; gap:10px; align-items:center; margin:14px 0}
    .searchbar input{flex:1 1 280px; padding:12px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text); outline:none}
    .sub{color:var(--muted); font-size:.92rem}

    /* Grid */
    .grid{display:grid; gap:14px; grid-template-columns: repeat( auto-fill, minmax(160px, 1fr) )}
    .icon-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center; box-shadow:var(--shadow); transition:.15s transform}
    .icon-card:hover{transform:translateY(-2px)}
    .icon-card img{width:56px; height:56px; margin:6px auto 10px; display:block}
    .icon-card p{margin:0; font-weight:600}
    .icon-card small{display:block; margin-top:6px; color:var(--muted); font-size:.82rem}
    .hidden{display:none!important}

    /* Quick capture blocks */
    .qc{display:grid; gap:12px}
    @media (min-width:720px){ .qc{grid-template-columns:1fr 1fr} }
    .qc .panel{padding:12px}
    .row{display:grid; gap:10px}
    @media (min-width:720px){ .row.cols-2{grid-template-columns:1fr auto} .row.cols-3{grid-template-columns:1.1fr 1fr auto} }
    input[type="text"], input[type="date"], input[type="number"]{padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); outline:none}
    .btn.green{background:var(--green); color:#fff; box-shadow:var(--shadow)}
    .hint{font-size:.9rem; color:var(--muted)}
    footer{margin:28px 0 10px; text-align:center; color:var(--muted); font-size:.9rem}
  </style>
</head>

    // Set header + hero
    document.getElementById('logo-emoji').textContent = info.emoji || '🧰';
    document.getElementById('brand-name').textContent = info.name || 'Genie';
    document.title = `${info.emoji||''} ${info.name} – GenieSphere`;
    document.getElementById('page-title').textContent = `${info.emoji||''} ${info.name}`;
    document.getElementById('page-desc').textContent = info.desc || '';

    // Tools
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = (info.tools||[]).map(t=>`
      <a class="icon-card" data-tags="${(t.title+' '+(t.sub||'')).toLowerCase()}" href="${t.href||'#'}">
        <img src="${t.icon}" alt="${t.title}"/>
        <p>${t.title}</p><small>${t.sub||''}</small>
      </a>
    `).join('');

    // Filter
    (function(){
      const input = document.getElementById('filterInput');
      const cards = Array.from(document.querySelectorAll('.icon-card'));
      input.addEventListener('input', ()=>{
        const q = input.value.trim().toLowerCase();
        cards.forEach(c=>{
          const text = (c.innerText + " " + (c.dataset.tags||"")).toLowerCase();
          c.classList.toggle('hidden', q && !text.includes(q));
        });
      });
    })();

    // Quick capture (simple localStorage)
    const qcWrap = document.getElementById('quickCapture');
    if(info.quick && info.quick.length){
      qcWrap.style.display='grid';
      qcWrap.innerHTML = info.quick.map((q,idx)=>`
        <div class="panel">
          <h3 style="margin:0 0 6px; font-size:1rem;">${q.title}</h3>
          <div class="row ${q.inputs.length===2?'cols-2':'cols-3'}">
            ${q.inputs.map(i=>`<input id="qc-${idx}-${i.id}" type="${i.type||'text'}" placeholder="${i.ph||''}"/>`).join('')}
            <button class="btn green" id="qc-btn-${idx}">${q.btn}</button>
          </div>
          <div class="hint" id="qc-msg-${idx}"></div>
        </div>
      `).join('');

      info.quick.forEach((q,idx)=>{
        document.getElementById(`qc-btn-${idx}`).addEventListener('click', ()=>{
          const vals = q.inputs.map(i=> document.getElementById(`qc-${idx}-${i.id}`).value.trim());
          if(vals.some(v=>!v)){ document.getElementById(`qc-msg-${idx}`).textContent = 'Please complete the fields.'; return; }
          try{
            const cur = JSON.parse(localStorage.getItem(q.store)||'[]');
            cur.push({at: Date.now(), fields: vals});
            localStorage.setItem(q.store, JSON.stringify(cur));
            q.inputs.forEach(i=>{ document.getElementById(`qc-${idx}-${i.id}`).value=''; });
            document.getElementById(`qc-msg-${idx}`).textContent = 'Saved!';
          }catch{ document.getElementById(`qc-msg-${idx}`).textContent = 'Saved locally.'; }
        });
      });
    }
