name: Bluehost upload
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Prepare downloadable files only (no upload)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: bluehost-upload
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluehost-website
          path: dist/
          retention-days: 7
  upload:
    if: ${{ !inputs.preview_only && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-latest
    environment: bluehost
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluehost-website
          path: dist/
      - name: Upload website over SSH
        env:
          BH_HOST: ${{ secrets.BLUEHOST_HOST }}
          BH_USER: ${{ secrets.BLUEHOST_USER }}
          BH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          BH_KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
          BH_PATH: ${{ vars.BLUEHOST_DOCUMENT_ROOT }}
          BH_PORT: ${{ vars.BLUEHOST_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$BH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$BH_PORT" =~ ^[0-9]+$ ]]
          [[ "$BH_PATH" =~ ^/home/[a-zA-Z0-9_-]+/[a-zA-Z0-9_./-]+$ ]]
          [[ "$BH_PATH" != *".."* ]]
          test -n "$BH_KEY"
          test -n "$BH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BH_KEY" > ~/.ssh/bluehost
          printf '%s\n' "$BH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bluehost ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/bluehost' EXIT
          target="$BH_USER@$BH_HOST"
          options=(-i ~/.ssh/bluehost -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${options[@]}" -p "$BH_PORT" "$target" "test -d '$BH_PATH'"
          remote_archive=$(ssh "${options[@]}" -p "$BH_PORT" "$target" 'mktemp /tmp/geniesphere-upload.XXXXXXXX.tar.gz')
          [[ "$remote_archive" =~ ^/tmp/geniesphere-upload\.[a-zA-Z0-9]+\.tar\.gz$ ]]
          scp "${options[@]}" -P "$BH_PORT" dist/website.tar.gz "$target:$remote_archive"
          ssh "${options[@]}" -p "$BH_PORT" "$target" "tar -xzf '$remote_archive' -C '$BH_PATH' && rm -f '$remote_archive'"
