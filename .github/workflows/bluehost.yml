name: Bluehost FTPS connection test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bluehost.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bluehost-connection-test
  cancel-in-progress: false
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify FTPS login and destination (read only)
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USER: ${{ secrets.BLUEHOST_USER }}
          BLUEHOST_FTP_PASSWORD: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          # Server IP from Bluehost > FTP Client Details. Public, not a secret.
          BLUEHOST_EXPECTED_IP: 50.6.156.176
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import re
          import socket
          import ssl
          import sys
          required = ("BLUEHOST_HOST", "BLUEHOST_USER", "BLUEHOST_FTP_PASSWORD")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              sys.exit("Missing GitHub repository secrets: " + ", ".join(missing))
          # Describe BLUEHOST_HOST without printing it (Actions masks the value anyway).
          host = os.environ["BLUEHOST_HOST"]
          bare = host.strip().lower().rstrip(".")
          labels = bare.split(".")
          print("BLUEHOST_HOST shape check (value not shown):")
          print(f"  length: {len(host)}")
          print(f"  leading/trailing whitespace: {host != host.strip()}")
          print(f"  contains whitespace inside: {any(c.isspace() for c in host.strip())}")
          print(f"  contains '://': {'://' in host}")
          print(f"  contains '/': {'/' in host}")
          print(f"  contains ':': {':' in host}")
          print(f"  dot-separated parts: {len(labels)}")
          print(f"  ends with .bluehost.com: {bare.endswith('.bluehost.com')}")
          print(f"  ends with .mybluehost.me: {bare.endswith('.mybluehost.me')}")
          cert_match = re.fullmatch(r"[a-z0-9-]+\.bluehost\.com", host.lower()) is not None
          print(f"  matches *.bluehost.com certificate: {cert_match}")
          # Any *.bluehost.com name passes the shared certificate, so also confirm
          # the host resolves to this account's server before sending the password.
          expected_ip = os.environ["BLUEHOST_EXPECTED_IP"]
          print("DNS check:")
          try:
              resolved = sorted({info[4][0] for info in socket.getaddrinfo(host, 21, proto=socket.IPPROTO_TCP)})
          except socket.gaierror as exc:
              resolved = []
              print("  BLUEHOST_HOST does not resolve: " + str(exc))
          print("  BLUEHOST_HOST resolves to: " + (", ".join(resolved) or "nothing"))
          print("  expected server IP: " + expected_ip)
          try:
              ptr = socket.gethostbyaddr(expected_ip)[0]
              print("  reverse DNS of expected IP: " + ptr)
              print("  reverse DNS name matches *.bluehost.com certificate: "
                    + str(re.fullmatch(r"[a-z0-9-]+\.bluehost\.com", ptr.lower()) is not None))
          except OSError as exc:
              print("  reverse DNS of expected IP: none (" + type(exc).__name__ + ")")
          if expected_ip not in resolved:
              sys.exit("BLUEHOST_HOST does not point at " + expected_ip
                       + "; stopping before login so the password is not sent to another server.")
          print("PASS: BLUEHOST_HOST resolves to the expected server")
          try:
              with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
                  ftp.connect(os.environ["BLUEHOST_HOST"], 21)
                  ftp.auth()
                  print("PASS: explicit FTPS connection and server certificate verification")
                  ftp.login(os.environ["BLUEHOST_USER"], os.environ["BLUEHOST_FTP_PASSWORD"])
                  print("PASS: account authentication")
                  ftp.prot_p()
                  ftp.cwd("/")
                  names = ftp.nlst()
                  print("PASS: encrypted directory listing at account root")
                  print(f"Directory contains {len(names)} entries.")
                  if "index.html" in names:
                      print("Existing index.html detected.")
                  elif "public_html" in names:
                      sys.exit("Root contains public_html; verify account scope before deployment.")
                  print("Connection test passed. No files were uploaded, created, or deleted.")
          except ssl.SSLCertVerificationError as exc:
              print("FTPS test failed: SSLCertVerificationError")
              print("Reason: " + str(exc.verify_message))
              print("The certificate step below lists the names the server certificate covers.")
              print("Set BLUEHOST_HOST to one of those names; do not disable verification.")
              sys.exit(1)
          except Exception as exc:
              print("FTPS test failed: " + type(exc).__name__)
              print("Detail: " + str(exc))
              print("Check hostname/certificate, account password, and FTP access in Bluehost.")
              sys.exit(1)
          PY
      - name: Show server certificate names (diagnostic, no login)
        if: failure()
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
        shell: bash
        run: |
          if [ -z "$BLUEHOST_HOST" ]; then
            echo "BLUEHOST_HOST is not set; skipping certificate inspection."
            exit 0
          fi
          cert="$(timeout 20 openssl s_client -starttls ftp -connect "$BLUEHOST_HOST:21" -servername "$BLUEHOST_HOST" </dev/null 2>/dev/null)" || true
          if ! printf '%s\n' "$cert" | grep -q 'BEGIN CERTIFICATE'; then
            echo "Could not retrieve the server certificate."
            exit 0
          fi
          printf '%s\n' "$cert" | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName
