
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Agent Builder – GenieSphere</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            color: #2BFFD9;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .builder-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 1rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        textarea {
            resize: vertical;
        }
        button {
            background: linear-gradient(45deg, #2BFFD9, #7C3AED);
            color: #0F172A;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .placeholder {
            text-align: center;
            color: #94A3B8;
            font-style: italic;
            margin-top: 2rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 3rem;
        }
        .back-link a {
            color: #2BFFD9;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Create Your Own AI Agent</h1>
    <div class="builder-container">
        <form>
            <label for="agent-name">Agent Name</label>
            <input type="text" id="agent-name" name="agent-name" placeholder="e.g. Invoice Tracker, Meal Genie">

            <label for="category">Category</label>
            <select id="category" name="category">
                <option>Personal</option>
                <option>Business</option>
                <option>Investment</option>
                <option>Custom</option>
            </select>

            <label for="description">What does your agent do?</label>
            <textarea id="description" name="description" rows="5" placeholder="Describe the AI's task, output, or purpose..."></textarea>

            <label for="input-format">What input does it take?</label>
            <input type="text" id="input-format" name="input-format" placeholder="Text, CSV, Email, Image, URL, etc.">

            <label for="output-format">What output does it produce?</label>
            <input type="text" id="output-format" name="output-format" placeholder="Summary, Table, Chart, API call, etc.">

            <label for="tools-needed">Which tools or APIs are required?</label>
            <input type="text" id="tools-needed" name="tools-needed" placeholder="e.g. Google Sheets, GPT, n8n, Zapier">

            <button type="submit">Generate Blueprint</button>
        </form>
        <div class="placeholder">
            (Workflow builder and visual editor coming soon)
        </div>
    </div>
    <div class="back-link">
        <a href="dashboard.html">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
