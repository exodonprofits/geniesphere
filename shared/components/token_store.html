<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Token Store &ndash; GenieSphere
  </title>
  <style>
   body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            color: #2BFFD9;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .store-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .token-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .token-card:hover {
            transform: translateY(-5px);
        }
        .token-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #2BFFD9;
        }
        .token-price {
            font-size: 1.2rem;
            color: #94A3B8;
            margin: 0.5rem 0 1rem;
        }
        button {
            background: linear-gradient(45deg, #2BFFD9, #7C3AED);
            color: #0F172A;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 3rem;
        }
        .back-link a {
            color: #2BFFD9;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
  </style>
 </head>
 <body>
  <h1>
   Buy Tokens
  </h1>
  <p style="text-align:center;">
   Use tokens to unlock and use AI tools on GenieSphere. Choose a token pack below to get started:
  </p>
  <div class="store-container">
   <div class="token-card">
    <div class="token-amount">
     25 Tokens
    </div>
    <div class="token-price">
     $2.99
    </div>
    <button>
     Buy Now
    </button>
   </div>
   <div class="token-card">
    <div class="token-amount">
     60 Tokens
    </div>
    <div class="token-price">
     $5.99
    </div>
    <button>
     Buy Now
    </button>
   </div>
   <div class="token-card">
    <div class="token-amount">
     150 Tokens
    </div>
    <div class="token-price">
     $12.99
    </div>
    <button>
     Buy Now
    </button>
   </div>
   <div class="token-card">
    <div class="token-amount">
     350 Tokens
    </div>
    <div class="token-price">
     $24.99
    </div>
    <button>
     Buy Now
    </button>
   </div>
  </div>
  <div style="text-align:center; margin-top: 2rem;">
   <a href="geniesphere_usage_analytics.html" style="color:#2BFFD9; font-weight:bold; text-decoration:none;">
    📊 View Your Usage Analytics
   </a>
  </div>
  <div class="back-link">
   <a href="my_account_final_complete.html">
    👤 Back to My Account
   </a>
  </div>
  <div class="back-link">
   <a href="dashboard.html">
    ⬅️ Back to Dashboard
   </a>
  </div>
 </body>
</html>
