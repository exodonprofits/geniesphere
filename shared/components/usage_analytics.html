
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Usage Analytics – GenieSphere</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
        }
        h1 {
            color: #2BFFD9;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto 2rem auto;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
        }
        .card h2 {
            font-size: 1.2rem;
            color: #7C3AED;
            margin-bottom: 0.5rem;
        }
        .card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2BFFD9;
        }
        .placeholder {
            text-align: center;
            color: #94A3B8;
            font-style: italic;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 3rem;
        }
        .back-link a {
            color: #2BFFD9;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Usage Analytics</h1>
    <div class="metrics">
        <div class="card">
            <h2>Total Tokens Used</h2>
            <p>136</p>
        </div>
        <div class="card">
            <h2>Most Used Tool</h2>
            <p>Smart Travel Hub</p>
        </div>
        <div class="card">
            <h2>Avg. Tokens Per Session</h2>
            <p>2.4</p>
        </div>
        <div class="card">
            <h2>Tools Used This Week</h2>
            <p>6</p>
        </div>
    </div>
    <div class="placeholder">(Charts and export options coming soon)</div>
    <div class="back-link">
        <a href="my_account.html">👤 Back to My Account</a>
    </div>
    <div class="back-link">
        <a href="dashboard.html">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
