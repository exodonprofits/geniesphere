<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenieSphere Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2BFFD9;
      --secondary: #7C3AED;
      --background: #0F172A;
      --text: #F8FAFC;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: var(--background);
      color: var(--text);
      padding: 2rem;
    }
    .wallet-container {
      max-width: 700px;
      margin: 0 auto;
      background: rgba(255,255,255,0.03);
      padding: 2rem;
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .balance {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .button-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--background);
      transition: transform 0.2s ease;
    }
    .button:hover {
      transform: scale(1.05);
    }
    .history {
      margin-top: 2rem;
    }
    .history h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }
    .history-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="wallet-container">
    <h1>🎒 Genie Sphere Wallet</h1>
    <div class="balance">Current Balance: <strong>87 Tokens</strong></div>
    <div class="button-group">
      <button class="button">Buy Tokens</button>
      <button class="button">Redeem Code</button>
      <button class="button">Invite Friends</button>
    </div>
    <div class="history">
      <h2>📜 Token Activity</h2>
      <div class="history-item">
        <span>Used 2 Tokens - Smart Travel Hub</span>
        <span>May 8</span>
      </div>
      <div class="history-item">
        <span>Added 50 Tokens - Purchase</span>
        <span>May 6</span>
      </div>
      <div class="history-item">
        <span>Used 1 Token - Nutrition Engine</span>
        <span>May 6</span>
      </div>
    </div>
  </div>
</body>
</html>
