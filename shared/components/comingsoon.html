<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenieSphere – Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2BFFD9;
      --secondary: #7C3AED;
      --background: #0F172A;
      --text: #F8FAFC;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      max-width: 500px;
      margin-bottom: 2rem;
    }

    .logo {
      width: 120px;
      margin-bottom: 1.5rem;
    }

    .notify-btn {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--background);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .notify-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <img src="geniesphere.png" alt="GenieSphere Logo" class="logo" />
  <h1>✨ GenieSphere is Coming Soon ✨</h1>
  <p>
    Unlock the power of AI agents to simplify life, streamline business, and spark creativity. We're working hard to launch something magical for you!
  </p>
  <button class="notify-btn" onclick="alert('We’ll notify you soon!')">🔔 Notify Me</button>
</body>
</html>
