
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback & Feature Requests – GenieSphere</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            color: #2BFFD9;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }
        .section {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 1rem;
        }
        label {
            display: block;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        textarea {
            resize: vertical;
        }
        button {
            background: linear-gradient(45deg, #2BFFD9, #7C3AED);
            color: #0F172A;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 3rem;
        }
        .back-link a {
            color: #2BFFD9;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Feedback & Feature Requests</h1>
    <div class="section">
        <form action="mailto:contact@geniesphere.com" method="post" enctype="text/plain">
            <label for="name">Your Name (optional)</label>
            <input type="text" id="name" name="name">

            <label for="email">Your Email (optional)</label>
            <input type="email" id="email" name="email">

            <label for="type">Feedback Type</label>
            <input type="text" id="type" name="type" placeholder="Bug, Suggestion, Compliment...">

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
    <div class="back-link">
        <a href="dashboard.html">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
