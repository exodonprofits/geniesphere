<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Contact Us &ndash; GenieSphere
  </title>
  <style>
   body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            color: #2BFFD9;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: none;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        button {
            background: linear-gradient(45deg, #2BFFD9, #7C3AED);
            color: #0F172A;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
  </style>
 </head>
 <body>
  <h1 style="text-align: center; color: #2BFFD9; font-size: 2.5rem; margin-bottom: 1rem;">
   Contact Us
  </h1>
  <div class="form-container">
    <p>
        If you have any questions, feedback, or would like to get in touch, feel free to fill out the form below. We&rsquo;d love to hear from you!
       </p>
   <form action="mailto:contact@geniesphere.com" enctype="text/plain" method="post">
    <label for="name">
     Your Name
    </label>
    <input id="name" name="name" required="" type="text"/>
    <label for="email">
     Your Email
    </label>
    <input id="email" name="email" required="" type="email"/>
    <label for="message">
     Message
    </label>
    <textarea id="message" name="message" required="" rows="6"></textarea>
    <button type="submit">
     Send Message
    </button>
   </form>
  </div>
  <div class="back-link" style="text-align: center; margin-top: 3rem;">
   <a href="dashboard.html" style="color: #2BFFD9; text-decoration: none; font-weight: bold;">
    ⬅️ Back to Dashboard
   </a>
  </div>
 </body>
</html>
