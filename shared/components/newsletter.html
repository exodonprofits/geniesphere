
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newsletter Signup – GenieSphere</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 2rem;
        }
        h1 {
            color: #2BFFD9;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        p {
            text-align: center;
            color: #94A3B8;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        button {
            background: linear-gradient(45deg, #2BFFD9, #7C3AED);
            color: #0F172A;
            font-weight: bold;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 3rem;
        }
        .back-link a {
            color: #2BFFD9;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Subscribe to GenieSphere News</h1>
    <p>Be the first to hear about new tools, updates, and exclusive promotions. No spam. Just helpful updates.</p>
    <div class="form-container">
        <form action="mailto:contact@geniesphere.com" method="post" enctype="text/plain">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <button type="submit">Subscribe Now</button>
        </form>
    </div>
    <div class="back-link">
        <a href="dashboard.html">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
