
<!DOCTYPE html>
<html>
<head>
  <title>Insurance Savings Form</title>
</head>
<body>
  <h2>Car Insurance Savings Assistant</h2>
  <form action="https://your-n8n-instance.com/webhook/insurance-agent" method="POST">
    <label>Name: <input type="text" name="name" required></label><br>
    <label>Email: <input type="email" name="email" required></label><br>
    <label>ZIP Code: <input type="text" name="zipCode" required></label><br>
    <label>Cars (JSON format): <textarea name="cars" rows="4" cols="50" required>[{"year":"2022","make":"Toyota","model":"Camry","useType":"Personal"}]</textarea></label><br>
    <label>Drivers (JSON format): <textarea name="drivers" rows="4" cols="50" required>[{"name":"John","age":45,"gender":"Male","relationship":"Owner","drivingHistory":"Clean"}]</textarea></label><br>
    <label>Current Insurance (JSON): <textarea name="currentInsurance" rows="3" cols="50" required>{"company":"GEICO","cost":"150/month","coverage":"Full"}</textarea></label><br>
    <label>Coverage Preferences (JSON): <textarea name="coveragePreferences" rows="3" cols="50" required>{"coverageLevel":"Full","deductible":"500","extras":["roadside","rental"]}</textarea></label><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
