<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insurance Savings Checker – GenieSphere</title>
  
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2BFFD9;
    --secondary: #7C3AED;
    --background: #0F172A;
    --text: #F8FAFC;
  }
  body {
    background-color: var(--background);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 2rem;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 1000px;
    width: 100%;
    padding: 2rem;
  }
  .form-card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(15px);
    border-radius: 1.5rem;
    padding: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 12px 32px rgba(43, 255, 217, 0.1);
  }
  h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  label {
    display: block;
    margin-top: 1rem;
    font-weight: 600;
  }
  input, select, textarea {
    width: 100%;
    padding: 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid #cbd5e1;
    margin-top: 0.25rem;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
  }
  button {
    margin-top: 2rem;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 1rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--background);
    transition: all 0.3s ease;
  }
  button:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }
</style>

</head>
<body>
  <div class="container">
    <div class="form-card">
      <h2>Insurance Savings Checker</h2>
      <p>Enter your insurance policy information – auto, home, rental, business, or more – and find out if you're overpaying.</p>
      <form id="insuranceForm" action="https://exodonprofits.app.n8n.cloud/webhook/insurance-policy-submit" method="POST">
        <div id="policyContainer">
          <!-- One policy block -->
          <label>Name (optional)</label>
          <input type="text" name="name" />

          <label>Email (optional)</label>
          <input type="email" name="email" />

          <label>Policy Type</label>
          <select name="policy_type">
            <option value="Auto">Auto</option>
            <option value="Home">Home</option>
            <option value="Rental">Rental Property</option>
            <option value="Business">Business</option>
            <option value="Umbrella">Umbrella</option>
            <option value="Other">Other</option>
          </select>

          <label>Ownership</label>
          <select name="ownership">
            <option value="Personal">Personal</option>
            <option value="Business">Business</option>
          </select>

          <label>Business Name (if any)</label>
          <input type="text" name="business_name" />

          <label>Insurance Provider</label>
          <input type="text" name="provider" />

          <label>Monthly Premium</label>
          <input type="number" step="0.01" name="monthly_premium" />

          <label>Yearly Premium</label>
          <input type="number" step="0.01" name="yearly_premium" />

          <label>Coverage Amount</label>
          <input type="number" step="0.01" name="coverage_amount" />

          <label>Deductible</label>
          <input type="number" step="0.01" name="deductible" />

          <label>Effective Date</label>
          <input type="date" name="effective_date" />

          <label>Expiration Date</label>
          <input type="date" name="expiration_date" />

          <label>Bundled?</label>
          <select name="bundled">
            <option value="Y">Yes</option>
            <option value="N">No</option>
          </select>

          <label>Notes or Special Requests</label>
          <textarea name="notes" rows="4"></textarea>
        </div>

        <button type="submit">Submit & Check Savings</button>
      </form>
    </div>
  </div>
</body>
</html>
