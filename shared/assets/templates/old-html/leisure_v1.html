<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>✈️ Leisure | GenieSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
          --primary: #2BFFD9;
          --secondary: #7C3AED;
          --background: #0F172A;
          --text: #F8FAFC;
        }

        body {
          font-family: 'Inter', sans-serif;
          background-color: var(--background);
          color: var(--text);
          margin: 0;
          padding: 40px 20px;
          text-align: center;
        }

        h1 {
          font-size: 2.5rem;
          background: linear-gradient(45deg, var(--primary), var(--secondary));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        p {
          font-size: 1.1rem;
          max-width: 800px;
          margin: 0 auto 2rem;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 24px;
          max-width: 1000px;
          margin: 0 auto 40px;
        }

        a.card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    a.card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(43, 255, 217, 0.15);
    }

    .card .icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 10px 0 5px;
      font-size: 1.4rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card p {
      margin: 4px 0;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .card .desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 8px;
    }

        .icon {
          font-size: 2rem;
          margin-bottom: 10px;
        }

        h2 {
          font-size: 1.25rem;
          background: linear-gradient(45deg, var(--primary), var(--secondary));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 6px;
        }

        .back-button {
          background: linear-gradient(45deg, var(--primary), var(--secondary));
          color: var(--background);
          text-decoration: none;
          padding: 0.6rem 1.5rem;
          border-radius: 1rem;
          font-weight: 600;
          font-size: 1rem;
        }

        .back-button:hover {
          opacity: 0.9;
          transform: translateY(-2px);
        }
      </style>
</head>
<body>
<h1>✈️ Leisure</h1>
<p>Enjoy More with lifestyle planning tools.</p>
<div class="grid">
  <a class="card" href="smarttravelhub/index.html"><div class="icon">🌍</div><h2>Smart Travel Hub</h2><p>Plan your trips, cruises, and get AI itineraries.</p></a>
  <a class="card" href="friendcompatibility/friend_or_lover_compatibility.html"><div class="icon">❤️</div><h2>Compatibility Checker</h2><p>See how compatible you are with friends or partners.</p></a></div>
<a class="back-button" href="dashboard.html">⬅️ Back to Dashboard</a>
</body>
</html>
