<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VoyageGenie.Com - AI Travel Planner | Smart Journey Builder</title>
<style>
        :root {
            --primary: #2A6BCC;
            --primary-light: #E8F1FF;
            --background: #F8FAFF;
            --border: #D1DAEB;
            --text: #2C3E50;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1488085061387-422e29b40080?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            animation: backgroundCycle 30s infinite;
        }

        @keyframes backgroundCycle {
            0% { background-position: center; }
            50% { background-position: top right; }
            100% { background-position: center; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 2rem;
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .form-section {
            margin-bottom: 1.8rem;
            padding: 1.5rem;
            background: rgba(251,252,254,0.9);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
        }

        .form-section:hover {
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-icon {
            width: 32px;
            height: 32px;
            background: var(--primary-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42,107,204,0.1);
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .option-card {
            padding: 1.2rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: white;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .option-card.selected::after {
            content: "✓";
            position: absolute;
            top: 12px;
            right: 12px;
            color: var(--primary);
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #1E5499);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }

        .loading-spinner {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #form-status {
            display: none;
            padding: 1rem;
            border-radius: var(--radius);
            margin-top: 1rem;
            text-align: center;
        }

        .success { background: #e8f6ef; color: #2a6bcc; }
        .error { background: #ffe8e8; color: #cc2a2a; }

        .airport-select {
            appearance: none;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232A6BCC"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 12px center/16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .option-grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 1rem;
                background-attachment: fixed;
            }
        }
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('travelForm');
  const airportSelect = document.getElementById('airportSelect');
  const customAirportInput = document.getElementById('customAirportInput');
  const destinationSelect = document.querySelector('select[name="destination"]');
  const customDestinationInput = document.getElementById('customDestinationInput');
  const customDestinationDiv = document.querySelector('.custom-destination-input');
  const showOnScreen = document.getElementById('showOnScreen');
  const outputBox = document.getElementById('travelPlanDisplay');
  const submitBtn = form.querySelector('button[type="submit"]');

  airportSelect.addEventListener('change', function () {
    const customAirportDiv = document.querySelector('.custom-airport-input');
    if (this.value === 'OTHER') {
      customAirportDiv.style.display = 'block';
      customAirportInput.disabled = false;
      customAirportInput.required = true;
    } else {
      customAirportDiv.style.display = 'none';
      customAirportInput.disabled = true;
      customAirportInput.required = false;
    }
  });

  destinationSelect.addEventListener('change', function () {
    if (this.value === 'OTHER') {
      customDestinationDiv.style.display = 'block';
      customDestinationInput.disabled = false;
      customDestinationInput.required = true;
    } else {
      customDestinationDiv.style.display = 'none';
      customDestinationInput.disabled = true;
      customDestinationInput.required = false;
    }
  });

  window.addEventListener('pageshow', function () {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Processing... <div class="loading-spinner" style="display:inline-block;"></div>';

    const formData = new FormData(form);

    if (airportSelect.value === 'OTHER') {
      const typed = customAirportInput.value.trim();
      if (typed) formData.set('departureLocation', typed);
    }

    if (destinationSelect.value === 'OTHER') {
      const typed = customDestinationInput.value.trim();
      if (typed) formData.set('destination', typed);
    }

    fetch('https://exodonprofits.app.n8n.cloud/webhook/travel-agent', {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (showOnScreen.checked && data.message && typeof data.message === "string") {
        outputBox.innerText = data.message;
        outputBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
      } else {
        window.location.href = 'workflow_confirmation.html';
      }
    })
    .catch(() => {
      alert("Submission failed. Please try again.");
      submitBtn.disabled = false;
      submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
    });
  });
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('travelForm');
  const airportSelect = document.getElementById('airportSelect');
  const customAirportInput = document.getElementById('customAirportInput');
  const destinationSelect = document.querySelector('select[name="destination"]');
  const customDestinationInput = document.getElementById('customDestinationInput');
  const customDestinationDiv = document.querySelector('.custom-destination-input');
  const showOnScreen = document.getElementById('showOnScreen');
  const outputBox = document.getElementById('travelPlanDisplay');
  const emailInput = document.querySelector('input[name="email"]');
  const submitBtn = form.querySelector('button[type="submit"]');

  airportSelect.addEventListener('change', function () {
    const customAirportDiv = document.querySelector('.custom-airport-input');
    if (this.value === 'OTHER') {
      customAirportDiv.style.display = 'block';
      customAirportInput.disabled = false;
      customAirportInput.required = true;
    } else {
      customAirportDiv.style.display = 'none';
      customAirportInput.disabled = true;
      customAirportInput.required = false;
    }
  });

  destinationSelect.addEventListener('change', function () {
    if (this.value === 'OTHER') {
      customDestinationDiv.style.display = 'block';
      customDestinationInput.disabled = false;
      customDestinationInput.required = true;
    } else {
      customDestinationDiv.style.display = 'none';
      customDestinationInput.disabled = true;
      customDestinationInput.required = false;
    }
  });

  window.addEventListener('pageshow', function () {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const wantsEmail = emailInput.value.trim() !== "";
    const wantsScreen = showOnScreen.checked;

    if (!wantsEmail && !wantsScreen) {
      alert("Please either enter your email or check 'Display travel plan on screen' before submitting.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Processing... <div class="loading-spinner" style="display:inline-block;"></div>';

    const formData = new FormData(form);

    if (airportSelect.value === 'OTHER') {
      const typed = customAirportInput.value.trim();
      if (typed) formData.set('departureLocation', typed);
    }

    if (destinationSelect.value === 'OTHER') {
      const typed = customDestinationInput.value.trim();
      if (typed) formData.set('destination', typed);
    }

    fetch('https://exodonprofits.app.n8n.cloud/webhook/travel-agent', {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (wantsScreen && data.message && typeof data.message === "string") {
        outputBox.innerText = data.message;
        outputBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
      } else {
        window.location.href = 'workflow_confirmation.html';
      }
    })
    .catch(() => {
      alert("Submission failed. Please try again.");
      submitBtn.disabled = false;
      submitBtn.innerHTML = '🚀 Generate Travel Plan <div class="loading-spinner" style="display:none;"></div>';
    });
  });
});
</script>
