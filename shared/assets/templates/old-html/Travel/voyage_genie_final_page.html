<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voyage Genie – AI Travel Planner</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.85);
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
      text-align: center;
    }

    .logo img {
      width: 60px;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 2.2em;
      color: #0a1d44;
      margin: 0;
    }

    .logo h2 {
      font-size: 1.2em;
      color: #333;
      margin-top: 10px;
    }

    h3 {
      margin-bottom: 20px;
      font-size: 1.1em;
      text-align: center;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      background-color: #ff9900;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #e68a00;
    }

    @media (max-width: 500px) {
      .overlay {
        margin: 40px 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Genie_Lamp_Icon.svg/1024px-Genie_Lamp_Icon.svg.png" alt="Voyage Genie Logo">
    <h1>Voyage Genie</h1>
    <h2>AI TRAVEL PLANNER</h2>
  </div>

  <div class="overlay">
    <h3>Plan your trip with ease</h3>
    <form action="https://your-n8n-webhook-url" method="POST">
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <select name="destination" required>
        <option value="">Select Destination</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Santorini">Santorini</option>
        <option value="New York">New York</option>
        <option value="Bali">Bali</option>
      </select>
      <div style="display:flex; gap:10px;">
        <input type="date" name="startDate" placeholder="Start Date" style="flex:1">
        <input type="date" name="endDate" placeholder="End Date" style="flex:1">
      </div>
      <input type="number" name="budget" placeholder="Budget">
      <select name="interests">
        <option value="">Interests</option>
        <option value="Relaxation">Relaxation</option>
        <option value="Adventure">Adventure</option>
        <option value="Culture">Culture</option>
        <option value="Food">Food</option>
      </select>
      <button type="submit">Get Itinerary</button>
    </form>
  </div>
</body>
</html>
