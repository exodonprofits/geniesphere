<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voyage Genie – AI Travel Planner</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') no-repeat center center fixed;
      background-size: cover;
      transition: background-image 1s ease-in-out;
    }
    .container {
      max-width: 700px;
      margin: 60px auto;
      background: rgba(255,255,255,0.92);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    h3 {
      font-size: 1.2rem;
      margin-top: 20px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background-color: #ff9900;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e68a00;
    }
  </style>
</head>
<body>
  <div class="container">
    
<header style="text-align:center; margin-bottom: 2rem;">
    <img src="voyage_genie_logo_final.png" alt="Voyage Genie Logo" style="height:80px; margin-bottom: 10px;">
    <h1 style="font-size:2.5rem; color:#0a3d62; margin:0;">Voyage Genie</h1>
    <p style="font-size:1.2rem; color:#444;">Plan Less, Explore More</p>
</header>

    <form action="https://exodonprofits.app.n8n.cloud/webhook-test/travel-agent" method="POST">
      <h3>Departure Location</h3>
      <input type="text" name="departureLocation" placeholder="Enter city or airport" required>

      <h3>Destination</h3>
      <select name="destination" required>
        <option value="">Select Destination</option>
        <option>Aruba</option>
        <option>Bahamas</option>
        <option>Turks & Caicos</option>
        <option>Cancun</option>
        <option>Hawaii</option>
        <option>Florida</option>
        <option>Las Vegas</option>
      </select>

      <h3>Travel Dates</h3>
      <input type="date" name="startDate" required>
      <input type="date" name="endDate" required>

      <h3>Trip Type</h3>
      <select name="tripType" required>
        <option>Solo</option>
        <option>Couple</option>
        <option>Family</option>
        <option>Group</option>
        <option>Honeymoon</option>
      </select>

      <h3>Group Size</h3>
      <select name="groupSize" required>
        <option value="1">1 Traveler</option>
        <option value="2">2 People</option>
        <option value="3-4">3–4 People</option>
        <option value="5+">5+ People</option>
      </select>

      <h3>Age Ranges</h3>
      <select name="ageRange" required>
        <option>Kids</option>
        <option>Teens</option>
        <option>Adults</option>
        <option>MiddleAge</option>
        <option>Seniors</option>
      </select>

      <h3>Budget (USD)</h3>
      <input type="number" name="budget" placeholder="Estimated budget">

      <h3>Email</h3>
      <input type="email" name="email" placeholder="Enter your email" required>

      <button type="submit">✨ Get Your Smart Itinerary</button>
    </form>
  </div>
</body>
</html>
