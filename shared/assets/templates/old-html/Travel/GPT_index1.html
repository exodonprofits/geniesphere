<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plan Your Trip – AI Travel Planner</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
      background-size: cover;
      background-position: center;
      height: 60vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 3em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .form-section {
      background: white;
      max-width: 700px;
      margin: -80px auto 40px auto;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    h2 {
      color: #333;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 10px;
    }

    .inline-options label {
      display: inline-block;
      margin-right: 20px;
    }

    input[type="submit"] {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Plan Your Trip<br><small>AI Travel Planner</small></h1>
  </div>

  <div class="form-section">
    <form action="https://exodonprofits.app.n8n.cloud/webhook-test/travel-agent" method="POST">

      <h2>Destination</h2>
      <select name="destination">
        <option value="">— Select a destination —</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Paris">Paris</option>
        <option value="Bali">Bali</option>
        <option value="New York">New York</option>
        <option value="Rome">Rome</option>
        <option value="Santorini">Santorini</option>
        <option value="Venice">Venice</option>
      </select>

      <h2>Dates</h2>
      <input type="date" name="startDate" placeholder="Start Date" />
      <input type="date" name="endDate" placeholder="End Date" />

      <h2>Budget</h2>
      <input type="number" name="budget" placeholder="e.g. 2000" />

      <h2>Type of Trip</h2>
      <div class="inline-options">
        <label><input type="radio" name="tripType" value="Solo"> Solo Trip</label>
        <label><input type="radio" name="tripType" value="Couple"> Couple’s Getaway</label>
        <label><input type="radio" name="tripType" value="Family"> Family Vacation</label>
        <label><input type="radio" name="tripType" value="Group"> Group Trip</label>
        <label><input type="radio" name="tripType" value="Honeymoon"> Honeymoon</label>
      </div>

      <h2>Group Size</h2>
      <div class="inline-options">
        <label><input type="radio" name="groupSize" value="1"> Just me</label>
        <label><input type="radio" name="groupSize" value="2"> 2 people</label>
        <label><input type="radio" name="groupSize" value="3-4"> 3–4 people</label>
        <label><input type="radio" name="groupSize" value="5+"> 5+ people</label>
      </div>

      <h2>Age Ranges</h2>
      <div class="inline-options">
        <label><input type="checkbox" name="ageRange" value="Kids"> Kids (0–12)</label>
        <label><input type="checkbox" name="ageRange" value="Teens"> Teens (13–19)</label>
        <label><input type="checkbox" name="ageRange" value="Adults"> Adults (20–39)</label>
        <label><input type="checkbox" name="ageRange" value="MiddleAge"> Adults (40–64)</label>
        <label><input type="checkbox" name="ageRange" value="Seniors"> Seniors (65+)</label>
      </div>

      <h2>Your Email</h2>
      <input type="email" name="email" placeholder="Email to send your plan" required />

      <input type="submit" value="Get My Travel Plan" />
    </form>
  </div>
</body>
</html>
