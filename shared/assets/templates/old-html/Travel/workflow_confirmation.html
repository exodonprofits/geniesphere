
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Plan Submitted</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f8fb;

      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {

    }
    p {

      padding: 12px 24px;

      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover {
      background-color: #0077b6;
    }

</head>
<body>
  <div class="card">
    <h1>✅ Your Travel Plan Request Was Submitted</h1>
