
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voyage Genie – Travel Planner</title>
</head>
<body>
  <form id="travelForm" method="POST" action="https://exodonprofits.app.n8n.cloud/webhook-test/travel-agent">
    <div class="form-group">
      <label for="airportSelect">Departure Location</label>
      <select id="airportSelect" name="departureLocation" required>
        <option value="" disabled selected>Select your departure airport</option>
        <option value="LAX">Los Angeles International Airport (LAX)</option>
        <option value="JFK">John F. Kennedy International Airport (JFK)</option>
        <option value="ORD">Chicago O'Hare International Airport (ORD)</option>
        <option value="ATL">Hartsfield-Jackson Atlanta International Airport (ATL)</option>
        <option value="OTHER">Can't find my airport ➔</option>
      </select>
    </div>
    <div class="form-group custom-airport-input" style="display: none;">
      <label for="customAirportInput">Enter your departure location</label>
      <input type="text" id="customAirportInput" placeholder="Type your departure airport..." disabled>
    </div>

    <div class="form-group">
      <label for="destinationSelect">Destination</label>
      <select id="destinationSelect" name="destination" required>
        <option value="" disabled selected>Select your destination</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Paris">Paris</option>
        <option value="London">London</option>
        <option value="Rome">Rome</option>
        <option value="Bangkok">Bangkok</option>
        <option value="OTHER">Can't find my destination ➔</option>
      </select>
    </div>
    <div class="form-group custom-destination-input" style="display: none;">
      <label for="customDestinationInput">Enter your destination</label>
      <input type="text" id="customDestinationInput" placeholder="Type your destination..." disabled>
    </div>

    <input type="text" name="budget" placeholder="Budget" />
    <input type="text" name="tripType" placeholder="Trip Type" />
    <input type="text" name="groupSize" placeholder="Group Size" />
    <input type="text" name="ageRange" placeholder="Age Range" />
    <input type="date" name="startDate" />
    <input type="date" name="endDate" />
    <input type="email" name="email" placeholder="Email" />

    <button type="submit">Submit</button>
  </form>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById('travelForm');
    const airportSelect = document.getElementById('airportSelect');
    const customAirport = document.getElementById('customAirportInput');
    const destinationSelect = document.getElementById('destinationSelect');
    const customDestination = document.getElementById('customDestinationInput');

    // Show/hide custom airport input
    airportSelect.addEventListener('change', function () {
      const div = document.querySelector('.custom-airport-input');
      if (this.value === 'OTHER') {
        div.style.display = 'block';
        customAirport.disabled = false;
        customAirport.required = true;
      } else {
        div.style.display = 'none';
        customAirport.disabled = true;
        customAirport.required = false;
      }
    });

    // Show/hide custom destination input
    destinationSelect.addEventListener('change', function () {
      const div = document.querySelector('.custom-destination-input');
      if (this.value === 'OTHER') {
        div.style.display = 'block';
        customDestination.disabled = false;
        customDestination.required = true;
      } else {
        div.style.display = 'none';
        customDestination.disabled = true;
        customDestination.required = false;
      }
    });

    // On submit: override names if using custom fields
    form.addEventListener('submit', function () {
      if (airportSelect.value === 'OTHER') {
        airportSelect.removeAttribute('name');
        customAirport.name = 'departureLocation';
      }
      if (destinationSelect.value === 'OTHER') {
        destinationSelect.removeAttribute('name');
        customDestination.name = 'destination';
      }
    });
  });
  </script>
</body>
</html>
