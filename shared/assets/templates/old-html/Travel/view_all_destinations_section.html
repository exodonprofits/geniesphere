
<div id="all-destinations" style="display:none; margin-top: 3rem;">
  <h2 style="color:#2A6BCC;">🌴 View All Destinations</h2>
  <p>Click on an image to auto-fill the destination field.</p>

  <style>
    .destination-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .destination-tile {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .destination-tile img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }
    .destination-tile:hover img {
      transform: scale(1.05);
    }
    .destination-tile span {
      position: absolute;
      bottom: 12px;
      left: 12px;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 6px rgba(0,0,0,0.6);
    }
  </style>

  <div class="destination-grid">
    <div class="destination-tile" onclick="selectDestination('Cancun')">
      <img src="https://www.funjet.com/cmsassets/2023/09/cancun.jpg" alt="Cancun">
      <span>Cancun</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Cozumel')">
      <img src="https://www.funjet.com/cmsassets/2023/09/cozumel.jpg" alt="Cozumel">
      <span>Cozumel</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Los Cabos')">
      <img src="https://www.funjet.com/cmsassets/2023/09/los-cabos.jpg" alt="Los Cabos">
      <span>Los Cabos</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Jamaica')">
      <img src="https://www.funjet.com/cmsassets/2023/09/jamaica.jpg" alt="Jamaica">
      <span>Jamaica</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Paris')">
      <img src="https://www.funjet.com/cmsassets/2023/09/paris.jpg" alt="Paris">
      <span>Paris</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Maui')">
      <img src="https://www.funjet.com/cmsassets/2023/09/maui.jpg" alt="Maui">
      <span>Maui</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Riviera Maya')">
      <img src="https://www.funjet.com/cmsassets/2023/09/riviera-maya.jpg" alt="Riviera Maya">
      <span>Riviera Maya</span>
    </div>
    <div class="destination-tile" onclick="selectDestination('Greek Islands')">
      <img src="https://www.funjet.com/cmsassets/2023/09/greece.jpg" alt="Greek Islands">
      <span>Greek Islands</span>
    </div>
  </div>

  <script>
    function selectDestination(name) {
      const select = document.querySelector('select[name="destination"]');
      const customInput = document.querySelector('input[name="customDestination"]');
      if (select) select.value = '';
      if (customInput) customInput.value = name;
      document.getElementById('all-destinations').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</div>
