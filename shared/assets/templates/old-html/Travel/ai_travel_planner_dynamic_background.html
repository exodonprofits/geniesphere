<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plan Your Trip – AI Travel Planner</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
    }

    .hero {
      height: 55vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease-in-out;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: #e0e0e0;
    }

    .form-container {
      background: white;
      max-width: 650px;
      margin: -60px auto 40px;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .inline-options {
      margin-top: 10px;
    }

    .inline-options label {
      display: inline-block;
      margin-right: 15px;
      font-weight: 400;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 8px;
    }

    input[type="submit"] {
      background-color: #0066ff;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
    }

    input[type="submit"]:hover {
      background-color: #004fcc;
    }
  </style>
</head>
<body>
  <div class="hero" id="heroSection">
    <h1>Plan Your Trip</h1>
    <p>AI Travel Planner</p>
  </div>

  <div class="form-container">
    <form action="https://your-n8n-webhook-url" method="POST">
      <h2>Destination</h2>
      <label>Choose or enter your destination:</label>
      <select name="destination">
        <option value="">— Select a destination —</option>
        <option value="Tokyo">Tokyo</option>
        <option value="Paris">Paris</option>
        <option value="Bali">Bali</option>
        <option value="New York">New York</option>
        <option value="Rome">Rome</option>
        <option value="Santorini">Santorini</option>
        <option value="Venice">Venice</option>
      </select>
      <input type="text" name="customDestination" placeholder="Or type your own" />

      <h2>Dates</h2>
      <label>Start Date:</label>
      <input type="date" name="startDate" />
      <label>End Date:</label>
      <input type="date" name="endDate" />

      <h2>Budget</h2>
      <input type="number" name="budget" placeholder="e.g. 2000" />

      <h2>Type of Trip</h2>
      <div class="inline-options">
        <label><input type="radio" name="tripType" value="Solo"> Solo Trip</label>
        <label><input type="radio" name="tripType" value="Couple"> Couple’s Getaway</label>
        <label><input type="radio" name="tripType" value="Family"> Family Vacation</label>
        <label><input type="radio" name="tripType" value="Group"> Group Trip</label>
        <label><input type="radio" name="tripType" value="Honeymoon"> Honeymoon</label>
      </div>

      <h2>Group Size</h2>
      <div class="inline-options">
        <label><input type="radio" name="groupSize" value="1"> Just me</label>
        <label><input type="radio" name="groupSize" value="2"> 2 people</label>
        <label><input type="radio" name="groupSize" value="3-4"> 3–4 people</label>
        <label><input type="radio" name="groupSize" value="5+"> 5+ people</label>
      </div>

      <h2>Age Ranges</h2>
      <div class="inline-options">
        <label><input type="checkbox" name="ageRange" value="Kids"> Kids (0–12)</label>
        <label><input type="checkbox" name="ageRange" value="Teens"> Teens (13–19)</label>
        <label><input type="checkbox" name="ageRange" value="Adults"> Adults (20–39)</label>
        <label><input type="checkbox" name="ageRange" value="MiddleAge"> Adults (40–64)</label>
        <label><input type="checkbox" name="ageRange" value="Seniors"> Seniors (65+)</label>
      </div>

      <h2>Your Email</h2>
      <input type="email" name="email" placeholder="Email to send your plan" required />

      <input type="submit" value="Get My Travel Plan" />
    </form>
  </div>

  <script>
    const images = [
      'https://images.unsplash.com/photo-1579037763110-dbe3c8a47f3c',
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb',
      'https://images.unsplash.com/photo-1587502536263-9298e04ab0f4',
      'https://images.unsplash.com/photo-1502920917128-1aa500764ce5',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee'
    ];
    const hero = document.getElementById('heroSection');
    const randomIndex = Math.floor(Math.random() * images.length);
    hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.3)), url('${images[randomIndex]}')`;
  </script>
</body>
</html>
