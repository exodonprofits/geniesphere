<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | GenieSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2BFFD9;
      --secondary: #7C3AED;
      --background: #0F172A;
      --text: #F8FAFC;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }

    .button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      color: var(--background);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #94A3B8;
    }
  </style>
</head>
<body>

  <h1>Welcome to GenieSphere</h1>
  <p>Transform Your Digital Life with AI</p>
  <a href="/dashboard" class="button">Enter Dashboard</a>

  <footer>
    © 2025 GenieSphere. All rights reserved.
  </footer>

</body>
</html>
