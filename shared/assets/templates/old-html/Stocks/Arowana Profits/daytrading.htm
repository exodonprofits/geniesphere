<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Day Trading Suite - Arowana Profits</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.7.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --primary-green: #00ff88;
            --alert-red: #ff4444;
            --background-dark: #0a0e14;
            --market-depth-bid: #003300;
            --market-depth-ask: #330000;
        }

        body {
            margin: 0;
            font-family: 'Roboto Mono', monospace;
            background: var(--background-dark);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 8px;
            height: 100vh;
            padding: 8px;
        }

        .chart-container {
            background: #12181f;
            border-radius: 4px;
            position: relative;
        }

        .trading-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 8px;
        }

        .order-machine {
            background: #12181f;
            padding: 15px;
            border-radius: 4px;
        }

        .market-depth {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8em;
        }

        .hft-controls {
            background: #12181f;
            padding: 15px;
            border-radius: 4px;
        }

        .bid-row, .ask-row {
            padding: 2px 5px;
            margin: 1px 0;
        }

        .bid-row { background: var(--market-depth-bid); }
        .ask-row { background: var(--market-depth-ask); }

        .execution-panel {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: #2a2f36;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        button.buy { background: var(--primary-green); }
        button.sell { background: var(--alert-red); }

        .performance-stats {
            display: grid;
            gap: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Main Chart Area -->
        <div class="chart-container">
            <div id="priceChart"></div>
        </div>

        <!-- Trading Panel -->
        <div class="trading-panel">
            <div class="order-machine">
                <div class="market-depth">
                    <div class="bids">
                        <h4>Bids</h4>
                        <div id="bidLevels"></div>
                    </div>
                    <div class="asks">
                        <h4>Asks</h4>
                        <div id="askLevels"></div>
                    </div>
                </div>
                
                <div class="execution-panel">
                    <input type="number" id="qty" value="100" step="100">
                    <button class="buy" data-hotkey="F1">BUY MKT</button>
                    <button class="sell" data-hotkey="F2">SELL MKT</button>
                </div>
            </div>

            <div class="hft-controls">
                <h4>Algorithmic Scalping</h4>
                <div class="strategy-params">
                    <label>Spread Capture (bps): <input type="number" id="spreadCapture" value="2"></label>
                    <label>Order Duration (ms): <input type="number" id="orderDuration" value="50"></label>
                    <label>Max Position: <input type="number" id="maxPos" value="1000"></label>
                </div>
                <div class="strategy-controls">
                    <button id="startHFT">Start HFT Bot</button>
                    <button id="flushPositions">Flat Position</button>
                </div>
            </div>

            <div class="performance-stats">
                <div>Position: <span id="currentPosition">0</span></div>
                <div>P&L: <span id="pnl">$0.00</span></div>
                <div>Latency: <span id="latency">17ms</span></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_KEY = 'YOUR_API_KEY'; // Replace with your Alpha Vantage key
        const SYMBOL = 'SPY';
        let chart, candlestickSeries, tradingEngine;

        // Initialize Trading Engine
        function initializeTrading() {
            chart = LightweightCharts.createChart(document.getElementById('priceChart'), {
                width: document.getElementById('priceChart').clientWidth,
                height: document.getElementById('priceChart').clientHeight,
                layout: {
                    backgroundColor: '#12181f',
                    textColor: 'rgba(255, 255, 255, 0.7)',
                },
                grid: {
                    vertLines: { color: 'rgba(255, 255, 255, 0.05)' },
                    horzLines: { color: 'rgba(255, 255, 255, 0.05)' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: true,
                },
            });

            candlestickSeries = chart.addCandlestickSeries();
            tradingEngine = new TradingEngine();
            generateMarketData();
        }

        // Trading Engine Class
        class TradingEngine {
            constructor() {
                this.position = 0;
                this.pnl = 0;
                this.hftActive = false;
                this.currentPrice = 150.00;
                this.orderBook = this.generateOrderBook();
                this.priceHistory = [];
            }

            generateOrderBook() {
                return {
                    bids: Array(5).fill().map((_, i) => ({
                        price: this.currentPrice - 0.05 * (i + 1),
                        size: Math.floor(Math.random() * 1000)
                    })),
                    asks: Array(5).fill().map((_, i) => ({
                        price: this.currentPrice + 0.05 * (i + 1),
                        size: Math.floor(Math.random() * 1000)
                    }))
                };
            }

            marketOrder(side, quantity) {
                const executionPrice = side === 'buy' 
                    ? this.orderBook.asks[0].price
                    : this.orderBook.bids[0].price;

                this.position += side === 'buy' ? quantity : -quantity;
                this.pnl += (this.currentPrice - executionPrice) * quantity * (side === 'sell' ? 1 : -1);
                this.updatePerformanceDisplay();
            }

            updatePerformanceDisplay() {
                document.getElementById('currentPosition').textContent = this.position;
                document.getElementById('pnl').textContent = `$${this.pnl.toFixed(2)}`;
            }
        }

        // Real Market Data Fetch
        async function fetchRealMarketData() {
            try {
                const response = await fetch(
                    `https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=${SYMBOL}&interval=5min&apikey=${API_KEY}&outputsize=compact&datatype=json`
                );
                const data = await response.json();
                const timeSeries = data['Time Series (5min)'];
                const latest = Object.values(timeSeries)[0];
                
                return {
                    price: parseFloat(latest['4. close']),
                    time: new Date(Object.keys(timeSeries)[0]).getTime() / 1000
                };
            } catch (error) {
                console.error('Using simulated data due to error:', error);
                return null;
            }
        }

        // Market Data Generator
        async function generateMarketData() {
            const realData = await fetchRealMarketData();
            
            if(realData) {
                tradingEngine.currentPrice = realData.price;
                candlestickSeries.update({
                    time: realData.time,
                    open: realData.price,
                    high: realData.price,
                    low: realData.price,
                    close: realData.price
                });
                
                // Real data refresh every 5 minutes
                setTimeout(generateMarketData, 300000);
            } else {
                // Fallback to simulated data
                tradingEngine.currentPrice += (Math.random() - 0.5) * 0.1;
                tradingEngine.currentPrice = Math.round(tradingEngine.currentPrice * 100) / 100;
                
                candlestickSeries.update({
                    time: Date.now()/1000,
                    open: tradingEngine.currentPrice,
                    high: tradingEngine.currentPrice + 0.05,
                    low: tradingEngine.currentPrice - 0.05,
                    close: tradingEngine.currentPrice,
                });

                // Simulated data refresh every 5 seconds
                setTimeout(generateMarketData, 5000);
            }

            tradingEngine.orderBook = tradingEngine.generateOrderBook();
            updateOrderBookDisplay();
        }

        // Order Book Display
        function updateOrderBookDisplay() {
            document.getElementById('bidLevels').innerHTML = tradingEngine.orderBook.bids
                .map(b => `<div class="bid-row">${b.price.toFixed(2)} × ${b.size}</div>`)
                .join('');
            
            document.getElementById('askLevels').innerHTML = tradingEngine.orderBook.asks
                .map(a => `<div class="ask-row">${a.price.toFixed(2)} × ${a.size}</div>`)
                .join('');
        }

        // Event Listeners
        document.querySelector('.buy').addEventListener('click', () => tradingEngine.marketOrder('buy', 100));
        document.querySelector('.sell').addEventListener('click', () => tradingEngine.marketOrder('sell', 100));
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F1') tradingEngine.marketOrder('buy', 100);
            if (e.key === 'F2') tradingEngine.marketOrder('sell', 100);
        });

        // Initialize
        window.onload = initializeTrading;
    </script>
</body>
</html>
