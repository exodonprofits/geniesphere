<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Genie Post Uploader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2BFFD9;
      --secondary: #7C3AED;
      --background: #0F172A;
      --text: #F8FAFC;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 2rem;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    h2 {
      font-size: 2rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      text-align: center;
    }

    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: 600;
    }

    input[type="file"], textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: none;
      margin-bottom: 1rem;
      font-family: 'Inter', sans-serif;
    }

    .checkboxes {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .checkboxes label {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkboxes input[type="checkbox"] {
      transform: scale(1.3);
    }

    .preview {
      margin-top: 1rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 1rem;
      border-radius: 1rem;
    }

    .preview img {
      max-width: 100%;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }

    .card-button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: var(--background);
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📣 Create Marketing Post</h2>
    <form id="postForm">
      <label for="image">Upload Image</label>
      <input type="file" id="image" accept="image/*" required />

      <label for="caption">Caption</label>
      <textarea id="caption" rows="4" placeholder="Write your social media caption..."></textarea>

      <label>Choose Platforms</label>
      <div class="checkboxes">
        <label><input type="checkbox" id="facebook"> Facebook</label>
        <label><input type="checkbox" id="instagram"> Instagram</label>
        <label><input type="checkbox" id="twitter"> Twitter</label>
        <label><input type="checkbox" id="linkedin"> LinkedIn</label>
      </div>

      <label>Preview</label>
      <div class="preview">
        <img id="previewImage" style="display:none;" />
        <textarea id="previewCaption" rows="4" style="width: 100%; background: rgba(0,0,0,0.1); border: none; color: white;"></textarea>
      </div>

      <button type="submit" class="card-button">Submit to Social Media</button>
    </form>
  </div>

  <script>
    const imageInput = document.getElementById('image');
    const previewImage = document.getElementById('previewImage');
    const captionInput = document.getElementById('caption');
    const previewCaption = document.getElementById('previewCaption');

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          previewImage.src = reader.result;
          previewImage.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    captionInput.addEventListener('input', () => {
      previewCaption.value = captionInput.value;
    });

    previewCaption.addEventListener('input', () => {
      captionInput.value = previewCaption.value;
    });

    document.getElementById('postForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Your post is ready to be submitted to the selected platforms.');
    });
  </script>
</body>
</html>
