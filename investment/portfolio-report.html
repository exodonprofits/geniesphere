<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>📄 Portfolio Report – Export CSV / PDF</title>
<style>
:root{--bg:#f7f9fb;--ink:#0f172a;--muted:#64748b;--card:#fff;--brand:#10b981;--accent:#1e3a8a;--radius:14px;--shadow:0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
header{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #e5e7eb}
header h1{margin:0;color:var(--accent)} .wrap{max-width:1100px;margin:18px auto;padding:0 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:#334155;margin:10px 0 6px} input,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:0;border-radius:999px;padding:10px 16px;background:#3b82f6;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.save{background:var(--brand)} .btn.ghost{background:#e5e7eb;color:#111}
table{width:100%;border-collapse:collapse} th,td{border:1px solid #e5e7eb;padding:8px} th{background:#f1f5f9;text-align:left}


/* Print */
@media print{
header,.bar,#importCard{display:none}
body{background:#fff}
.card{box-shadow:none;border:0}
}
</style>
</head>
<body>
<header class="wrap"><h1>📄 Portfolio Report</h1><div class="wrap sub" style="color:#64748b">Load from Supabase or paste CSV. Export a CPA‑ready CSV and use browser Print → Save as PDF.</div></header>
<div class="wrap">
<section id="importCard" class="card">
<h2>Load Data</h2>
<div class="bar">
<button class="btn" id="loadSupabase">🔗 Load from Supabase</button>
<button class="btn ghost" id="downloadTemplate">⬇️ CSV Template</button>
</div>
<label>Or paste CSV (headers required)</label>
<textarea id="csv" rows="6" placeholder="name,address,value,loan_balance,monthly_rent,other_income,monthly_expenses"></textarea>
<div class="bar"><button class="btn save" id="parseCsv">📥 Import CSV</button></div>
</section>


<section class="card">
<h2>Portfolio Table</h2>
<div style="overflow:auto">
<table id="table"><thead><tr>
<th>Name</th><th>Address</th><th>Value</th><th>Loan</th><th>Rent</th><th>Other Inc</th><th>Expenses</th><th>NOI (mo)</th><th>Cash Flow (mo)</th>
</tr></thead><tbody></tbody></table>
</div>
<div class="bar">
<button class="btn" id="exportCsv">💾 Export CSV</button>
<button class="btn" onclick="window.print()">🖨️ Print / PDF</button>
</div>
</section>


<section class="card">
<h2>Summary</h2>
<div id="summary"></div>
</html>
